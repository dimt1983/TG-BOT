<script>
// Жёсткий cache-bust: убиваем service worker если он зарегистрирован старым и чистим cache storage
(function(){
  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
    }
    if (window.caches && caches.keys) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  } catch(e) {}
})();
</script>
<style>
  html { background: #FAF7F2; overscroll-behavior: none; }

  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overscroll-behavior: none; background-color: var(--bg, #FAF7F2); }
  #root { min-height: 100vh; padding-bottom: 110px; background: var(--bg, #FAF7F2); }
  .rb a { color: inherit; }
  .rb button { font: inherit; }
  @keyframes rb-blink { 50% { opacity: 0 } }
  .rb-cursor { display:inline-block; width:1.5px; height:17px; background:var(--copper); margin-left:1px; vertical-align:middle; animation: rb-blink 1s steps(2) infinite; }
  .rb-spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--ink-mute); border-top-color: var(--ink); border-radius:50%; animation: rb-spin 0.7s linear infinite; }

  .rb-toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:100; box-shadow: var(--sh-2); opacity:0; transition:opacity .2s; pointer-events:none; }
  .rb-toast.show { opacity: 1; }
</style>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   TELEGRAM SDK + AUTH
   ════════════════════════════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
try { tg?.ready?.(); tg?.expand?.(); } catch(e) {}
const IS_TG = !!(tg && tg.initData && tg.initData.length > 0);
// Бренд Roastberry — всегда светлый кремовый фон, независимо от темы Telegram/системы.
const IS_DARK = false;

function authHeaders() { return IS_TG ? { 'X-Tma-InitData': tg.initData } : {}; }
function haptic(kind = 'light') {
  try {
    if (kind === 'success' || kind === 'error' || kind === 'warning') tg?.HapticFeedback?.notificationOccurred?.(kind);
    else tg?.HapticFeedback?.impactOccurred?.(kind);
  } catch (e) {}
}
function askManagerFor(p, fasovka) {
  const size = fasovka?.size || fasovka || '';
  const text = `Здравствуйте! Подскажите по ${p?.name || 'товару'}${size ? ', фасовка ' + size : ''}.`;
  const url = `https://t.me/rcr_btb_bot?text=${encodeURIComponent(text)}`;
  if (tg?.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
function toast(msg, ms = 1600) {
  const el = document.getElementById('rb-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

const RB_CLIENT_SHOP_URL = 'https://tg-bot-production-ae5c.up.railway.app/tma/';
const RB_CLIENT_SHOP_TITLE = 'Магазин Roastberry';
const RB_CLIENT_SHOP_MESSAGE = 'Roastberry B2B: каталог, актуальные остатки и быстрый заказ.';

async function rbCopyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}

  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

function rbOpenExternalLink(url) {
  if (tg?.openLink) tg.openLink(url);
  else window.open(url, '_blank', 'noopener');
}

function rbCloseClientLinkDialog() {
  document.getElementById('rb-client-link-dialog')?.remove();
}

function rbShowClientLinkDialog() {
  rbCloseClientLinkDialog();
  const url = RB_CLIENT_SHOP_URL;
  const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(RB_CLIENT_SHOP_MESSAGE)}`;
  const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(RB_CLIENT_SHOP_MESSAGE + '\n' + url)}`;
  const el = document.createElement('div');
  el.id = 'rb-client-link-dialog';
  el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:grid;place-items:end center;background:rgba(20,15,10,.34);padding:16px;';
  el.innerHTML = `
    <div style="width:min(420px,100%);background:#FAF7F2;color:#1F1B16;border:1px solid rgba(31,27,22,.12);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.24);padding:18px;">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div style="flex:1;min-width:0;">
          <div style="font-family:var(--f-display);font-size:20px;font-weight:800;line-height:1.1;">Ссылка на магазин</div>
          <div style="margin-top:6px;color:var(--ink-soft);font-size:13px;line-height:1.35;">Готовая клиентская ссылка. Откроется в браузере, даже без Telegram.</div>
        </div>
        <button onclick="rbCloseClientLinkDialog()" style="width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#1F1B16;font-size:24px;line-height:1;cursor:pointer;">×</button>
      </div>
      <input id="rb-client-link-input" readonly value="${url}" style="margin-top:14px;width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;color:#1F1B16;padding:0 12px;font-size:13px;font-family:var(--f-mono);" />
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
        <button onclick="rbCopyClientLinkFromDialog()" style="height:46px;border:0;border-radius:999px;background:#1F1B16;color:#FAF7F2;font-weight:750;cursor:pointer;">Скопировать</button>
        <button onclick="rbOpenExternalLink('${url}')" style="height:46px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#1F1B16;font-weight:750;cursor:pointer;">Открыть</button>
        <button onclick="rbOpenExternalLink('${telegramUrl}')" style="height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#1F1B16;font-weight:700;cursor:pointer;">Telegram</button>
        <button onclick="rbOpenExternalLink('${whatsappUrl}')" style="height:44px;border:1px solid var(--line);border-radius:999px;background:#fff;color:#1F1B16;font-weight:700;cursor:pointer;">WhatsApp</button>
      </div>
    </div>`;
  el.addEventListener('click', e => { if (e.target === el) rbCloseClientLinkDialog(); });
  document.body.appendChild(el);
  const input = document.getElementById('rb-client-link-input');
  input?.focus();
  input?.select();
}

async function rbCopyClientLinkFromDialog() {
  const ok = await rbCopyText(RB_CLIENT_SHOP_URL);
  if (ok) {
    toast('Ссылка скопирована');
    haptic('success');
  } else {
    document.getElementById('rb-client-link-input')?.select();
    toast('Выдели ссылку и скопируй вручную', 2400);
    haptic('warning');
  }
}

async function rbShareWebLink() {
  const url = RB_CLIENT_SHOP_URL;
  if (navigator.share) {
    try {
      await navigator.share({ title: RB_CLIENT_SHOP_TITLE, text: RB_CLIENT_SHOP_MESSAGE, url });
      haptic('success');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
  }

  const ok = await rbCopyText(url);
  if (ok) {
    toast('Ссылка скопирована');
    haptic('success');
  } else {
    rbShowClientLinkDialog();
    haptic('warning');
  }
}

const STORAGE_KEY = 'rb-v2-state-1';
const PROFILE_KEY = 'rb-v2-profile-1';
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cart: STATE.cart, favorites: STATE.favorites })); } catch(e){}
}
function loadLocal() {
  try {
    const j = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    STATE.cart = j.cart || [];
    STATE.favorites = j.favorites || [];
  } catch(e){}
  try {
    const p = JSON.parse(localStorage.getItem(PROFILE_KEY) || 'null');
    if (p && typeof p === 'object') {
      STATE.contact = Object.assign(STATE.contact, p, {
        delivery: Object.assign(STATE.contact.delivery, p.delivery || {}),
        consent: false,            // согласие подтверждается заново каждый заказ
      });
    }
  } catch(e){}
}
function saveProfile() {
  try {
    const { consent, ...keep } = STATE.contact;  // согласие не персистим
    localStorage.setItem(PROFILE_KEY, JSON.stringify(keep));
  } catch(e){}
}

/* ════════════════════════════════════════════════════════════════════
   TASTE HUE AUTO-MAP — словарь нот → цвет + интенсивность
   ════════════════════════════════════════════════════════════════════ */
const TASTE_HUES = {
  // шоколад / какао
  'шоколад':'#6F4E37','тёмный шоколад':'#3A2A1F','молочный шоколад':'#8B5224','какао':'#6F4E37','патока':'#4A3422',
  // ягоды
  'ягоды':'#9C3B52','клубника':'#9C3B52','малина':'#9C3B52','клюква':'#9C3B52','чёрная смородина':'#5A2848','смородина':'#7A2E4E',
  'вишня':'#7A2E2E','копчёная вишня':'#5E2020','черника':'#3A2848',
  // косточковые
  'персик':'#E2B190','абрикос':'#D89060','слива':'#7A4A6E',
  // цитрус
  'цитрус':'#C97E3C','лимон':'#E0B83C','апельсин':'#D87830','бергамот':'#C97E3C','грейпфрут':'#D45E5E','лайм':'#C0D03C',
  // карамель / мёд
  'карамель':'#C9A66B','мёд':'#D4A953','тростниковый сахар':'#C9A66B','ваниль':'#E8D8A8',
  // орех
  'орех':'#A87C50','миндаль':'#B89172','фундук':'#A87C50','грецкий орех':'#8B6840',
  // фрукты
  'красное яблоко':'#9C3B52','яблоко':'#7A9B5E','груша':'#A8C079','банан':'#E8D560',
  // тропики
  'тропики':'#E8B73C','манго':'#E0A032','ананас':'#E0B83C','личи':'#E8B7C8','маракуйя':'#E2B53C','папайя':'#E08050',
  // цветочные
  'жасмин':'#C087B7','роза':'#C46A8E','цветочные':'#C087B7','лепестки роз':'#C46A8E','лаванда':'#9078B0',
  // чай / травы
  'чёрный чай':'#5E4232','зелёный чай':'#7A9B5E','травы':'#5E7A4F','мята':'#5E7A4F','чабрец':'#5E7A4F','шиповник':'#C46A4E',
  'цукат':'#D89060',
  // пряности / тяжёлые
  'специи':'#A8412E','табак':'#5E4232','дым':'#5E4232','перец':'#7A2E2E','имбирь':'#D89060','кардамон':'#A8412E',
  // винные
  'вино':'#7A2E4E','красное вино':'#7A2E4E','порт':'#5A2848',
  // прочее
  'томат':'#C04030','хлеб':'#C9A66B','инжир':'#7A4A6E',
  '_default':'#6F4E37',
};
function tasteHue(note) {
  const k = String(note || '').toLowerCase().trim();
  if (TASTE_HUES[k]) return TASTE_HUES[k];
  for (const key in TASTE_HUES) {
    if (key !== '_default' && (k.includes(key) || key.includes(k))) return TASTE_HUES[key];
  }
  return TASTE_HUES._default;
}
function tastingForProduct(p) {
  const notes = p?.tasting_notes || [];
  if (!Array.isArray(notes) || !notes.length) return [];
  return notes.slice(0, 5).map((n, i, arr) => ({
    label: String(n),
    intensity: Math.max(2, 5 - i * (5 / Math.max(arr.length, 5))),
    hue: tasteHue(n),
  }));
}

function flagDot(country) {
  const key = String(country || '').trim();
  const code = FLAG_CODES[key] || FLAG_CODES[key.toUpperCase()] || '';
  return code ? `<span class="flag flag--${code}"></span>` : `<span class="flag flag--neutral"></span>`;
}

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU');

function sizeToKg(size) {
  const m = String(size || '').match(/(\d+(?:[.,]\d+)?)\s*(кг|г|гр)/i);
  if (!m) return 0;
  const n = parseFloat(m[1].replace(',', '.'));
  return /к/i.test(m[2]) ? n : n / 1000;
}

function cartCount() {
  return STATE.cart.reduce((s, i) => s + (i.qty || 1), 0);
}
function cartWeightKg() {
  let kg = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    if (!COFFEE_CATS.includes(p.category)) continue;
    kg += sizeToKg(it.fasovka) * (it.qty || 1);
  }
  return kg;
}
function cartSubtotal() {
  let s = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    const f = (p.fasovka || []).find(x => x.size === it.fasovka);
    if (!f || f.on_request || typeof f.price !== 'number') continue;
    s += f.price * (it.qty || 1);
  }
  return s;
}

function findProduct(id) { return STATE.data?.products.find(x => x.id === id); }
function productInSub(p, subId) {
  if (!subId || subId === 'all') return true;
  return p.subcategory === subId || (Array.isArray(p.subcategories) && p.subcategories.includes(subId));

/* ────────────── visibility (parity with prod) ────────────── */
function isVisibleInCatalog(p) {
  if (!p) return false;
  if (p.hidden) return false;
  if (p.quarantined && !STATE.isAdmin) return false;
  if (STATE.isAdmin) return true;
  const s = (typeof p.stock === 'number') ? p.stock : null;
  if (s !== null && s <= 0) {
    if (p.pair_id) {
      const sib = STATE.data.products.find(x => x.pair_id === p.pair_id && x.id !== p.id);
      if (sib && typeof sib.stock === 'number' && sib.stock > 0) return true;
    }
    return false;
  }
  return true;
}
const NAME_COLLATOR = new Intl.Collator('ru', { sensitivity: 'base', numeric: true });
function visibleProducts() {
  return (STATE.data?.products || [])
    .filter(isVisibleInCatalog)
    .slice()
    .sort((a, b) => NAME_COLLATOR.compare(a.name || '', b.name || ''));
}

    return `<div style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra} background-image:url('${url}'); background-size:cover; background-position:center; background-repeat:no-repeat; background-color:var(--surface-2);"></div>`;

/* ────────────── Tasting footprint (SVG 5 spokes) ────────────── */
function tasting(notes, size = 148) {
  if (!notes || !notes.length) return '';
  const cx = size / 2, cy = size / 2;
  const rMin = 12, rMax = size / 2 - 22;
  const spokes = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const r = rMin + (rMax - rMin) * (n.intensity / 5);
    const x = (cx + Math.cos(a) * r).toFixed(2);
    const y = (cy + Math.sin(a) * r).toFixed(2);
    const x0 = (cx + Math.cos(a) * rMin).toFixed(2);
    const y0 = (cy + Math.sin(a) * rMin).toFixed(2);
    return `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${n.hue}" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3.5" fill="${n.hue}"/>`;
  }).join('');
  const labels = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const lx = cx + Math.cos(a) * (rMax + 6);
    const ly = cy + Math.sin(a) * (rMax + 6);
    const tx = Math.cos(a), ty = Math.sin(a);
    const trX = tx > 0.3 ? '0' : tx < -0.3 ? '-100%' : '-50%';
    const trY = ty > 0.3 ? '0' : ty < -0.3 ? '-100%' : '-50%';
    return `<div style="position:absolute; left:${lx}px; top:${ly}px; transform:translate(${trX}, ${trY}); font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; white-space:nowrap;">${esc(n.label)}</div>`;
  }).join('');
  return `
    <div style="position:relative; width:${size}px; height:${size}px; flex:0 0 auto;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${rMin - 2}" fill="none" stroke="var(--ink-mute)" stroke-width="0.8"/>
        <circle cx="${cx}" cy="${cy}" r="${rMax}" fill="none" stroke="var(--ink-mute)" stroke-width="0.5" stroke-dasharray="1 3"/>
        ${spokes}
      </svg>
      ${labels}
    </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   PARSE RECIPE MARKDOWN (упрощённо)
   ════════════════════════════════════════════════════════════════════ */
function parseRecipeRows(md) {
  if (!md) return [];
  // recipe format: "**Type** · key1 value1 · key2 value2 ..."
  const cleaned = md.replace(/\*\*.*?\*\*/g, '').trim();
  const parts = cleaned.split(/\s*·\s*/).filter(Boolean);
  const rows = [];
  const map = [
    [/помол/i, 'grind'],
    [/навеска|доза/i, 'scale'],
    [/выход/i, 'drop'],
    [/время|с\b/i, 'clock'],
    [/температ|°C/i, 'therm'],
  ];
  for (const p of parts) {
    let foundIcon = 'bean';
    let label = '';
    let value = p.trim();
    for (const [re, ic] of map) {
      if (re.test(p)) {
        foundIcon = ic;
        if (/помол/i.test(p))    label = 'Помол';
        else if (/навеска|доза/i.test(p))  label = 'Навеска';
        else if (/выход/i.test(p))         label = 'Выход';
        else if (/температ|°C/i.test(p))   label = 'Темп.';
        else if (/время|\d+\s*с\b/i.test(p)) label = 'Время';
        break;
      }
    }
    if (!label) {
      const m = p.match(/^(.+?)\s+(.+)$/);
      if (m) { label = m[1]; value = m[2]; }
    } else {
      value = p.replace(/^(помол|навеска|доза|выход|время|темп\.?|температура)\s*/i, '').trim();
    }
    rows.push({ icon: foundIcon, label, value });
  }
  return rows;
}

   SCREEN: CATALOG — drill-down + рабочие фильтры

function _stripEmoji(s) {
  s = String(s || '');
  try {
    s = s.replace(/\p{Extended_Pictographic}/gu, '');
  } catch (e) {
    s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F900}-\u{1F9FF}]/gu, '');
  }
  return s.replace(/[️‍]/g, '').replace(/\s+/g, ' ').trim();
}
function _subcatsOf(parentId) { return STATE.data.subcategories.filter(s => s.parent === parentId); }

/* Чип с остатками для карточки каталога. Брендовые chip-классы из tokens.css. */
function stockBadge(p) {
  const STYLE = 'padding:1px 7px; font-size:10px; height:18px;';
  if (p && p.on_request) return `<span class="chip chip--ink" style="${STYLE}">По запросу</span>`;
  const s = (p || {}).stock;
  if (typeof s !== 'number') return '';
  if (s <= 0) return `<span class="chip" style="${STYLE} background:var(--surface-2); color:var(--ink-faint); border-color:var(--line);">Нет в наличии</span>`;
  if (s < 5)  return `<span class="chip chip--amber"  style="${STYLE}">Осталось ${s}</span>`;
  if (s < 20) return `<span class="chip chip--copper" style="${STYLE}">${s} в наличии</span>`;
  return `<span class="chip chip--green" style="${STYLE}">${s} в наличии</span>`;
}
function _hasChildren(subId) { return _subcatsOf(subId).length > 0; }
function _productsInTree(rootId) {
  // все товары под этим узлом (категория ИЛИ подкатегория), включая потомков
  const seen = new Set();
  const queue = [rootId];
  while (queue.length) {
    const id = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    for (const ch of _subcatsOf(id)) queue.push(ch.id);
  }
  return visibleProducts().filter(p => p.category === STATE.cat && (seen.has(p.subcategory) || seen.has(STATE.cat)));
}

function normalizeSize(s) {
  const t = String(s||'').toLowerCase().replace(/\s+/g,'');
  if (/^200г/.test(t)) return '200 г';
  if (/^250г/.test(t)) return '250 г';
  if (/^500г/.test(t)) return '500 г';
  if (/^1кг/.test(t))  return '1 кг';
  return null;
}

function applyFilters(list) {
  const f = STATE.filters;
  let out = list;
  if (f.fasovka) {
    out = out.filter(p => (p.fasovka || []).some(x => normalizeSize(x.size) === f.fasovka));
  }
  if (f.inStock) {
    out = out.filter(p => (typeof p.stock === 'number' && p.stock > 0) || p.on_request);
  }
  if (f.countries.length) {
    out = out.filter(p => p.country && f.countries.includes(p.country));
  }
  if (f.flavors.length) {
    out = out.filter(p => Array.isArray(p.tasting_notes) && p.tasting_notes.some(n => f.flavors.includes(String(n).toLowerCase())));
  }
  return out;
}

function activeFilterCount() {
  const f = STATE.filters;
  return (f.fasovka ? 1 : 0) + (f.inStock ? 1 : 0) + f.countries.length + f.flavors.length;
}

function _renderTile(s, big = false) {
  const t = tileTheme(s.id);
  const n = _productsInTree(s.id).length || _subcatsOf(s.id).reduce((a, x) => a + _productsInTree(x.id).length, 0);

function screenCatalog() {
  if (!STATE.data) return '';
  const cat = STATE.data.categories.find(c => c.id === STATE.cat);
  const cursorId = STATE.subcat || STATE.cat;  // куда мы сейчас вглубь
  const children = STATE.cat ? _subcatsOf(cursorId) : [];

  /* Хлебные крошки: Каталог › Категория › L1 › L2 */
  const bread = [];
  if (STATE.cat && cat) {
    bread.push({ id: STATE.cat, name: cat.name, action: `rb.openCat('${esc(STATE.cat)}')` });
  }
  if (STATE.subcat) {
    // строим цепочку от subcat вверх до cat
    const chain = [];
    let cur = STATE.data.subcategories.find(s => s.id === STATE.subcat);
    while (cur && cur.parent && cur.parent !== STATE.cat) {
      chain.unshift(cur);
      cur = STATE.data.subcategories.find(s => s.id === cur.parent);
    }
    if (cur) chain.unshift(cur);
    for (const c of chain) {
      bread.push({ id: c.id, name: _stripEmoji(c.name), action: `rb.openSubcat('${esc(c.id)}')` });
    }
  }
  if (STATE.fasovkaSplit) {
    bread.push({ id: 'fas:' + STATE.fasovkaSplit, name: STATE.fasovkaSplit, action: `rb.openFasovkaSplit('${esc(STATE.fasovkaSplit)}')` });
  }

  // Title — последняя крошка или «Каталог» / название категории
  let title;
  const subObj = STATE.subcat ? STATE.data.subcategories.find(s => s.id === STATE.subcat) : null;
  if (STATE.fasovkaSplit && subObj) {
    title = _stripEmoji(subObj.name) + ' · ' + STATE.fasovkaSplit;
  } else {
    const titleSrc = subObj?.name || cat?.name;
    title = titleSrc ? _stripEmoji(titleSrc) : 'Каталог';
  }

  // Подкатегории retail (Эспрессо / Фильтр / Купажи), где идёт split по фасовкам 1кг / 200г.
  const isSplitSub = STATE.subcat && SPLIT_BY_FASOVKA_SUB.includes(STATE.subcat);
  // Решение: drill-плитки или плоский список
  const showTiles = STATE.cat && !STATE.showAll && children.length > 0 && !isSplitSub;

  let body = '';
  if (!STATE.cat) {
    // root: показываем все категории как крупные плитки
    body = `
      <div style="padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${STATE.data.categories.filter(c => visibleProducts().some(p => p.category === c.id)).map(c => {

    const countries = [...new Set(allInTree.map(p => p.country).filter(Boolean))].sort();
    const flavors = [...new Set(allInTree.flatMap(p => p.tasting_notes || []).map(s => String(s).toLowerCase()))].sort();
    const f = STATE.filters;
    const activeN = activeFilterCount();

    const filterChip = (label, on, action, soft = false) => `<button onclick="${action}" class="chip${on ? (soft ? ' chip--green' : ' chip--ink') : ''}" style="height:30px; cursor:pointer;">${label}</button>`;

    body = `

          ${filterChip(`${icon('filter', 14)} Фильтр${activeN ? ' · ' + activeN : ''}`, activeN > 0, 'rb.toggleFilterPanel()')}

          ${filterChip('1 кг',  f.fasovka === '1 кг',  `rb.toggleFasovka('1 кг')`)}
          ${countries.length ? filterChip(`Страна${f.countries.length ? ' · ' + f.countries.length : ' ↓'}`, f.countries.length > 0, `rb.toggleFilterPanel('country')`) : ''}

          ${flavors.length ? filterChip(`Вкус${f.flavors.length ? ' · ' + f.flavors.length : ' ↓'}`, f.flavors.length > 0, `rb.toggleFilterPanel('flavor')`) : ''}
          ${activeN ? filterChip('× Сбросить', false, 'rb.resetFilters()') : ''}
          <div style="width:4px"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px 0;">
          <span class="meta">${list.length} ${list.length === 1 ? 'товар' : list.length < 5 ? 'товара' : 'товаров'}${activeN ? ' · фильтров: ' + activeN : ''}</span>
        </div>
      </div>

      ${STATE.filterOpen === 'country' && countries.length ? `
        <div style="margin:12px 16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);">
          <div class="eyebrow" style="margin-bottom:10px;">Страны</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${countries.map(c => `<button onclick="rb.toggleCountry('${esc(c)}')" class="chip${f.countries.includes(c) ? ' chip--coffee' : ''}" style="cursor:pointer;">${esc(c)}</button>`).join('')}
          </div>
        </div>` : ''}

      ${STATE.filterOpen === 'flavor' && flavors.length ? `
        <div style="margin:12px 16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);">
          <div class="eyebrow" style="margin-bottom:10px;">Вкус</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${flavors.slice(0, 40).map(c => `<button onclick="rb.toggleFlavor('${esc(c)}')" class="chip${f.flavors.includes(c) ? ' chip--copper' : ''}" style="cursor:pointer;">${esc(c)}</button>`).join('')}
          </div>
        </div>` : ''}

      ${list.length === 0
        ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);"><div style="font-size:32px; margin-bottom:10px">🍃</div><div style="font-family:var(--f-display); font-weight:700; font-size:16px;">Под фильтр ничего не подошло</div>${activeN ? `<button class="btn-ghost" style="margin-top:14px;" onclick="rb.resetFilters()">Сбросить фильтры</button>` : ''}</div>`
        : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:12px 16px; border:1px solid var(--line);">
          ${list.slice(0, 80).map(p => {
            const fa = (p.fasovka || [])[0] || {};
            const meta = [p.process, p.variety, p.altitude].filter(Boolean).join(' · ');
            const isLim = (p.tags || []).some(t => /лимит/i.test(t)) || (p.tags || []).includes('Микролот');
            return `
              <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:14px; background:var(--surface); align-items:center; cursor:pointer;">
                ${productImg(p, '1', 'width:60px; height:60px; flex:0 0 auto; border-radius:8px;')}
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;">
                    ${flagDot(p.country)}
                    ${p.roast ? `<span class="roast${p.roast === 'F' ? ' roast--f' : ''}" style="width:16px; height:16px; font-size:9px;">${esc(p.roast)}</span>` : ''}
                    ${isLim ? `<span class="chip chip--copper" style="padding:1px 7px; font-size:10px; height:18px;">Лимит</span>` : ''}
                    ${stockBadge(p)}
                  </div>
                  <div style="font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1.15; margin-bottom:3px;">${esc(p.name)}</div>
                  <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${esc(meta || ' ')}</div>
                </div>
                <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                  <div>
                    <span style="font-family:var(--f-display); font-weight:800; font-size:16px; line-height:1;">${typeof fa.price === 'number' && !fa.on_request ? fmt(fa.price) : '—'}</span>
                    <span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof fa.price === 'number' && !fa.on_request ? '₽' : ''}</span>
                  </div>
                  ${cartButton(p.id, fa.size || '', 30)}
                </div>
              </div>
            `;
          }).join('')}
        </div>`
      }
    `;
  }

  return `
${appHeader({ back: true, title: 'Каталог', action: `<button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.go('search')">${icon('search')}</button>` })}

<div style="padding:8px 16px 0; display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
  <span class="meta" style="cursor:pointer;" onclick="rb.openCat(null)">Каталог</span>
  ${bread.map((b, i) => `
    <span class="meta" style="opacity:0.4">›</span>
    <span class="meta" style="${i === bread.length - 1 ? 'color:var(--ink);' : 'cursor:pointer;'}" ${i === bread.length - 1 ? '' : `onclick="${b.action}"`}>${esc(b.name)}</span>

</div>

<div style="padding:4px 16px 16px; display:flex; align-items:baseline; justify-content:space-between;">
  <h1 style="font-size:30px;">${esc(title)}.</h1>

    <div style="font-family:var(--f-display); font-weight:800; font-size:22px;">${_productsInTree(cursorId).length}</div>
    <div class="meta" style="font-size:9.5px;">SKU</div>
  </div>` : ''}
</div>

${body}

<div style="height:80px"></div>
${tabBar('catalog')}
`;
}

function screenProduct() {
  const p = findProduct(STATE.productId);
  if (!p) return `<div style="padding:80px 24px; text-align:center; color:var(--ink-soft);">Карточка не найдена.</div>`;
  const fasList = Array.isArray(p.fasovka) && p.fasovka.length ? p.fasovka : [{ size: 'уп.', price: p.price ?? null, on_request: p.on_request || (typeof p.price !== 'number') }];
  const curFas = fasList.find(f => f.size === STATE.productFasovka) || fasList.find(f => /кг/i.test(f.size)) || fasList[0];
  const isCoffeeKg = COFFEE_CATS.includes(p.category) && /кг/i.test(curFas.size || '');
  const kg = isCoffeeKg ? Math.max(1, STATE.productKg || 1) : 1;
  const basePrice = curFas.on_request ? 0 : (curFas.price || 0);
  const subtotal = basePrice * kg;
  const tier = isCoffeeKg ? tierFor(kg) : 0;
  const total = subtotal * (1 - tier);
  const save = subtotal - total;
  const tasteNotes = tastingForProduct(p);
  const recipe = p.recipe_e || p.recipe_f;
  const recipeRows = parseRecipeRows(recipe);
  const recipeIsEspresso = !!p.recipe_e;

  return `
<!-- Floating header over hero -->
<div style="position:sticky; top:0; z-index:12; display:flex; align-items:center; justify-content:space-between; padding:54px 16px 12px; background:transparent;">
  <button onclick="rb.back()" style="width:38px; height:38px; border-radius:999px; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;">${icon('back')}</button>
  <div style="display:flex; gap:6px;">
    <button style="width:38px; height:38px; border-radius:999px; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;">${icon('heart')}</button>
    <button style="width:38px; height:38px; border-radius:999px; background:rgba(255,255,255,0.85); backdrop-filter:blur(10px); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;">${icon('more')}</button>
  </div>
</div>

<!-- Hero -->
<div style="margin-top:-54px;">
  ${productImg(p, '1 / 1', 'border-radius:0; align-items:flex-end; padding:20px;', 'PRODUCT 1080×1080 — ' + esc(p.name))}
</div>

<!-- Title -->
<div style="padding:20px 16px 0;">
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
    ${flagDot(p.country)}
    <span class="meta">${esc([p.country, p.farm, p.altitude].filter(Boolean).join(' · ')) || '·'}</span>
  </div>
  <h1 style="font-size:32px; line-height:0.95;">${esc(p.name)}.</h1>

    ${p.process ? chip(esc(p.process)) : ''}
    ${p.variety ? chip(esc(p.variety)) : ''}
    ${typeof p.stock === 'number' && p.stock > 0 ? chip(p.stock + ' в наличии', 'green') : (p.on_request ? chip('По запросу') : '')}
  </div>
</div>

<!-- Fasovka selector — скрыт когда товар открыт из split-фасовки или у него одна фасовка -->
${fasList.length > 1 && !STATE.fasovkaSplit ? `
<div style="padding:20px 16px 0; display:grid; grid-template-columns:repeat(${Math.min(fasList.length, 2)}, 1fr); gap:8px;">
  ${fasList.map(f => {
    const sel = curFas.size === f.size;
    return `
      <button onclick="rb.setFasovka('${esc(f.size)}')" style="background:${sel ? 'var(--ink)' : 'var(--surface)'}; color:${sel ? 'var(--bg)' : 'var(--ink)'}; border:1px solid ${sel ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:var(--r-md); padding:14px 16px; display:flex; flex-direction:column; align-items:flex-start; gap:4px; text-align:left;">
        <span style="font-family:var(--f-display); font-weight:700; font-size:13px; letter-spacing:0.02em; text-transform:uppercase; opacity:0.7;">${esc(f.size)}</span>
        <span style="font-family:var(--f-display); font-weight:800; font-size:22px;">${f.on_request || typeof f.price !== 'number' ? '—' : fmt(f.price)}<span style="font-size:12px; margin-left:2px;">${f.on_request || typeof f.price !== 'number' ? '' : '₽'}</span></span>
        <span class="meta" style="color:${sel ? 'rgba(245,235,221,0.6)' : 'var(--ink-faint)'}; font-size:9.5px;">${f.on_request ? 'по запросу' : (typeof f.price === 'number' && /200/.test(f.size) ? Math.round(f.price * 5).toLocaleString('ru') + ' ₽/кг' : ' ')}</span>
      </button>`;
  }).join('')}
</div>` : ''}
${STATE.fasovkaSplit && fasList.length > 1 ? `
<div style="padding:18px 16px 0;">

    <span style="font-family:var(--f-display); font-weight:700; font-size:15px;">${esc(STATE.fasovkaSplit)}</span>
    <span style="font-family:var(--f-display); font-weight:800; font-size:18px;">${curFas.on_request || typeof curFas.price !== 'number' ? '—' : fmt(curFas.price) + ' ₽'}</span>
  </div>
</div>` : ''}

<!-- Origin grid -->
${(p.country || p.region || p.variety || p.process || p.altitude || p.farm) ? `
<div style="padding:20px 16px 0;">
  <div class="eyebrow" style="margin-bottom:10px;">Происхождение</div>
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
    ${[
      p.country && ['Страна', p.country],
      p.region && ['Регион', p.region],
      p.variety && ['Сорт', p.variety],
      p.process && ['Процесс', p.process],
      p.altitude && ['Высота', p.altitude],
      p.farm && ['Ферма', p.farm],
    ].filter(Boolean).map(([k,v]) => `
      <div style="padding:12px; background:var(--surface);">
        <div class="meta" style="font-size:9.5px; margin-bottom:4px;">${esc(k)}</div>
        <div style="font-family:var(--f-body); font-weight:500; font-size:13px; line-height:1.25;">${esc(v)}</div>
      </div>
    `).join('')}
  </div>
</div>` : ''}

<!-- Tasting -->
${tasteNotes.length ? `
<div style="padding:24px 16px 0;">
  <div class="eyebrow" style="margin-bottom:16px;">Вкусовой профиль</div>
  <div style="display:flex; gap:16px; align-items:center;">
    ${tasting(tasteNotes, 148)}
    <div style="flex:1; display:flex; flex-direction:column; gap:6px;">
      ${tasteNotes.map(n => {

          <div style="display:flex; align-items:center; gap:8px;">

            <span style="font-size:12px; font-weight:500; flex:1;">${esc(n.label)}</span>
            <span class="meta" style="font-size:9.5px;">${'●'.repeat(filled)}<span style="color:var(--ink-mute)">${'○'.repeat(5 - filled)}</span></span>
          </div>`;
      }).join('')}
    </div>
  </div>
</div>` : ''}

<!-- Recipe -->
${recipeRows.length ? `

/* ════════════════════════════════════════════════════════════════════

function screenCart() {
  const items = STATE.cart.map(i => {
    const p = findProduct(i.id);
    if (!p) return null;
    const f = (p.fasovka || []).find(x => x.size === i.fasovka) || (p.fasovka || [])[0];
    return { ...i, p, f };
  }).filter(Boolean);

  const totalKg = cartWeightKg();
  const subtotal = cartSubtotal();
  const tier = tierFor(totalKg);
  const save = subtotal * tier;
  const total = subtotal - save;
  const toNext = totalKg < 10 ? 10 - totalKg : totalKg < 25 ? 25 - totalKg : 0;
  const nextLabel = totalKg < 10 ? '−10%' : totalKg < 25 ? '−20%' : 'максимум';

  if (!items.length) {
    return `
      ${appHeader({ back: true, title: 'Корзина' })}
      <div style="padding:80px 24px; text-align:center;">
        <div style="font-size:36px; margin-bottom:14px;">🛒</div>
        <h2 style="font-size:22px;">Корзина ждёт<br/>первый кофе</h2>
        <p style="margin-top:10px; color:var(--ink-soft); font-size:14px;">Открой каталог — там 530+ позиций.</p>
        <button class="cta" style="margin-top:24px; max-width:240px;" onclick="rb.go('catalog')"><span>В каталог</span><span>→</span></button>
      </div>
      ${tabBar('cart')}
    `;
  }

  return `
${appHeader({ back: true, title: 'Корзина', action: `<button class="btn-ghost" style="height:36px; padding:0 12px; font-size:12px;" onclick="rb.cartClear()">Очистить</button>` })}

<div style="padding:8px 16px 0; display:flex; align-items:baseline; justify-content:space-between;">
  <h1 style="font-size:32px;">${items.length} ${items.length === 1 ? 'позиция' : items.length < 5 ? 'позиции' : 'позиций'},<br/><span style="color:var(--coffee)">${totalKg.toFixed(1)} кг</span></h1>
</div>

<!-- Items -->
<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:20px 16px 0; border:1px solid var(--line);">
  ${items.map(i => {
    const f = i.f || {};
    const price = (typeof f.price === 'number' && !f.on_request) ? f.price : 0;
    return `
      <div style="background:var(--surface); display:flex; gap:12px; padding:12px; align-items:center;">
        ${productImg(i.p, '1', 'width:56px; height:56px; flex:0 0 auto; border-radius:8px;')}
        <div style="flex:1; min-width:0;">
          <div style="font-family:var(--f-display); font-weight:700; font-size:14px; line-height:1.15; margin-bottom:3px;">${esc(i.p.name)}</div>
          <div class="meta" style="font-size:9.5px;">${esc(i.fasovka || '')}${i.p.process ? ' · ' + esc(i.p.process) : ''}</div>
          <div style="margin-top:6px; font-family:var(--f-display); font-weight:700; font-size:14px;">${f.on_request ? 'по запросу' : fmt(price * i.qty) + ' '}<span style="font-size:11px; color:var(--ink-soft); margin-left:3px;">${f.on_request ? '' : '₽'}</span>${!f.on_request ? `<span style="font-size:10px; color:var(--ink-faint); margin-left:6px;">${fmt(price)}×${i.qty}</span>` : ''}</div>
        </div>
        ${stepper(i.qty, `rb.cartChange('${esc(i.id)}','${esc(i.fasovka)}',-1)`, `rb.cartChange('${esc(i.id)}','${esc(i.fasovka)}',1)`)}
      </div>`;
  }).join('')}
</div>

  </div>
</div>` : ''}

<!-- Summary -->
<div style="padding:22px 16px 140px;">

    <div style="display:flex; justify-content:space-between;"><span style="color:var(--ink-soft); font-size:14px;">Подсумма</span><span style="font-family:var(--f-mono); font-size:14px; font-weight:500;">${fmt(subtotal)} ₽</span></div>
    ${tier > 0 ? `<div style="display:flex; justify-content:space-between;"><span style="color:var(--green); font-size:14px; font-weight:600;">Скидка по весу −${Math.round(tier*100)}%</span><span style="font-family:var(--f-mono); font-size:14px; font-weight:600; color:var(--green);">−${fmt(save)} ₽</span></div>` : ''}

<div style="position:fixed; bottom:0; left:0; right:0; padding:12px 16px calc(env(safe-area-inset-bottom,18px) + 14px); background:color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter:blur(20px); border-top:1px solid var(--line); z-index:11;">

</div>

/* ════════════════════════════════════════════════════════════════════
   SCREEN: SEARCH — автокомплит по name + country + variety + tasting
   ════════════════════════════════════════════════════════════════════ */
function hl(text, q) {
  if (!q) return esc(text);
  const t = String(text || '');
  const lc = t.toLowerCase(), qc = q.toLowerCase();
  const idx = lc.indexOf(qc);
  if (idx === -1) return esc(t);
  return esc(t.slice(0, idx))
    + `<span style="background:var(--copper-soft); color:var(--ink); font-weight:700; border-radius:3px; padding:0 2px;">${esc(t.slice(idx, idx + q.length))}</span>`
    + esc(t.slice(idx + q.length));
}
function screenSearch() {
  const q = (STATE.searchQuery || '').trim();
  const all = visibleProducts();
  const results = q ? all.filter(p => {
    const hay = [p.name, p.country, p.variety, p.process, p.farm,
                 ...(p.tasting_notes || [])].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  }) : [];
  // популярные запросы — pre-defined
  const suggestions = ['эфиопия', 'эспрессо', 'фильтр', 'бразилия', 'микролот', 'дрипы', 'каскара', 'niktea'];

  return `
<div style="position:sticky; top:0; z-index:10; background:var(--bg); padding:54px 16px 12px; border-bottom:1px solid var(--line);">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
    <button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.back()">${icon('back')}</button>
    <h1 style="font-size:22px; flex:1;">Поиск</h1>
  </div>
  <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:2px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 16px; height:48px;">
    <span style="color:${q ? 'var(--ink)' : 'var(--ink-faint)'};">${icon('search')}</span>
    <input id="rb-search-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
      placeholder="Поиск по ${all.length} SKU"
      value="${esc(q)}"
      oninput="rb.searchInput(this.value)"
      style="flex:1; border:0; outline:0; background:transparent; font-size:15px; font-family:var(--f-body); color:var(--ink); font-weight:500; min-width:0;" />
    ${q ? `<button onclick="rb.searchInput('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:18px; padding:4px 6px; cursor:pointer;">×</button>` : ''}
  </div>
</div>

${!q ? `
  <div style="padding:20px 16px 0;">
    <div class="eyebrow" style="margin-bottom:12px;">Часто ищут</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      ${suggestions.map(s => `<button class="chip" onclick="rb.searchInput('${esc(s)}')" style="height:34px; padding:0 14px; font-size:13px; cursor:pointer;">${esc(s)}</button>`).join('')}
    </div>
  </div>
` : results.length === 0 ? `
  <div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">
    <div style="font-size:32px; margin-bottom:10px;">🔍</div>
    <div style="font-family:var(--f-display); font-weight:700; font-size:16px;">Ничего не нашли</div>
    <div style="font-size:13px; margin-top:6px;">Попробуй короче или другое слово.</div>
  </div>
` : `
  <div style="padding:14px 16px 8px;">
    <span class="meta">Найдено: ${results.length}</span>
  </div>
  <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:0 16px; border:1px solid var(--line);">
    ${results.slice(0, 50).map(p => {
      const f = (p.fasovka || [])[0] || {};
      const meta = [p.country, p.process, p.variety].filter(Boolean).join(' · ');
      return `
        <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:12px 14px; background:var(--surface); align-items:center; cursor:pointer;">
          ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
          <div style="flex:1; min-width:0;">
            <div style="font-family:var(--f-display); font-weight:700; font-size:14px; line-height:1.2; margin-bottom:2px;">${hl(p.name, q)}</div>
            <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${hl(meta, q)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--f-display); font-weight:800; font-size:14px;">${typeof f.price === 'number' && !f.on_request ? fmt(f.price) : '—'}<span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof f.price === 'number' && !f.on_request ? '₽' : ''}</span></div>
            <div style="margin-top:2px;" class="meta">${esc(f.size || '')}</div>
          </div>
        </div>
      `;
    }).join('')}
  </div>
`}

<div style="height:120px"></div>
${tabBar('search')}
`;
}

    stm: 'СТМ-прайс',
  };
  const tier = u.price_tier || 'standard';

  const orders = u.orders || [];
  const rules = STATE.adminUserPricing || [];

  const fieldRow = (label, value, field) => `
    <div onclick="rb.adminEditUserField('${field}', '${esc(label)}')" style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:var(--surface); cursor:pointer; gap:10px;">
      <div style="flex:1; min-width:0;">
        <div class="meta" style="font-size:10px;">${esc(label)}</div>
        <div style="font-size:13px; margin-top:2px; ${value ? '' : 'color:var(--ink-faint);'} overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${value ? esc(value) : '— нажми чтобы заполнить'}</div>
      </div>
      <span style="color:var(--ink-faint); font-size:11px; flex:0 0 auto;">✏️</span>
    </div>
  `;

  const ruleScopeLabel = (r) => {
    if (r.scope === 'all') return '📦 Все товары';
    if (r.scope === 'product') {
      const meta = (STATE.adminCatalogMeta?.products_lite || []).find(p => p.id === r.target_id);
      return '🎯 ' + (meta?.name || r.target_id || '');
    }
    if (r.scope === 'subcategory') return '🗂 ' + (r.target_id || '');
    if (r.scope === 'category') return '📂 ' + (r.target_id || '');
    return r.scope;
  };
  const ruleValueLabel = (r) => {
    if (r.fixed_price !== null && r.fixed_price !== undefined) return 'фикс ' + fmt(r.fixed_price) + ' ₽';
    if (r.discount_pct !== null && r.discount_pct !== undefined) return '−' + r.discount_pct + '%';
    return '—';
  };

  return `
${appHeader({ back: true, title: esc((u.name || 'Клиент').slice(0, 24)) })}

<div style="padding:0 16px 12px;">
  <div class="card" style="padding:16px;">
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
      <span style="font-family:var(--f-display); font-weight:700; font-size:18px;">${esc(u.name || '—')}</span>
      <span class="meta" style="font-size:11px;">${tg}</span>
    </div>
    ${u.user_type ? `<div class="meta" style="margin-top:4px; color:var(--copper);">${esc(u.user_type === 'company' ? 'Юр.лицо' : 'Физлицо')}</div>` : ''}
    <div style="display:flex; gap:8px; margin-top:12px;">
      ${u.user_id > 0 ? `<button onclick="rb.adminOpenDm()" class="btn-ghost" style="flex:1; justify-content:center; height:40px; font-size:13px;">💬 Написать в чат</button>` : ''}
      ${u.phone ? `<a href="tel:${esc(u.phone)}" class="btn-ghost" style="flex:1; justify-content:center; height:40px; font-size:13px; text-decoration:none;">📞 Позвонить</a>` : ''}
    </div>
  </div>
</div>

<div style="padding:0 16px 12px;">
  <div class="meta" style="margin-bottom:6px; padding-left:4px;">Тариф (колонка прайса)</div>
  <div onclick="rb.adminSetUserTier()" class="card" style="padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-family:var(--f-display); font-weight:700; font-size:15px;">${esc(TIERS_LABEL[tier] || tier)}</span>
    <span class="chip chip--copper" style="height:22px; font-size:11px; padding:0 10px;">сменить</span>
  </div>
</div>

<div style="padding:0 16px 12px;">
  <div class="meta" style="margin-bottom:6px; padding-left:4px;">Реквизиты</div>
  <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
    ${fieldRow('Имя', u.name, 'name')}
    ${fieldRow('Телефон', u.phone, 'phone')}
    ${fieldRow('Email', u.email, 'email')}
    ${fieldRow('Тип (individual/company)', u.user_type, 'user_type')}
    ${fieldRow('Название компании', u.company_name, 'company_name')}
    ${fieldRow('ИНН', u.inn, 'inn')}
    ${fieldRow('Юр.адрес', u.legal_address, 'legal_address')}
  </div>
</div>

<div style="padding:0 16px 12px;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; padding:0 4px;">
    <span class="meta">Персональные скидки · ${rules.length}</span>
    <button onclick="rb.adminAddPricing()" style="height:28px; padding:0 12px; border-radius:999px; background:var(--ink); color:var(--bg); border:0; font-size:11px; font-weight:600; cursor:pointer;">+ правило</button>
  </div>
  ${rules.length === 0
    ? `<div class="card" style="padding:14px 16px; text-align:center; color:var(--ink-soft); font-size:13px;">Скидок нет — действует тариф «${esc(TIERS_LABEL[tier] || tier)}»</div>`
    : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
        ${rules.map(r => `
          <div style="background:var(--surface); padding:10px 12px; display:flex; align-items:center; gap:8px;">
            <div style="flex:1; min-width:0;">
              <div style="font-size:12px; font-weight:600;">${esc(ruleScopeLabel(r))}</div>
              <div class="meta" style="font-size:10px; margin-top:2px;">${esc(ruleValueLabel(r))}${r.fasovka ? ' · фасовка ' + esc(r.fasovka) : ''}</div>
            </div>
            <button onclick="rb.adminDelPricing(${r.id})" style="width:30px; height:30px; border-radius:999px; background:transparent; border:1px solid var(--line); color:var(--danger); font-size:13px; cursor:pointer; padding:0;">×</button>
          </div>
        `).join('')}
      </div>`}
</div>

${orders.length ? `
<div style="padding:0 16px 12px;">
  <div class="meta" style="margin-bottom:6px; padding-left:4px;">История заказов · ${orders.length}</div>
  <div style="display:flex; flex-direction:column; gap:6px;">
    ${orders.slice(0, 20).map(o => `
      <div onclick="rb.openAdminOrder('${esc(o.id)}')" class="card" style="padding:10px 12px; cursor:pointer; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-family:var(--f-mono); font-size:12px; font-weight:700;">#${esc(o.id)} · <span class="chip${(o.status||'').includes('cancel') ? '' : ' chip--coffee'}" style="height:16px; font-size:9px; padding:0 6px;">${esc(o.status || 'new')}</span></div>
          <div class="meta" style="font-size:9.5px; margin-top:2px;">${esc((o.created_at || '').slice(0, 16))}</div>
        </div>
        <span style="font-family:var(--f-display); font-weight:700; font-size:13px;">${fmt(o.total || 0)} ₽</span>
      </div>
    `).join('')}
  </div>
</div>` : ''}

<div style="height:80px"></div>
`;
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN: модалки (DM, правило скидки, редактор карточки)
   ════════════════════════════════════════════════════════════════════ */
function _adminCloseModal() {
  const m = document.getElementById('rb-admin-modal');
  if (m) m.remove();
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
}
function _adminModal(html) {
  _adminCloseModal();
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  const d = document.createElement('div');
  d.id = 'rb-admin-modal';
  // Жёсткие цвета (НЕ var(--surface), которая в Telegram-теме бывает прозрачной).
  // z-index выше любого Telegram-overlay. Backdrop кликабельный для закрытия.
  d.style.cssText = [
    'position:fixed', 'top:0', 'left:0', 'right:0', 'bottom:0',
    'background:rgba(0,0,0,0.55)',
    'z-index:99999',
    'display:flex', 'align-items:flex-end', 'justify-content:center',
    'overscroll-behavior:contain',
    '-webkit-tap-highlight-color:transparent',
  ].join(';');
  d.addEventListener('click', (e) => { if (e.target === d) _adminCloseModal(); });
  const inner = `
    <div id="rb-admin-modal-sheet" style="
      background:#FFFFFF;
      color:#1B1815;
      width:100%; max-width:520px;
      max-height:92vh; overflow-y:auto;
      border-radius:18px 18px 0 0;
      padding:20px 18px calc(20px + env(safe-area-inset-bottom));
      box-shadow:0 -8px 32px rgba(0,0,0,0.25);
      -webkit-overflow-scrolling:touch;
      box-sizing:border-box;
    ">
      <div style="width:42px; height:4px; background:#E0DAD2; border-radius:2px; margin:-4px auto 14px;"></div>
      ${html}
    </div>`;
  d.innerHTML = inner;
  document.body.appendChild(d);
}
function _openDmModal(uid, name) {
  _adminModal(`
    <div style="font-family:var(--f-display); font-weight:700; font-size:17px; margin-bottom:4px;">Чат с клиентом</div>
    <div class="meta" style="margin-bottom:14px;">${esc(name)} · id <code>${esc(String(uid))}</code></div>
    <textarea id="rb-dm-text" rows="5" placeholder="Сообщение клиенту..."
      style="width:100%; padding:12px; border:1px solid var(--line-strong); border-radius:10px; font-family:var(--f-body); font-size:14px; background:var(--surface); color:var(--ink); resize:vertical; min-height:90px; box-sizing:border-box;"></textarea>
    <div class="meta" style="margin-top:8px; font-size:10px;">Уйдёт в личку через @Rb_buy_bot. Если клиент ещё не начинал диалог — Telegram не доставит.</div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button onclick="_adminCloseModal()" style="flex:1; height:44px; border-radius:999px; background:transparent; border:1px solid var(--line-strong); color:var(--ink-soft); font-weight:600; cursor:pointer;">Отмена</button>
      <button onclick="rb._sendDm(${uid})" id="rb-dm-send" style="flex:1; height:44px; border-radius:999px; background:var(--ink); color:var(--bg); border:0; font-weight:600; cursor:pointer;">Отправить</button>
    </div>
  `);
  setTimeout(() => document.getElementById('rb-dm-text')?.focus(), 50);
}

// Состояние pricing-модала. Хранится в STATE чтобы было видно из rb._savePricing
function _prState() {
  if (!STATE._pr) STATE._pr = { scope: 'all', target: '*', fasovka: '', pct: null, fixed: null };
  return STATE._pr;
}
function _prSet(patch) { Object.assign(_prState(), patch); _prRender(); }

function _openPricingModal(uid) {
  STATE._pr = { scope: 'all', target: '*', fasovka: '', pct: 10, fixed: null };
  _adminModal('<div id="rb-pr-host"></div>');
  STATE._prUid = uid;
  _prRender();
}

function _prRender() {
  const host = document.getElementById('rb-pr-host');
  if (!host) return;
  const st = _prState();
  const meta = STATE.adminCatalogMeta || { categories: [], subcategories: {}, fasovkas: [], products_lite: [] };
  const uid = STATE._prUid;

  const SCOPES = [
    { id: 'all',         label: '📦 На все товары' },
    { id: 'category',    label: '📂 На категорию' },
    { id: 'subcategory', label: '🗂 На подкатегорию' },
    { id: 'product',     label: '🎯 На конкретный товар' },
  ];

  const scopeChips = SCOPES.map(s => `
    <button onclick="_prSet({scope:'${s.id}', target: ${s.id === 'all' ? "'*'" : "''"}})"
      style="padding:8px 14px; border-radius:999px;
        background:${st.scope === s.id ? '#1B1815' : '#F5F0E8'};
        color:${st.scope === s.id ? '#FAF7F2' : '#1B1815'};
        border:1px solid ${st.scope === s.id ? '#1B1815' : '#E0DAD2'};
        font-size:13px; font-weight:600; cursor:pointer;">${s.label}</button>
  `).join('');

  // Target picker по scope
  let targetBlock = '';
  if (st.scope === 'all') {
    targetBlock = `<div style="padding:10px 12px; background:#F5F0E8; border-radius:10px; font-size:12px; color:#665D52;">
      Скидка применится ко всем позициям в любом заказе клиента.
    </div>`;
  } else if (st.scope === 'category') {
    targetBlock = `
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${(meta.categories || []).map(c => `
          <button onclick="_prSet({target:'${esc(c)}'})"
            style="padding:7px 12px; border-radius:999px;
              background:${st.target === c ? '#1B1815' : '#fff'};
              color:${st.target === c ? '#fff' : '#1B1815'};
              border:1px solid ${st.target === c ? '#1B1815' : '#E0DAD2'};
              font-size:12px; cursor:pointer;">${esc(c)}</button>
        `).join('')}
      </div>`;
  } else if (st.scope === 'subcategory') {
    const allSubs = [];
    for (const [c, subs] of Object.entries(meta.subcategories || {})) {
      for (const s of subs) allSubs.push({ c, s });
    }
    targetBlock = `
      <div style="display:flex; flex-direction:column; gap:6px; max-height:200px; overflow-y:auto;">
        ${allSubs.map(x => `
          <button onclick="_prSet({target:'${esc(x.s)}'})"
            style="text-align:left; padding:8px 12px; border-radius:8px;
              background:${st.target === x.s ? '#1B1815' : '#fff'};
              color:${st.target === x.s ? '#fff' : '#1B1815'};
              border:1px solid ${st.target === x.s ? '#1B1815' : '#E0DAD2'};
              font-size:13px; cursor:pointer;">
            <span style="font-size:10px; opacity:0.7;">${esc(x.c)}</span><br>
            <span style="font-weight:600;">${esc(x.s)}</span>
          </button>
        `).join('')}
      </div>`;
  } else if (st.scope === 'product') {
    const q = (STATE._prQ || '').trim().toLowerCase();
    const list = (meta.products_lite || []).filter(p => !q || p.name.toLowerCase().includes(q)).slice(0, 50);
    targetBlock = `
      <input type="text" placeholder="Поиск товара..." value="${esc(STATE._prQ || '')}"
        oninput="STATE._prQ = this.value; _prRender();"
        style="width:100%; height:40px; padding:0 12px; border:1px solid #E0DAD2; border-radius:10px; background:#fff; color:#1B1815; font-size:14px; box-sizing:border-box; margin-bottom:8px;">
      <div style="display:flex; flex-direction:column; gap:4px; max-height:200px; overflow-y:auto;">
        ${list.map(p => `
          <button onclick="_prSet({target:'${esc(p.id)}'})"
            style="text-align:left; padding:8px 12px; border-radius:8px;
              background:${st.target === p.id ? '#1B1815' : '#fff'};
              color:${st.target === p.id ? '#fff' : '#1B1815'};
              border:1px solid ${st.target === p.id ? '#1B1815' : '#E0DAD2'};
              font-size:13px; cursor:pointer;">${esc(p.name)}</button>
        `).join('')}
        ${list.length === 0 ? '<div style="padding:14px; text-align:center; color:#999; font-size:12px;">Ничего не найдено</div>' : ''}
      </div>`;
  }

  // Preset % chips
  const PRESETS = [5, 10, 15, 20, 25, 30];
  const pctChips = PRESETS.map(p => `
    <button onclick="_prSet({pct:${p}, fixed:null})"
      style="padding:10px 14px; border-radius:999px; min-width:60px;
        background:${st.pct === p ? '#1B1815' : '#F5F0E8'};
        color:${st.pct === p ? '#FAF7F2' : '#1B1815'};
        border:1px solid ${st.pct === p ? '#1B1815' : '#E0DAD2'};
        font-size:14px; font-weight:700; cursor:pointer;">−${p}%</button>
  `).join('');

  const customPctActive = st.pct != null && !PRESETS.includes(st.pct);
  const fixedActive = st.fixed != null;

  // Фасовка-фильтр (только если scope != all)
  let fasovkaBlock = '';
  if (st.scope !== 'all' && (meta.fasovkas || []).length) {
    fasovkaBlock = `
      <div style="margin-top:14px;">
        <div style="font-size:11px; color:#665D52; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Фасовка (опц.)</div>
        <div style="display:flex; flex-wrap:wrap; gap:6px;">
          <button onclick="_prSet({fasovka:''})"
            style="padding:6px 12px; border-radius:999px;
              background:${!st.fasovka ? '#1B1815' : '#fff'};
              color:${!st.fasovka ? '#fff' : '#1B1815'};
              border:1px solid ${!st.fasovka ? '#1B1815' : '#E0DAD2'};
              font-size:11px; cursor:pointer;">любая</button>
          ${(meta.fasovkas || []).map(f => `
            <button onclick="_prSet({fasovka:'${esc(f)}'})"
              style="padding:6px 12px; border-radius:999px;
                background:${st.fasovka === f ? '#1B1815' : '#fff'};
                color:${st.fasovka === f ? '#fff' : '#1B1815'};
                border:1px solid ${st.fasovka === f ? '#1B1815' : '#E0DAD2'};
                font-size:11px; cursor:pointer;">${esc(f)}</button>
          `).join('')}
        </div>
      </div>`;
  }

  const canSave = (st.target || st.scope === 'all') && (st.pct != null || st.fixed != null);

  host.innerHTML = `
    <div style="font-family:var(--f-display); font-weight:700; font-size:18px; margin-bottom:14px; color:#1B1815;">
      Новое правило для клиента
    </div>

    <div style="font-size:11px; color:#665D52; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">На что действует</div>
    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">
      ${scopeChips}
    </div>

    ${st.scope !== 'all' ? `
      <div style="font-size:11px; color:#665D52; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Выбери конкретно</div>
      <div style="margin-bottom:14px;">${targetBlock}</div>
    ` : `<div style="margin-bottom:14px;">${targetBlock}</div>`}

    <div style="font-size:11px; color:#665D52; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Скидка</div>
    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
      ${pctChips}
    </div>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:6px;">
      <span style="font-size:12px; color:#665D52;">Своя:</span>
      <input type="number" min="0" max="100" step="0.5" placeholder="%" value="${customPctActive ? st.pct : ''}"
        oninput="_prSet({pct: this.value === '' ? null : parseFloat(this.value), fixed: null})"
        style="flex:1; height:38px; padding:0 12px; border:2px solid ${customPctActive ? '#1B1815' : '#E0DAD2'}; border-radius:8px; background:#fff; color:#1B1815; font-size:14px; font-weight:600; box-sizing:border-box;">
      <span style="font-size:12px; color:#665D52;">или фикс ₽:</span>
      <input type="number" min="0" step="1" placeholder="₽" value="${fixedActive ? st.fixed : ''}"
        oninput="_prSet({fixed: this.value === '' ? null : parseFloat(this.value), pct: null})"
        style="flex:1; height:38px; padding:0 12px; border:2px solid ${fixedActive ? '#1B1815' : '#E0DAD2'}; border-radius:8px; background:#fff; color:#1B1815; font-size:14px; font-weight:600; box-sizing:border-box;">
    </div>

    ${fasovkaBlock}

    <div style="display:flex; gap:8px; margin-top:20px;">
      <button onclick="_adminCloseModal()"
        style="flex:1; height:48px; border-radius:999px; background:#fff; border:1.5px solid #E0DAD2; color:#665D52; font-weight:600; font-size:14px; cursor:pointer;">Отмена</button>
      <button ${canSave ? '' : 'disabled'} onclick="rb._savePricing(${uid})"
        style="flex:2; height:48px; border-radius:999px; background:${canSave ? '#1B1815' : '#999'}; color:#FAF7F2; border:0; font-weight:700; font-size:14px; cursor:${canSave ? 'pointer' : 'not-allowed'};">Сохранить</button>
    </div>
  `;
}

function _openCardEditor(p) {
  STATE._ce = JSON.parse(JSON.stringify(p));
  if (!Array.isArray(STATE._ce.fasovka)) STATE._ce.fasovka = [];
  _adminModal('<div id="rb-ce-host"></div>');
  _ceRender();
}

function _ceRender() {
  const host = document.getElementById('rb-ce-host');
  if (!host) return;
  const p = STATE._ce;
  const meta = STATE.adminCatalogMeta || { categories: [], subcategories: {}, fasovkas: [] };
  const cats = meta.categories || [];
  const subsByCat = meta.subcategories || {};
  const subOpts = subsByCat[p.category] || [];
  const photoUrl = p.photo ? p.photo : '';

  // ── Стили (общие на весь экран) ──────────────────────────────
  const ST = {
    section: 'margin:0 -18px 16px; padding:14px 18px; background:#FAF7F2; border-top:1px solid #EFE9DF; border-bottom:1px solid #EFE9DF;',
    label: 'font-size:11px; font-weight:600; color:#665D52; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;',
    input: 'width:100%; height:46px; padding:0 14px; border:1.5px solid #E0DAD2; border-radius:12px; background:#fff; color:#1B1815; font-family:inherit; font-size:15px; box-sizing:border-box; outline:none;',
    inputBig: 'width:100%; padding:14px; border:1.5px solid #E0DAD2; border-radius:12px; background:#fff; color:#1B1815; font-family:inherit; font-size:15px; box-sizing:border-box; outline:none; resize:vertical; min-height:90px; line-height:1.4;',
    chip: (active) => `padding:8px 14px; border-radius:999px; background:${active ? '#1B1815' : '#fff'}; color:${active ? '#fff' : '#1B1815'}; border:1.5px solid ${active ? '#1B1815' : '#E0DAD2'}; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;`,
    primaryBtn: 'flex:2; height:50px; border-radius:999px; background:#1B1815; color:#FAF7F2; border:0; font-weight:700; font-size:15px; cursor:pointer; box-shadow:0 2px 8px rgba(27,24,21,0.25);',
    ghostBtn: 'flex:1; height:50px; border-radius:999px; background:#fff; border:1.5px solid #E0DAD2; color:#665D52; font-weight:600; font-size:14px; cursor:pointer;',
  };

  // ── HEADER: превью + фото-кнопка ─────────────────────────────
  const headerHTML = `
    <div style="display:flex; gap:14px; align-items:flex-start; margin-bottom:8px;">
      <label style="position:relative; flex:0 0 auto; width:88px; height:88px; border-radius:14px; overflow:hidden; cursor:pointer; background:${photoUrl ? `#fff url('${esc(photoUrl)}') center/cover no-repeat` : '#F0EAE0'}; border:1.5px solid #E0DAD2; display:flex; align-items:center; justify-content:center;">
        ${photoUrl ? '' : '<span style="font-size:28px; opacity:0.4;">📷</span>'}
        <input type="file" accept="image/jpeg,image/png,image/webp"
          onchange="rb._cePhotoChange(this.files[0])"
          style="position:absolute; inset:0; opacity:0; cursor:pointer;">
        <div style="position:absolute; bottom:0; left:0; right:0; padding:3px 0; background:rgba(0,0,0,0.55); color:#fff; font-size:9px; text-align:center; font-weight:600; letter-spacing:0.5px; text-transform:uppercase;">${photoUrl ? 'СМЕНИТЬ' : 'ФОТО'}</div>
      </label>
      <div style="flex:1; min-width:0; padding-top:4px;">
        <div style="font-family:var(--f-display); font-weight:800; font-size:20px; color:#1B1815; line-height:1.2;">Редактор товара</div>
        <div style="font-size:11px; color:#999; margin-top:6px; font-family:monospace; word-break:break-all;">${esc(p.id || '— новый —')}</div>
      </div>
    </div>
  `;

  // ── Название + категория ─────────────────────────────────────
  const nameBlock = `
    <div style="margin-bottom:14px;">
      <div style="${ST.label}">Название</div>
      <input id="rb-ce-name" type="text" value="${esc(p.name || '')}"
        oninput="STATE._ce.name = this.value"
        style="${ST.input} font-weight:600;">
    </div>
  `;

  // Категории chip-style
  const catBlock = `
    <div style="margin-bottom:14px;">
      <div style="${ST.label}">Категория</div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${cats.map(c => `<button onclick="STATE._ce.category='${esc(c)}'; STATE._ce.subcategory=''; _ceRender();" style="${ST.chip(p.category === c)}">${esc(c)}</button>`).join('')}
      </div>
      ${p.category && !cats.includes(p.category) ? `
        <div style="margin-top:6px; font-size:11px; color:#999;">Текущая (не в списке): <code>${esc(p.category)}</code></div>
      ` : ''}
    </div>
  `;

  // Подкатегории
  const subBlock = `
    <div style="margin-bottom:14px;">
      <div style="${ST.label}">Подкатегория</div>
      ${subOpts.length ? `
        <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;">
          ${subOpts.map(s => `<button onclick="STATE._ce.subcategory='${esc(s)}'; _ceRender();" style="${ST.chip(p.subcategory === s)}">${esc(s)}</button>`).join('')}
        </div>
      ` : ''}
      <input type="text" placeholder="${subOpts.length ? 'или своя' : 'введи подкатегорию'}" value="${esc(p.subcategory || '')}"
        oninput="STATE._ce.subcategory = this.value"
        style="${ST.input}">
    </div>
  `;

  // Country / roast
  const ROASTS = ['E', 'F', 'EF', 'BE', 'BF', 'ДРИП', 'NESPRESSO', ''];
  const roastBlock = `
    <div style="display:flex; gap:12px; margin-bottom:14px;">
      <div style="flex:2;">
        <div style="${ST.label}">Страна</div>
        <input id="rb-ce-country" type="text" value="${esc(p.country || '')}"
          oninput="STATE._ce.country = this.value"
          placeholder="напр. Бразилия"
          style="${ST.input}">
      </div>
      <div style="flex:3;">
        <div style="${ST.label}">Обжарка</div>
        <div style="display:flex; flex-wrap:wrap; gap:5px;">
          ${ROASTS.map(r => `<button onclick="STATE._ce.roast='${esc(r)}'; _ceRender();" style="${ST.chip((p.roast || '') === r)} padding:8px 10px;">${esc(r || '—')}</button>`).join('')}
        </div>
      </div>
    </div>
  `;

  // Описание
  const descBlock = `
    <div style="margin-bottom:14px;">
      <div style="${ST.label}">Описание</div>
      <textarea oninput="STATE._ce.description = this.value" placeholder="Вкусовой профиль, регион, аромат..."
        style="${ST.inputBig}">${esc(p.description || '')}</textarea>
    </div>
  `;

  // Фасовки — карточный layout
  const fasovkaBlock = `
    <div style="${ST.section}">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div style="${ST.label} margin:0;">Фасовки · ${p.fasovka.length}</div>
        <button onclick="STATE._ce.fasovka.push({size:'', price:0}); _ceRender();"
          style="height:34px; padding:0 14px; border-radius:999px; background:#1B1815; color:#fff; border:0; font-size:12px; font-weight:700; cursor:pointer;">+ ДОБАВИТЬ</button>
      </div>
      ${p.fasovka.length === 0 ? `
        <div style="padding:24px; text-align:center; color:#999; font-size:13px; background:#fff; border-radius:12px; border:1.5px dashed #E0DAD2;">
          У товара пока нет фасовок<br><span style="font-size:11px;">нажми <b>+ ДОБАВИТЬ</b> чтобы создать</span>
        </div>
      ` : `
        <div style="display:flex; flex-direction:column; gap:10px;">
          ${p.fasovka.map((f, i) => _ceFasovkaCard(f, i)).join('')}
        </div>
      `}
    </div>
  `;

  // Флаги (toggle карточки)
  const flagsBlock = `
    <div style="display:flex; gap:10px; margin-bottom:18px;">
      <button onclick="STATE._ce.hidden = !STATE._ce.hidden; _ceRender();"
        style="flex:1; padding:14px; border-radius:14px; background:${p.hidden ? '#1B1815' : '#fff'}; color:${p.hidden ? '#fff' : '#1B1815'}; border:1.5px solid ${p.hidden ? '#1B1815' : '#E0DAD2'}; font-size:13px; cursor:pointer; text-align:left;">
        <div style="font-size:20px; margin-bottom:4px;">${p.hidden ? '🙈' : '👁'}</div>
        <div style="font-weight:700;">${p.hidden ? 'Скрыт' : 'Виден'}</div>
        <div style="font-size:10px; opacity:0.7; margin-top:2px;">в каталоге</div>
      </button>
      <button onclick="STATE._ce.on_request = !STATE._ce.on_request; _ceRender();"
        style="flex:1; padding:14px; border-radius:14px; background:${p.on_request ? '#1B1815' : '#fff'}; color:${p.on_request ? '#fff' : '#1B1815'}; border:1.5px solid ${p.on_request ? '#1B1815' : '#E0DAD2'}; font-size:13px; cursor:pointer; text-align:left;">
        <div style="font-size:20px; margin-bottom:4px;">${p.on_request ? '📞' : '💰'}</div>
        <div style="font-weight:700;">${p.on_request ? 'По запросу' : 'Цена видна'}</div>
        <div style="font-size:10px; opacity:0.7; margin-top:2px;">без онлайн-заказа</div>
      </button>
    </div>
  `;

  // Sticky footer
  const footer = `
    <div style="position:sticky; bottom:-20px; left:-18px; right:-18px; margin:0 -18px -20px; padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:#fff; border-top:1px solid #EFE9DF; display:flex; gap:10px;">
      <button onclick="_adminCloseModal()" style="${ST.ghostBtn}">Отмена</button>
      <button onclick="rb._saveCardFromState()" style="${ST.primaryBtn}">💾 Сохранить</button>
    </div>
  `;

  host.innerHTML = headerHTML + nameBlock + catBlock + subBlock + roastBlock + descBlock + fasovkaBlock + flagsBlock + footer;
}

function _ceFasovkaCard(f, idx) {
  const onReq = !!f.on_request;
  const price = f.price != null ? f.price : '';
  return `
    <div style="background:#fff; border-radius:12px; padding:12px; border:1.5px solid #E0DAD2;">
      <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
        <input type="text" placeholder="напр. 1 кг" value="${esc(f.size || '')}"
          oninput="STATE._ce.fasovka[${idx}].size = this.value"
          style="flex:1; height:42px; padding:0 12px; border:1.5px solid #E0DAD2; border-radius:10px; background:#FAF7F2; color:#1B1815; font-size:15px; font-weight:700; box-sizing:border-box; outline:none;">
        <button onclick="STATE._ce.fasovka.splice(${idx}, 1); _ceRender();"
          title="Удалить фасовку"
          style="flex:0 0 auto; width:42px; height:42px; border-radius:10px; background:#fff; border:1.5px solid #E0DAD2; color:#C45A4A; font-size:18px; cursor:pointer; padding:0;">🗑</button>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <div style="flex:2; position:relative;">
          <input type="number" min="0" step="1" placeholder="0" value="${onReq ? '' : price}" ${onReq ? 'disabled' : ''}
            oninput="STATE._ce.fasovka[${idx}].price = parseFloat(this.value) || 0"
            style="width:100%; height:42px; padding:0 36px 0 12px; border:1.5px solid #E0DAD2; border-radius:10px; background:${onReq ? '#F5F0E8' : '#fff'}; color:${onReq ? '#999' : '#1B1815'}; font-size:16px; font-weight:700; box-sizing:border-box; outline:none;">
          <span style="position:absolute; right:14px; top:50%; transform:translateY(-50%); color:#999; font-size:14px; pointer-events:none;">₽</span>
        </div>
        <label style="flex:3; display:flex; align-items:center; gap:8px; padding:0 12px; height:42px; background:${onReq ? '#1B1815' : '#fff'}; color:${onReq ? '#fff' : '#1B1815'}; border:1.5px solid ${onReq ? '#1B1815' : '#E0DAD2'}; border-radius:10px; cursor:pointer; font-size:12px; font-weight:600;">
          <input type="checkbox" ${onReq ? 'checked' : ''}
            onchange="STATE._ce.fasovka[${idx}].on_request = this.checked; _ceRender();"
            style="width:16px; height:16px; accent-color:${onReq ? '#fff' : '#1B1815'};">
          <span>${onReq ? '✓ По запросу' : 'По запросу'}</span>
        </label>
      </div>
    </div>
  `;
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN: Список товаров с inline-stock-editor + фильтрами
   ════════════════════════════════════════════════════════════════════ */
function screenAdminProducts() {
  const f = STATE.adminProductsFilter || 'all';
  const q = (STATE.adminProductsQuery || '').trim().toLowerCase();
  const all = STATE.data?.products || [];

  const hasPrice = (p) => Array.isArray(p.fasovka) && p.fasovka.some(f => typeof f.price === 'number' && f.price > 0 && !f.on_request);

  let list = all;
  if (f === 'quarantine') list = list.filter(p => p.quarantined);
  else if (f === 'zero')  list = list.filter(p => typeof p.stock === 'number' && p.stock <= 0 && !p.on_request);
  else if (f === 'low')   list = list.filter(p => typeof p.stock === 'number' && p.stock > 0 && p.stock < 5);
  else if (f === 'no_photo') list = list.filter(p => !p.photo || (typeof p.photo === 'string' && p.photo.indexOf('placeholders/') !== -1));
  else if (f === 'no_price') list = list.filter(p => !hasPrice(p) && !p.on_request);
  if (q) {
    list = list.filter(p => {
      const hay = (p.name + ' ' + (p.country||'') + ' ' + (p.id||'')).toLowerCase();
      return hay.includes(q);
    });
  }
  list = list.slice().sort((a, b) => NAME_COLLATOR.compare(a.name || '', b.name || ''));

  const cntAll  = all.length;
  const cntQ    = all.filter(p => p.quarantined).length;
  const cntZero = all.filter(p => typeof p.stock === 'number' && p.stock <= 0 && !p.on_request).length;
  const cntLow  = all.filter(p => typeof p.stock === 'number' && p.stock > 0 && p.stock < 5).length;
  const cntNoP  = all.filter(p => !p.photo || (typeof p.photo === 'string' && p.photo.indexOf('placeholders/') !== -1)).length;
  const cntNoPrice = all.filter(p => !hasPrice(p) && !p.on_request).length;

  const chip = (id, label, count) => `<button onclick="rb.adminProductsFilter('${id}')" class="chip${f === id ? ' chip--ink' : ''}" style="height:28px; cursor:pointer; font-size:11px;">${label} · ${count}</button>`;

  return `
    <div style="padding:0 16px 8px;">
      <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 14px; height:40px; margin-bottom:10px;">
        <span style="color:var(--ink-soft);">${icon('search', 14)}</span>
        <input type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
          placeholder="Поиск по имени / id / стране"
          value="${esc(q)}"
          oninput="rb.adminProductsSearch(this.value)"
          style="flex:1; border:0; outline:0; background:transparent; font-size:13px; font-family:var(--f-body); color:var(--ink); min-width:0;" />
        ${q ? `<button onclick="rb.adminProductsSearch('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:16px; padding:2px 4px; cursor:pointer;">×</button>` : ''}
      </div>
      <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;">
        ${chip('all', 'Все', cntAll)}
        ${chip('quarantine', '⛔ Карантин', cntQ)}
        ${chip('zero', '0 на складе', cntZero)}
        ${chip('low', '< 5', cntLow)}
        ${chip('no_price', '₽ Без цены', cntNoPrice)}
        ${chip('no_photo', 'Без фото', cntNoP)}
      </div>
    </div>

    ${list.length === 0
      ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Ничего не найдено</div>`
      : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:8px 16px 16px; border:1px solid var(--line);">
        ${list.slice(0, 200).map(p => {
          const s = typeof p.stock === 'number' ? p.stock : null;
          const isQ = !!p.quarantined;
          const stockColor = isQ ? 'var(--ink-faint)'
                            : s === null ? 'var(--ink-faint)'
                            : s <= 0 ? 'var(--danger)'
                            : s < 5 ? '#C97E3C'
                            : 'var(--ink)';
          return `
            <div style="background:var(--surface); display:flex; gap:10px; padding:10px 12px; align-items:center;${isQ ? ' opacity:0.62;' : ''}">
              ${productImg(p, '1', 'width:42px; height:42px; flex:0 0 auto; border-radius:6px;')}
              <div onclick="rb.adminEditCard('${esc(p.id)}')" style="flex:1; min-width:0; overflow:hidden; cursor:pointer;">
                <div style="font-family:var(--f-display); font-weight:700; font-size:13px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(p.name)}</div>
                <div class="meta" style="font-size:9px; color:var(--ink-faint); margin-top:2px;">${esc(p.category || '')}${p.country ? ' · ' + esc(p.country) : ''}${isQ ? ' · <span style="color:var(--danger)">в карантине</span>' : ''}</div>
              </div>
              <div style="display:flex; align-items:center; gap:4px; flex:0 0 auto;">
                <button onclick="rb.adminAdjustStock('${esc(p.id)}', -1)" style="width:26px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:14px; cursor:pointer; padding:0;">−</button>
                <button onclick="rb.adminSetStock('${esc(p.id)}')" style="min-width:38px; padding:0 6px; height:26px; border-radius:8px; background:transparent; border:1px solid var(--line); color:${stockColor}; font-family:var(--f-mono); font-weight:700; font-size:12px; cursor:pointer;">${s === null ? '—' : s}</button>
                <button onclick="rb.adminAdjustStock('${esc(p.id)}', 1)" style="width:26px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:14px; cursor:pointer; padding:0;">+</button>
