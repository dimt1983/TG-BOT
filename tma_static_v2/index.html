<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roastberry</title>
<meta name="theme-color" content="#FAF7F2" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg, #FAF7F2); }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overscroll-behavior-y: contain; }
  #root { min-height: 100vh; padding-bottom: 110px; }
  .rb a { color: inherit; }
  .rb button { font: inherit; }
  @keyframes rb-blink { 50% { opacity: 0 } }
  .rb-cursor { display:inline-block; width:1.5px; height:17px; background:var(--copper); margin-left:1px; vertical-align:middle; animation: rb-blink 1s steps(2) infinite; }
  .rb-spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--ink-mute); border-top-color: var(--ink); border-radius:50%; animation: rb-spin 0.7s linear infinite; }
  @keyframes rb-spin { to { transform: rotate(360deg); } }
  .rb-toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:100; box-shadow: var(--sh-2); opacity:0; transition:opacity .2s; pointer-events:none; }
  .rb-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="root">
  <div style="padding:80px 24px; text-align:center; color:#8a7a6c">
    <div class="rb-spinner" style="margin-bottom:14px"></div>
    <div style="font-family:'Inter',sans-serif; font-size:13px">Загружаю каталог…</div>
  </div>
</div>

<div id="rb-toast" class="rb-toast"></div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   TELEGRAM SDK + AUTH
   ════════════════════════════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
try { tg?.ready?.(); tg?.expand?.(); } catch(e) {}
const IS_TG = !!(tg && tg.initData && tg.initData.length > 0);
const IS_DARK = (tg?.colorScheme === 'dark') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

function authHeaders() { return IS_TG ? { 'X-Tma-InitData': tg.initData } : {}; }
function haptic(kind = 'light') {
  try {
    if (kind === 'success' || kind === 'error' || kind === 'warning') tg?.HapticFeedback?.notificationOccurred?.(kind);
    else tg?.HapticFeedback?.impactOccurred?.(kind);
  } catch (e) {}
}
function toast(msg, ms = 1600) {
  const el = document.getElementById('rb-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

/* ════════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════════ */
const STATE = {
  data: null,                    // products.json
  cart: [],                      // [{id, fasovka, qty}]
  favorites: [],                 // [id]
  screen: 'home',                // home | catalog | product | cart | profile
  cat: null,                     // top categoryId for catalog
  subcat: null,                  // drill-cursor — указывает где мы внутри иерархии (любой subcat id)
  showAll: false,                // true → пропускаем drill, рендерим плоский список
  fasovkaSplit: null,            // '1 кг' | '200 г' | null — split категории по фасовкам (см. SPLIT_BY_FASOVKA)
  productId: null,
  productFasovka: null,          // selected size in product screen
  productKg: 1,                  // selected weight for discount calculator
  isAdmin: false,
  history: [],                   // navigation stack
  searchQuery: '',
  myOrders: undefined,
  // Фильтры на странице списка товаров:
  filters: {
    fasovka: null,               // '200г' | '1кг' | null
    inStock: false,
    countries: [],               // ['Бразилия','Эфиопия'...]
    flavors: [],                 // ['шоколад','ягоды'...]
  },
  filterOpen: false,             // открыта ли панель фильтров
};
function resetFilters() {
  STATE.filters = { fasovka: null, inStock: false, countries: [], flavors: [] };
  STATE.filterOpen = false;
}

const STORAGE_KEY = 'rb-v2-state-1';
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cart: STATE.cart, favorites: STATE.favorites })); } catch(e){}
}
function loadLocal() {
  try {
    const j = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    STATE.cart = j.cart || [];
    STATE.favorites = j.favorites || [];
  } catch(e){}
}

/* ════════════════════════════════════════════════════════════════════
   ICONS — 24 SVG paths
   ════════════════════════════════════════════════════════════════════ */
const ICONS = {
  search:'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14ZM16.5 16.5L21 21',
  bag:'M6 8h12l-.8 11a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9L6 8Zm3 0V6a3 3 0 0 1 6 0v2',
  menu:'M4 7h16M4 12h16M4 17h12',
  back:'M14 6l-6 6 6 6',
  more:'M5 12h.01M12 12h.01M19 12h.01',
  plus:'M12 5v14M5 12h14',
  minus:'M5 12h14',
  heart:'M12 20s-7-4.5-9.3-9A5.3 5.3 0 0 1 12 5.2 5.3 5.3 0 0 1 21.3 11C19 15.5 12 20 12 20Z',
  filter:'M4 6h16M7 12h10M10 18h4',
  home:'M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-7h-6v7H5a1 1 0 0 1-1-1v-9Z',
  user:'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 10c0-4 4-6 8-6s8 2 8 6',
  flame:'M12 3s4 4.5 4 8.5A4 4 0 0 1 12 16a4 4 0 0 1-4-4.5C8 9 12 3 12 3Z',
  cup:'M5 7h13v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5V7Z M18 9h2a2 2 0 0 1 0 4h-2',
  truck:'M3 7h11v9H3V7Zm11 3h4l3 3v3h-7v-6ZM7 18a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm10 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z',
  doc:'M7 3h7l5 5v13H7V3Z M14 3v5h5 M9 13h7M9 17h7',
  scale:'M12 5v14 M5 8h14 M5 8l-2 7a4 4 0 0 0 8 0L9 8 M15 8l-2 7a4 4 0 0 0 8 0l-2-7',
  clock:'M12 7v6l4 2 M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18Z',
  drop:'M12 3c0 0 6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11Z',
  therm:'M12 14a3 3 0 1 0 1 5.8V8a3 3 0 0 0-6 0v0Z M12 4v10 M12 4a2 2 0 0 1 2 2v8',
  grind:'M5 5h14v4H5V5Zm0 5h14v3l-2 8H7l-2-8v-3Z M9 5v-2h6v2',
  arrowR:'M5 12h14M13 6l6 6-6 6',
  gear:'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9 1.7 1.7 0 0 0 4.3 7.2l-.1-.1A2 2 0 1 1 7 4.3l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z',
};
function icon(name, size = 18, sw = 1.6) {
  const d = ICONS[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="${d}"/></svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   TASTE HUE AUTO-MAP — словарь нот → цвет + интенсивность
   ════════════════════════════════════════════════════════════════════ */
const TASTE_HUES = {
  // шоколад / какао
  'шоколад':'#6F4E37','тёмный шоколад':'#3A2A1F','молочный шоколад':'#8B5224','какао':'#6F4E37','патока':'#4A3422',
  // ягоды
  'ягоды':'#9C3B52','клубника':'#9C3B52','малина':'#9C3B52','клюква':'#9C3B52','чёрная смородина':'#5A2848','смородина':'#7A2E4E',
  'вишня':'#7A2E2E','копчёная вишня':'#5E2020','черника':'#3A2848',
  // косточковые
  'персик':'#E2B190','абрикос':'#D89060','слива':'#7A4A6E',
  // цитрус
  'цитрус':'#C97E3C','лимон':'#E0B83C','апельсин':'#D87830','бергамот':'#C97E3C','грейпфрут':'#D45E5E','лайм':'#C0D03C',
  // карамель / мёд
  'карамель':'#C9A66B','мёд':'#D4A953','тростниковый сахар':'#C9A66B','ваниль':'#E8D8A8',
  // орех
  'орех':'#A87C50','миндаль':'#B89172','фундук':'#A87C50','грецкий орех':'#8B6840',
  // фрукты
  'красное яблоко':'#9C3B52','яблоко':'#7A9B5E','груша':'#A8C079','банан':'#E8D560',
  // тропики
  'тропики':'#E8B73C','манго':'#E0A032','ананас':'#E0B83C','личи':'#E8B7C8','маракуйя':'#E2B53C','папайя':'#E08050',
  // цветочные
  'жасмин':'#C087B7','роза':'#C46A8E','цветочные':'#C087B7','лепестки роз':'#C46A8E','лаванда':'#9078B0',
  // чай / травы
  'чёрный чай':'#5E4232','зелёный чай':'#7A9B5E','травы':'#5E7A4F','мята':'#5E7A4F','чабрец':'#5E7A4F','шиповник':'#C46A4E',
  'цукат':'#D89060',
  // пряности / тяжёлые
  'специи':'#A8412E','табак':'#5E4232','дым':'#5E4232','перец':'#7A2E2E','имбирь':'#D89060','кардамон':'#A8412E',
  // винные
  'вино':'#7A2E4E','красное вино':'#7A2E4E','порт':'#5A2848',
  // прочее
  'томат':'#C04030','хлеб':'#C9A66B','инжир':'#7A4A6E',
  '_default':'#6F4E37',
};
function tasteHue(note) {
  const k = String(note || '').toLowerCase().trim();
  if (TASTE_HUES[k]) return TASTE_HUES[k];
  for (const key in TASTE_HUES) {
    if (key !== '_default' && (k.includes(key) || key.includes(k))) return TASTE_HUES[key];
  }
  return TASTE_HUES._default;
}
function tastingForProduct(p) {
  const notes = p?.tasting_notes || [];
  if (!Array.isArray(notes) || !notes.length) return [];
  return notes.slice(0, 5).map((n, i, arr) => ({
    label: String(n),
    intensity: Math.max(2, 5 - i * (5 / Math.max(arr.length, 5))),
    hue: tasteHue(n),
  }));
}

/* ════════════════════════════════════════════════════════════════════
   COUNTRY FLAGS — 2-letter code by country name
   ════════════════════════════════════════════════════════════════════ */
const FLAG_CODES = {
  'Бразилия':'br','Эфиопия':'et','Колумбия':'co','Кения':'ke','Гватемала':'gt',
  'Россия':'ru','Германия':'de','Перу':'pe','Гондурас':'hn','Никарагуа':'ni',
  'Танзания':'tz','Уганда':'ug','Руанда':'rw','Китай':'cn','Коста-Рика':'cr',
  'Коста-Рико':'cr','Индия':'in','Индонезия':'id','Йемен':'ye','Мьянма':'mm',
  'Эквадор':'ec','Боливия':'bo','Сальвадор':'sv','Мексика':'mx',
};
function flagDot(country) {
  const code = FLAG_CODES[country] || '';
  return code ? `<span class="flag flag--${code}"></span>` : `<span class="flag"></span>`;
}

/* ════════════════════════════════════════════════════════════════════
   DISCOUNT TIERS — лестница скидок по весу
   ════════════════════════════════════════════════════════════════════ */
const TIERS = [
  { min: 25, d: 0.20 },
  { min: 10, d: 0.10 },
  { min: 0,  d: 0.00 },
];
function tierFor(kg) {
  for (const t of TIERS) if (kg >= t.min) return t.d;
  return 0;
}

/* ════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU');

function sizeToKg(size) {
  const m = String(size || '').match(/(\d+(?:[.,]\d+)?)\s*(кг|г|гр)/i);
  if (!m) return 0;
  const n = parseFloat(m[1].replace(',', '.'));
  return /к/i.test(m[2]) ? n : n / 1000;
}

function cartCount() {
  return STATE.cart.reduce((s, i) => s + (i.qty || 1), 0);
}
function cartWeightKg() {
  let kg = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    if (!COFFEE_CATS.includes(p.category)) continue;
    kg += sizeToKg(it.fasovka) * (it.qty || 1);
  }
  return kg;
}
function cartSubtotal() {
  let s = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    const f = (p.fasovka || []).find(x => x.size === it.fasovka);
    if (!f || f.on_request || typeof f.price !== 'number') continue;
    s += f.price * (it.qty || 1);
  }
  return s;
}

function findProduct(id) { return STATE.data?.products.find(x => x.id === id); }
function productInSub(p, subId) {
  if (!subId || subId === 'all') return true;
  return p.subcategory === subId || (Array.isArray(p.subcategories) && p.subcategories.includes(subId));
}

/* ────────────── visibility (parity with prod) ────────────── */
function isVisibleInCatalog(p) {
  if (!p) return false;
  if (p.hidden) return false;
  if (p.quarantined && !STATE.isAdmin) return false;
  if (STATE.isAdmin) return true;
  const s = (typeof p.stock === 'number') ? p.stock : null;
  if (s !== null && s <= 0) {
    if (p.pair_id) {
      const sib = STATE.data.products.find(x => x.pair_id === p.pair_id && x.id !== p.id);
      if (sib && typeof sib.stock === 'number' && sib.stock > 0) return true;
    }
    return false;
  }
  return true;
}
function visibleProducts() {
  return (STATE.data?.products || []).filter(isVisibleInCatalog);
}

/* ════════════════════════════════════════════════════════════════════
   ATOMS
   ════════════════════════════════════════════════════════════════════ */
function btnGhost(inner, attrs = '') {
  return `<button class="btn-ghost" ${attrs}>${inner}</button>`;
}
function appHeader({ title = '', back = false, action = '', logo = false } = {}) {
  return `
    <div style="position:sticky; top:0; z-index:10; padding:54px 16px 12px; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;">
      ${back
        ? `<button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.back()">${icon('back')}</button>`
        : (logo
          ? `<div style="font-family:var(--f-display); font-weight:900; font-size:16px; letter-spacing:0.04em; flex:1;">ROASTBERRY<span style="color:var(--copper)">.</span></div>`
          : '')}
      ${title ? `<div style="flex:1; text-align:center; font-family:var(--f-display); font-weight:700; font-size:15px;">${esc(title)}</div>` : ''}
      <div style="display:flex; gap:6px; margin-left:auto;">
        ${action || `
          <button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.go('search')">${icon('search')}</button>
          <button class="btn-ghost" style="width:36px; padding:0; justify-content:center; position:relative" onclick="rb.go('cart')">${icon('bag')}${cartCount() ? `<span style="position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; border-radius:999px; background:var(--copper); color:#fff; font-size:10px; font-weight:700; font-family:var(--f-mono); display:flex; align-items:center; justify-content:center; padding:0 4px;">${cartCount()}</span>` : ''}</button>
        `}
      </div>
    </div>`;
}

function tabBar(active) {
  const tabs = [
    { id: 'home',    label: 'Главная', i: 'home' },
    { id: 'catalog', label: 'Каталог', i: 'menu' },
    { id: 'search',  label: 'Поиск',   i: 'search' },
    { id: 'cart',    label: 'Корзина', i: 'bag',  badge: cartCount() },
    { id: 'profile', label: 'Я',       i: 'user' },
  ];
  return `
    <div style="position:fixed; bottom:0; left:0; right:0; padding:8px 8px calc(env(safe-area-inset-bottom,18px) + 12px); background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-top:1px solid var(--line); display:flex; justify-content:space-around; z-index:9;">
      ${tabs.map(t => `
        <button onclick="rb.go('${t.id}')" style="flex:1; background:transparent; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; color:${t.id === active ? 'var(--ink)' : 'var(--ink-faint)'}; cursor:pointer; position:relative;">
          <span style="position:relative">${icon(t.i, 22)}${t.badge ? `<span style="position:absolute; top:-3px; right:-8px; min-width:14px; height:14px; padding:0 3px; background:var(--copper); color:#fff; border-radius:999px; font-size:9px; font-weight:700; font-family:var(--f-mono); display:flex; align-items:center; justify-content:center;">${t.badge}</span>` : ''}</span>
          <span style="font-size:10px; font-weight:500;">${t.label}</span>
        </button>
      `).join('')}
    </div>`;
}

function placeholder(label, ratio = '4 / 3', extra = '') {
  return `<div class="ph" style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra}">${esc(label || '')}</div>`;
}

/* Цвета-заглушки для кофейных категорий (брендбук _brand/palettes/COLORS.md). */
const CAT_PLACEHOLDER = {
  espresso: '#C8312A',
  filter:   '#9BA82E',
  retail:   '#FFFFFF',
  black:    '#2A2A2A',
  borshch:  '#D84315',
};

/* Фотка товара.
   p.photo === строка-путь, НЕ ведёт на placeholders/ → image
   p.photo === строка с placeholders/ или '' / undefined → цветная плашка по категории,
                                                            иначе legacy placeholder с label */
function productImg(p, ratio = '1', extra = '', label = '') {
  const src = p?.photo;
  const isPlaceholderPath = typeof src === 'string' && src.indexOf('placeholders/') !== -1;
  const isRealPhoto = typeof src === 'string' && src.length > 0 && !isPlaceholderPath;

  if (isRealPhoto) {
    const url = /^https?:\/\//.test(src) ? src
              : src.startsWith('/') ? src
              : '/tma/' + src.replace(/^tma_static\//, '');
    return `<div style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra} background-image:url('${url}'); background-size:cover; background-position:center; background-repeat:no-repeat; background-color:var(--surface-2);"></div>`;
  }
  const bg = CAT_PLACEHOLDER[p?.category];
  if (bg) {
    const border = bg === '#FFFFFF' ? 'box-shadow: inset 0 0 0 1px var(--line);' : '';
    return `<div style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra} background:${bg}; ${border}"></div>`;
  }
  if (src === '') {
    return `<div style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra} background:var(--surface-2);"></div>`;
  }
  return `<div class="ph" style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra}">${esc(label || '')}</div>`;
}

function stepper(value, decAction, incAction, ink = false) {
  return `
    <div class="stepper${ink ? ' stepper--ink' : ''}">
      <button onclick="${decAction}">−</button>
      <span>${value}</span>
      <button onclick="${incAction}">+</button>
    </div>`;
}

function freshDot(daysAgo) {
  const word = daysAgo === 1 ? 'день' : daysAgo < 5 ? 'дня' : 'дней';
  return `<span style="display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--green); font-weight:600;"><span style="width:6px; height:6px; border-radius:999px; background:var(--green)"></span>обжарено ${daysAgo} ${word} назад</span>`;
}

function roastBadge(roast) {
  if (!roast) return '';
  const cls = roast === 'F' ? ' roast--f' : '';
  return `<span class="roast${cls}">${esc(roast)}</span>`;
}

function chip(text, cls = '', extra = '') {

/* ────────────── Tasting footprint (SVG 5 spokes) ────────────── */
function tasting(notes, size = 148) {
  if (!notes || !notes.length) return '';
  const cx = size / 2, cy = size / 2;
  const rMin = 12, rMax = size / 2 - 22;
  const spokes = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const r = rMin + (rMax - rMin) * (n.intensity / 5);
    const x = (cx + Math.cos(a) * r).toFixed(2);
    const y = (cy + Math.sin(a) * r).toFixed(2);
    const x0 = (cx + Math.cos(a) * rMin).toFixed(2);
    const y0 = (cy + Math.sin(a) * rMin).toFixed(2);
    return `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${n.hue}" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3.5" fill="${n.hue}"/>`;
  }).join('');
  const labels = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const lx = cx + Math.cos(a) * (rMax + 6);
    const ly = cy + Math.sin(a) * (rMax + 6);
    const tx = Math.cos(a), ty = Math.sin(a);
    const trX = tx > 0.3 ? '0' : tx < -0.3 ? '-100%' : '-50%';
    const trY = ty > 0.3 ? '0' : ty < -0.3 ? '-100%' : '-50%';
    return `<div style="position:absolute; left:${lx}px; top:${ly}px; transform:translate(${trX}, ${trY}); font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; white-space:nowrap;">${esc(n.label)}</div>`;
  }).join('');
  return `
    <div style="position:relative; width:${size}px; height:${size}px; flex:0 0 auto;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${rMin - 2}" fill="none" stroke="var(--ink-mute)" stroke-width="0.8"/>
        <circle cx="${cx}" cy="${cy}" r="${rMax}" fill="none" stroke="var(--ink-mute)" stroke-width="0.5" stroke-dasharray="1 3"/>
        ${spokes}
      </svg>
      ${labels}
    </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   PARSE RECIPE MARKDOWN (упрощённо)
   ════════════════════════════════════════════════════════════════════ */
function parseRecipeRows(md) {
  if (!md) return [];
  // recipe format: "**Type** · key1 value1 · key2 value2 ..."
  const cleaned = md.replace(/\*\*.*?\*\*/g, '').trim();
  const parts = cleaned.split(/\s*·\s*/).filter(Boolean);
  const rows = [];
  const map = [
    [/помол/i, 'grind'],
    [/навеска|доза/i, 'scale'],
    [/выход/i, 'drop'],
    [/время|с\b/i, 'clock'],
    [/температ|°C/i, 'therm'],
  ];
  for (const p of parts) {
    let foundIcon = 'bean';
    let label = '';
    let value = p.trim();
    for (const [re, ic] of map) {
      if (re.test(p)) {
        foundIcon = ic;
        if (/помол/i.test(p))    label = 'Помол';
        else if (/навеска|доза/i.test(p))  label = 'Навеска';
        else if (/выход/i.test(p))         label = 'Выход';
        else if (/температ|°C/i.test(p))   label = 'Темп.';
        else if (/время|\d+\s*с\b/i.test(p)) label = 'Время';
        break;
      }
    }
    if (!label) {
      const m = p.match(/^(.+?)\s+(.+)$/);
      if (m) { label = m[1]; value = m[2]; }
    } else {
      value = p.replace(/^(помол|навеска|доза|выход|время|темп\.?|температура)\s*/i, '').trim();
    }
    rows.push({ icon: foundIcon, label, value });
  }
  return rows;
}

function _stripEmoji(s) {
  s = String(s || '');
  try {
    s = s.replace(/\p{Extended_Pictographic}/gu, '');
  } catch (e) {
    s = s.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F900}-\u{1F9FF}]/gu, '');
  }
  return s.replace(/[️‍]/g, '').replace(/\s+/g, ' ').trim();
}
function _subcatsOf(parentId) { return STATE.data.subcategories.filter(s => s.parent === parentId); }

/* Чип с остатками для карточки каталога. Брендовые chip-классы из tokens.css. */
function stockBadge(p) {
  const STYLE = 'padding:1px 7px; font-size:10px; height:18px;';
  if (p && p.on_request) return `<span class="chip chip--ink" style="${STYLE}">По запросу</span>`;
  const s = (p || {}).stock;
  if (typeof s !== 'number') return '';
  if (s <= 0) return `<span class="chip" style="${STYLE} background:var(--surface-2); color:var(--ink-faint); border-color:var(--line);">Нет в наличии</span>`;
  if (s < 5)  return `<span class="chip chip--amber"  style="${STYLE}">Осталось ${s}</span>`;
  if (s < 20) return `<span class="chip chip--copper" style="${STYLE}">${s} в наличии</span>`;
  return `<span class="chip chip--green" style="${STYLE}">${s} в наличии</span>`;
}
function _hasChildren(subId) { return _subcatsOf(subId).length > 0; }
function _productsInTree(rootId) {
  // все товары под этим узлом (категория ИЛИ подкатегория), включая потомков
  const seen = new Set();
  const queue = [rootId];
  while (queue.length) {
    const id = queue.shift();
    if (seen.has(id)) continue;
    seen.add(id);
    for (const ch of _subcatsOf(id)) queue.push(ch.id);
  }
  return visibleProducts().filter(p => p.category === STATE.cat && (seen.has(p.subcategory) || seen.has(STATE.cat)));
}

function normalizeSize(s) {
  const t = String(s||'').toLowerCase().replace(/\s+/g,'');
  if (/^200г/.test(t)) return '200 г';
  if (/^250г/.test(t)) return '250 г';
  if (/^500г/.test(t)) return '500 г';
  if (/^1кг/.test(t))  return '1 кг';
  return null;
}

function applyFilters(list) {
  const f = STATE.filters;
  let out = list;
  if (f.fasovka) {
    out = out.filter(p => (p.fasovka || []).some(x => normalizeSize(x.size) === f.fasovka));
  }
  if (f.inStock) {
    out = out.filter(p => (typeof p.stock === 'number' && p.stock > 0) || p.on_request);
  }
  if (f.countries.length) {
    out = out.filter(p => p.country && f.countries.includes(p.country));
  }
  if (f.flavors.length) {
    out = out.filter(p => Array.isArray(p.tasting_notes) && p.tasting_notes.some(n => f.flavors.includes(String(n).toLowerCase())));
  }
  return out;
}

function activeFilterCount() {
  const f = STATE.filters;
  return (f.fasovka ? 1 : 0) + (f.inStock ? 1 : 0) + f.countries.length + f.flavors.length;
}

function tileTheme(id) { return TILE_THEME[id] || TILE_THEME._default; }

function _renderTile(s, big = false) {
  const t = tileTheme(s.id);
  const n = _productsInTree(s.id).length || _subcatsOf(s.id).reduce((a, x) => a + _productsInTree(x.id).length, 0);
  const name = _stripEmoji(s.name);
  const onclick = `rb.openSubcat('${esc(s.id)}')`;
  return `
    <div onclick="${onclick}" style="grid-column:${big ? 'span 2' : 'auto'}; background:${t.bg}; color:${t.fg}; border-radius:var(--r-md); aspect-ratio:${big ? '2.3 / 1' : '1.1'}; padding:14px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; ${t.bg === '#FAF7F2' ? 'border:1px solid var(--line);' : ''} cursor:pointer;">
      <div class="meta" style="color:${t.fg}; opacity:0.5;">${n} SKU</div>
      <div style="font-family:var(--f-display); font-weight:900; font-size:${big ? 32 : 20}px; line-height:0.95; letter-spacing:-0.02em; text-transform:uppercase; white-space:pre-line;">${esc(name)}</div>
      <div style="position:absolute; top:12px; right:14px; width:8px; height:8px; border-radius:999px; background:${t.accent};"></div>
    </div>`;
}

function screenCatalog() {
  if (!STATE.data) return '';
  const cat = STATE.data.categories.find(c => c.id === STATE.cat);
  const cursorId = STATE.subcat || STATE.cat;  // куда мы сейчас вглубь
  const children = STATE.cat ? _subcatsOf(cursorId) : [];

  /* Хлебные крошки: Каталог › Категория › L1 › L2 */
  const bread = [];
  if (STATE.cat && cat) {
    bread.push({ id: STATE.cat, name: cat.name, action: `rb.openCat('${esc(STATE.cat)}')` });
  }
  if (STATE.subcat) {
    // строим цепочку от subcat вверх до cat
    const chain = [];
    let cur = STATE.data.subcategories.find(s => s.id === STATE.subcat);
    while (cur && cur.parent && cur.parent !== STATE.cat) {
      chain.unshift(cur);
      cur = STATE.data.subcategories.find(s => s.id === cur.parent);
    }
    if (cur) chain.unshift(cur);
    for (const c of chain) {
      bread.push({ id: c.id, name: _stripEmoji(c.name), action: `rb.openSubcat('${esc(c.id)}')` });
    }
  }
  if (STATE.fasovkaSplit) {
    bread.push({ id: 'fas:' + STATE.fasovkaSplit, name: STATE.fasovkaSplit, action: `rb.openFasovkaSplit('${esc(STATE.fasovkaSplit)}')` });
  }

  // Title — последняя крошка или «Каталог» / название категории
  let title;
  const subObj = STATE.subcat ? STATE.data.subcategories.find(s => s.id === STATE.subcat) : null;
  if (STATE.fasovkaSplit && subObj) {
    title = _stripEmoji(subObj.name) + ' · ' + STATE.fasovkaSplit;
  } else {
    const titleSrc = subObj?.name || cat?.name;
    title = titleSrc ? _stripEmoji(titleSrc) : 'Каталог';
  }

  // Подкатегории retail (Эспрессо / Фильтр / Купажи), где идёт split по фасовкам 1кг / 200г.
  const isSplitSub = STATE.subcat && SPLIT_BY_FASOVKA_SUB.includes(STATE.subcat);
  // Решение: drill-плитки или плоский список
  const showTiles = STATE.cat && !STATE.showAll && children.length > 0 && !isSplitSub;

  let body = '';
  if (!STATE.cat) {
    // root: показываем все категории как крупные плитки
    body = `
      <div style="padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${STATE.data.categories.filter(c => visibleProducts().some(p => p.category === c.id)).map(c => {
          const t = tileTheme(c.id);
          const n = visibleProducts().filter(p => p.category === c.id).length;
          return `
            <div onclick="rb.openCat('${esc(c.id)}')" style="background:${t.bg}; color:${t.fg}; border-radius:var(--r-md); aspect-ratio:1.1; padding:14px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; ${t.bg==='#FAF7F2'?'border:1px solid var(--line);':''} cursor:pointer;">
              <div class="meta" style="color:${t.fg}; opacity:0.5;">${n} SKU</div>
              <div style="font-family:var(--f-display); font-weight:900; font-size:20px; line-height:0.95; letter-spacing:-0.02em; text-transform:uppercase; white-space:pre-line;">${esc(c.name)}</div>
              <div style="position:absolute; top:12px; right:14px; width:8px; height:8px; border-radius:999px; background:${t.accent};"></div>
            </div>`;
        }).join('')}
      </div>
    `;
  } else if (isSplitSub && !STATE.fasovkaSplit) {
    // 2 плашки выбора фасовки внутри подкатегории retail (Эспрессо/Фильтр/Купажи)
    const t = tileTheme(STATE.subcat);
    const tile = (size, label) => {
      const cnt = _productsForSplitSub(STATE.subcat, size).length;
      return `
        <div onclick="rb.openFasovkaSplit('${esc(size)}')"
             style="background:${t.bg}; color:${t.fg}; border-radius:var(--r-md); aspect-ratio:1.1; padding:18px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden; ${t.bg==='#FAF7F2'?'border:1px solid var(--line);':''} cursor:pointer;">
          <div class="meta" style="color:${t.fg}; opacity:0.55;">${cnt} ${cnt === 1 ? 'товар' : cnt < 5 ? 'товара' : 'товаров'}</div>
          <div style="font-family:var(--f-display); font-weight:900; font-size:42px; line-height:0.95; letter-spacing:-0.025em; text-transform:uppercase;">${esc(label)}</div>
          <div style="position:absolute; top:14px; right:14px; width:8px; height:8px; border-radius:999px; background:${t.accent};"></div>
        </div>`;
    };
    body = `
      <div style="padding:0 16px 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${tile('1 кг',  '1 КГ')}
        ${tile('200 г', '200 Г')}
      </div>
      <div class="meta" style="text-align:center; padding:0 16px 16px; color:var(--ink-faint);">Выбери фасовку — у каждой свои цены и остатки</div>
    `;
  } else if (isSplitSub && STATE.fasovkaSplit) {
    // плоский список товаров подкатегории retail с данными выбранной фасовки
    const size = STATE.fasovkaSplit;
    const list = _productsForSplitSub(STATE.subcat, size);
    body = `
      <div style="position:sticky; top:96px; z-index:5; background:color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter:blur(14px); padding:10px 0 8px; border-bottom:1px solid var(--line);">
        <div class="hrow" style="padding-bottom:2px;">
          <button onclick="rb.openFasovkaSplit('1 кг')"  class="chip${size === '1 кг'  ? ' chip--ink' : ''}" style="height:30px; cursor:pointer;">1 кг</button>
          <button onclick="rb.openFasovkaSplit('200 г')" class="chip${size === '200 г' ? ' chip--ink' : ''}" style="height:30px; cursor:pointer;">200 г</button>
          <div style="width:4px"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px 0;">
          <span class="meta">${list.length} ${list.length === 1 ? 'товар' : list.length < 5 ? 'товара' : 'товаров'} · ${esc(size)}</span>
        </div>
      </div>
      ${list.length === 0
        ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);"><div style="font-size:32px; margin-bottom:10px">🍃</div><div style="font-family:var(--f-display); font-weight:700; font-size:16px;">В фасовке «${esc(size)}» пока пусто</div></div>`
        : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:12px 16px; border:1px solid var(--line);">
          ${list.map(p => {
            const fa = _fasovkaOf(p, size) || {};
            const meta = [p.process, p.variety, p.altitude].filter(Boolean).join(' · ');
            const isLim = (p.tags || []).some(t => /лимит/i.test(t)) || (p.tags || []).includes('Микролот');
            const cardPhoto = fa.photo ? { ...p, photo: fa.photo } : p;
            return `
              <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:14px; background:var(--surface); align-items:center; cursor:pointer;">
                ${productImg(cardPhoto, '1', 'width:60px; height:60px; flex:0 0 auto; border-radius:8px;')}
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;">
                    ${flagDot(p.country)}
                    ${p.roast ? `<span class="roast${p.roast === 'F' ? ' roast--f' : ''}" style="width:16px; height:16px; font-size:9px;">${esc(p.roast)}</span>` : ''}
                    ${isLim ? `<span class="chip chip--copper" style="padding:1px 7px; font-size:10px; height:18px;">Лимит</span>` : ''}
                    ${stockBadge(p)}
                  </div>
                  <div style="font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1.15; margin-bottom:3px;">${esc(p.name)}</div>
                  <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${esc(meta || ' ')}</div>
                </div>
                <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                  <div>
                    <span style="font-family:var(--f-display); font-weight:800; font-size:16px; line-height:1;">${typeof fa.price === 'number' && !fa.on_request ? fmt(fa.price) : '—'}</span>
                    <span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof fa.price === 'number' && !fa.on_request ? '₽' : ''}</span>
                  </div>
                  <button onclick="event.stopPropagation(); rb.cartAdd('${esc(p.id)}', '${esc(fa.size || size)}')" style="width:30px; height:30px; border-radius:999px; background:var(--ink); color:var(--bg); border:0; font-size:18px; line-height:1; font-weight:300;">+</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>`
      }
    `;
  } else if (showTiles) {
    // drill: плитки подкатегорий + кнопка «Все товары» сверху
    const totalInTree = _productsInTree(cursorId).length;
    body = `
      <div style="padding:0 16px 12px;">
        <button onclick="rb.openSubcatAll()" style="display:flex; align-items:center; justify-content:space-between; width:100%; padding:14px 16px; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-md); font-family:var(--f-display); font-weight:700; font-size:14px; color:var(--ink); cursor:pointer;">
          <span>Все товары — ${totalInTree} SKU</span><span style="color:var(--ink-faint)">→</span>
        </button>
      </div>
      <div style="padding:0 16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${children.map((s, i) => _renderTile(s, i === 0 && children.length % 2 === 1)).join('')}
      </div>
    `;
  } else {
    // плоский список с фильтрами
    const rootId = cursorId;
    let list = _productsInTree(rootId);
    list = applyFilters(list);

    // Уникальные значения для фильтра
    const allInTree = _productsInTree(rootId);
    const countries = [...new Set(allInTree.map(p => p.country).filter(Boolean))].sort();
    const flavors = [...new Set(allInTree.flatMap(p => p.tasting_notes || []).map(s => String(s).toLowerCase()))].sort();
    const f = STATE.filters;
    const activeN = activeFilterCount();

    const filterChip = (label, on, action, soft = false) => `<button onclick="${action}" class="chip${on ? (soft ? ' chip--green' : ' chip--ink') : ''}" style="height:30px; cursor:pointer;">${label}</button>`;

    body = `
      <!-- Sticky filter bar -->
      <div style="position:sticky; top:96px; z-index:5; background:color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter:blur(14px); padding:10px 0; border-bottom:1px solid var(--line);">
        <div class="hrow" style="padding-bottom:2px;">
          ${filterChip(`${icon('filter', 14)} Фильтр${activeN ? ' · ' + activeN : ''}`, activeN > 0, 'rb.toggleFilterPanel()')}
          ${filterChip('200 г', f.fasovka === '200 г', `rb.toggleFasovka('200 г')`)}
          ${filterChip('1 кг',  f.fasovka === '1 кг',  `rb.toggleFasovka('1 кг')`)}
          ${countries.length ? filterChip(`Страна${f.countries.length ? ' · ' + f.countries.length : ' ↓'}`, f.countries.length > 0, `rb.toggleFilterPanel('country')`) : ''}
          ${filterChip(`${f.inStock ? '✓ ' : ''}В наличии`, f.inStock, 'rb.toggleInStock()', true)}
          ${flavors.length ? filterChip(`Вкус${f.flavors.length ? ' · ' + f.flavors.length : ' ↓'}`, f.flavors.length > 0, `rb.toggleFilterPanel('flavor')`) : ''}
          ${activeN ? filterChip('× Сбросить', false, 'rb.resetFilters()') : ''}
          <div style="width:4px"></div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 16px 0;">
          <span class="meta">${list.length} ${list.length === 1 ? 'товар' : list.length < 5 ? 'товара' : 'товаров'}${activeN ? ' · фильтров: ' + activeN : ''}</span>
        </div>
      </div>

      ${STATE.filterOpen === 'country' && countries.length ? `
        <div style="margin:12px 16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);">
          <div class="eyebrow" style="margin-bottom:10px;">Страны</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${countries.map(c => `<button onclick="rb.toggleCountry('${esc(c)}')" class="chip${f.countries.includes(c) ? ' chip--coffee' : ''}" style="cursor:pointer;">${esc(c)}</button>`).join('')}
          </div>
        </div>` : ''}

      ${STATE.filterOpen === 'flavor' && flavors.length ? `
        <div style="margin:12px 16px; padding:14px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);">
          <div class="eyebrow" style="margin-bottom:10px;">Вкус</div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${flavors.slice(0, 40).map(c => `<button onclick="rb.toggleFlavor('${esc(c)}')" class="chip${f.flavors.includes(c) ? ' chip--copper' : ''}" style="cursor:pointer;">${esc(c)}</button>`).join('')}
          </div>
        </div>` : ''}

      ${list.length === 0
        ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);"><div style="font-size:32px; margin-bottom:10px">🍃</div><div style="font-family:var(--f-display); font-weight:700; font-size:16px;">Под фильтр ничего не подошло</div>${activeN ? `<button class="btn-ghost" style="margin-top:14px;" onclick="rb.resetFilters()">Сбросить фильтры</button>` : ''}</div>`
        : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:12px 16px; border:1px solid var(--line);">
          ${list.slice(0, 80).map(p => {
            const fa = (p.fasovka || [])[0] || {};
            const meta = [p.process, p.variety, p.altitude].filter(Boolean).join(' · ');
            const isLim = (p.tags || []).some(t => /лимит/i.test(t)) || (p.tags || []).includes('Микролот');
            return `
              <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:14px; background:var(--surface); align-items:center; cursor:pointer;">
                ${productImg(p, '1', 'width:60px; height:60px; flex:0 0 auto; border-radius:8px;')}
                <div style="flex:1; min-width:0;">
                  <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap;">
                    ${flagDot(p.country)}
                    ${p.roast ? `<span class="roast${p.roast === 'F' ? ' roast--f' : ''}" style="width:16px; height:16px; font-size:9px;">${esc(p.roast)}</span>` : ''}
                    ${isLim ? `<span class="chip chip--copper" style="padding:1px 7px; font-size:10px; height:18px;">Лимит</span>` : ''}
                    ${stockBadge(p)}
                  </div>
                  <div style="font-family:var(--f-display); font-weight:700; font-size:15px; line-height:1.15; margin-bottom:3px;">${esc(p.name)}</div>
                  <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${esc(meta || ' ')}</div>
                </div>
                <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
                  <div>
                    <span style="font-family:var(--f-display); font-weight:800; font-size:16px; line-height:1;">${typeof fa.price === 'number' && !fa.on_request ? fmt(fa.price) : '—'}</span>
                    <span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof fa.price === 'number' && !fa.on_request ? '₽' : ''}</span>
                  </div>
                  <button onclick="event.stopPropagation(); rb.cartAdd('${esc(p.id)}', '${esc(fa.size || '')}')" style="width:30px; height:30px; border-radius:999px; background:var(--ink); color:var(--bg); border:0; font-size:18px; line-height:1; font-weight:300;">+</button>
                </div>
              </div>
            `;
          }).join('')}
        </div>`
      }
    `;
  }

  return `
${appHeader({ back: true, title: 'Каталог', action: `<button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.go('search')">${icon('search')}</button>` })}

<div style="padding:8px 16px 0; display:flex; align-items:center; gap:4px; flex-wrap:wrap;">
  <span class="meta" style="cursor:pointer;" onclick="rb.openCat(null)">Каталог</span>
  ${bread.map((b, i) => `
    <span class="meta" style="opacity:0.4">›</span>
    <span class="meta" style="${i === bread.length - 1 ? 'color:var(--ink);' : 'cursor:pointer;'}" ${i === bread.length - 1 ? '' : `onclick="${b.action}"`}>${esc(b.name)}</span>
  `).join('')}
</div>

<div style="padding:4px 16px 16px; display:flex; align-items:baseline; justify-content:space-between;">

<div style="padding:20px 16px 0;">

      <div style="flex:1;">

      <span style="color:var(--ink-faint);">→</span>

</div>` : ''}

<div style="padding:24px 16px 0; text-align:center;">
  <div class="meta">Roastberry · v2 · сборка ${STATE.data?.version || 'dev'}</div>

/* ════════════════════════════════════════════════════════════════════
   SCREEN: SEARCH — автокомплит по name + country + variety + tasting
   ════════════════════════════════════════════════════════════════════ */
function hl(text, q) {
  if (!q) return esc(text);
  const t = String(text || '');
  const lc = t.toLowerCase(), qc = q.toLowerCase();
  const idx = lc.indexOf(qc);
  if (idx === -1) return esc(t);
  return esc(t.slice(0, idx))
    + `<span style="background:var(--copper-soft); color:var(--ink); font-weight:700; border-radius:3px; padding:0 2px;">${esc(t.slice(idx, idx + q.length))}</span>`
    + esc(t.slice(idx + q.length));
}
function screenSearch() {
  const q = (STATE.searchQuery || '').trim();
  const all = visibleProducts();
  const results = q ? all.filter(p => {
    const hay = [p.name, p.country, p.variety, p.process, p.farm,
                 ...(p.tasting_notes || [])].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  }) : [];
  // популярные запросы — pre-defined
  const suggestions = ['эфиопия', 'эспрессо', 'фильтр', 'бразилия', 'микролот', 'дрипы', 'каскара', 'niktea'];

  return `
<div style="position:sticky; top:0; z-index:10; background:var(--bg); padding:54px 16px 12px; border-bottom:1px solid var(--line);">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
    <button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.back()">${icon('back')}</button>
    <h1 style="font-size:22px; flex:1;">Поиск</h1>
  </div>
  <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:2px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 16px; height:48px;">
    <span style="color:${q ? 'var(--ink)' : 'var(--ink-faint)'};">${icon('search')}</span>
    <input id="rb-search-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
      placeholder="Поиск по ${all.length} SKU"
      value="${esc(q)}"
      oninput="rb.searchInput(this.value)"
      style="flex:1; border:0; outline:0; background:transparent; font-size:15px; font-family:var(--f-body); color:var(--ink); font-weight:500; min-width:0;" />
    ${q ? `<button onclick="rb.searchInput('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:18px; padding:4px 6px; cursor:pointer;">×</button>` : ''}
  </div>
</div>

${!q ? `
  <div style="padding:20px 16px 0;">
    <div class="eyebrow" style="margin-bottom:12px;">Часто ищут</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      ${suggestions.map(s => `<button class="chip" onclick="rb.searchInput('${esc(s)}')" style="height:34px; padding:0 14px; font-size:13px; cursor:pointer;">${esc(s)}</button>`).join('')}
    </div>
  </div>
` : results.length === 0 ? `
  <div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">
    <div style="font-size:32px; margin-bottom:10px;">🔍</div>
    <div style="font-family:var(--f-display); font-weight:700; font-size:16px;">Ничего не нашли</div>
    <div style="font-size:13px; margin-top:6px;">Попробуй короче или другое слово.</div>
  </div>
` : `
  <div style="padding:14px 16px 8px;">
    <span class="meta">Найдено: ${results.length}</span>
  </div>
  <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:0 16px; border:1px solid var(--line);">
    ${results.slice(0, 50).map(p => {
      const f = (p.fasovka || [])[0] || {};
      const meta = [p.country, p.process, p.variety].filter(Boolean).join(' · ');
      return `
        <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:12px 14px; background:var(--surface); align-items:center; cursor:pointer;">
          ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
          <div style="flex:1; min-width:0;">
            <div style="font-family:var(--f-display); font-weight:700; font-size:14px; line-height:1.2; margin-bottom:2px;">${hl(p.name, q)}</div>
            <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${hl(meta, q)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--f-display); font-weight:800; font-size:14px;">${typeof f.price === 'number' && !f.on_request ? fmt(f.price) : '—'}<span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof f.price === 'number' && !f.on_request ? '₽' : ''}</span></div>
            <div style="margin-top:2px;" class="meta">${esc(f.size || '')}</div>
          </div>
        </div>
      `;
    }).join('')}
  </div>
`}

<div style="height:120px"></div>
${tabBar('search')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN: Список товаров с inline-stock-editor + фильтрами
   ════════════════════════════════════════════════════════════════════ */
function screenAdminProducts() {
  const f = STATE.adminProductsFilter || 'all';
  const q = (STATE.adminProductsQuery || '').trim().toLowerCase();
  const all = STATE.data?.products || [];

  let list = all;
  if (f === 'quarantine') list = list.filter(p => p.quarantined);
  else if (f === 'zero')  list = list.filter(p => typeof p.stock === 'number' && p.stock <= 0 && !p.on_request);
  else if (f === 'low')   list = list.filter(p => typeof p.stock === 'number' && p.stock > 0 && p.stock < 5);
  else if (f === 'no_photo') list = list.filter(p => !p.photo || (typeof p.photo === 'string' && p.photo.indexOf('placeholders/') !== -1));
  if (q) {
    list = list.filter(p => {
      const hay = (p.name + ' ' + (p.country||'') + ' ' + (p.id||'')).toLowerCase();
      return hay.includes(q);
    });
  }

  const cntAll  = all.length;
  const cntQ    = all.filter(p => p.quarantined).length;
  const cntZero = all.filter(p => typeof p.stock === 'number' && p.stock <= 0 && !p.on_request).length;
  const cntLow  = all.filter(p => typeof p.stock === 'number' && p.stock > 0 && p.stock < 5).length;
  const cntNoP  = all.filter(p => !p.photo || (typeof p.photo === 'string' && p.photo.indexOf('placeholders/') !== -1)).length;

  const chip = (id, label, count) => `<button onclick="rb.adminProductsFilter('${id}')" class="chip${f === id ? ' chip--ink' : ''}" style="height:28px; cursor:pointer; font-size:11px;">${label} · ${count}</button>`;

  return `
    <div style="padding:0 16px 8px;">
      <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 14px; height:40px; margin-bottom:10px;">
        <span style="color:var(--ink-soft);">${icon('search', 14)}</span>
        <input type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
          placeholder="Поиск по имени / id / стране"
          value="${esc(q)}"
          oninput="rb.adminProductsSearch(this.value)"
          style="flex:1; border:0; outline:0; background:transparent; font-size:13px; font-family:var(--f-body); color:var(--ink); min-width:0;" />
        ${q ? `<button onclick="rb.adminProductsSearch('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:16px; padding:2px 4px; cursor:pointer;">×</button>` : ''}
      </div>
      <div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;">
        ${chip('all', 'Все', cntAll)}
        ${chip('quarantine', '⛔ Карантин', cntQ)}
        ${chip('zero', '0 на складе', cntZero)}
        ${chip('low', '< 5', cntLow)}
        ${chip('no_photo', 'Без фото', cntNoP)}
      </div>
    </div>

    ${list.length === 0
      ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Ничего не найдено</div>`
      : `<div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:8px 16px 16px; border:1px solid var(--line);">
        ${list.slice(0, 200).map(p => {
          const s = typeof p.stock === 'number' ? p.stock : null;
          const isQ = !!p.quarantined;
          const stockColor = isQ ? 'var(--ink-faint)'
                            : s === null ? 'var(--ink-faint)'
                            : s <= 0 ? 'var(--danger)'
                            : s < 5 ? '#C97E3C'
                            : 'var(--ink)';
          return `
            <div style="background:var(--surface); display:flex; gap:10px; padding:10px 12px; align-items:center;${isQ ? ' opacity:0.62;' : ''}">
              ${productImg(p, '1', 'width:42px; height:42px; flex:0 0 auto; border-radius:6px;')}
              <div style="flex:1; min-width:0; overflow:hidden;">
                <div style="font-family:var(--f-display); font-weight:700; font-size:13px; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(p.name)}</div>
                <div class="meta" style="font-size:9px; color:var(--ink-faint); margin-top:2px;">${esc(p.category || '')}${p.country ? ' · ' + esc(p.country) : ''}${isQ ? ' · <span style="color:var(--danger)">в карантине</span>' : ''}</div>
              </div>
              <div style="display:flex; align-items:center; gap:4px; flex:0 0 auto;">
                <button onclick="rb.adminAdjustStock('${esc(p.id)}', -1)" style="width:26px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:14px; cursor:pointer; padding:0;">−</button>
                <button onclick="rb.adminSetStock('${esc(p.id)}')" style="min-width:38px; padding:0 6px; height:26px; border-radius:8px; background:transparent; border:1px solid var(--line); color:${stockColor}; font-family:var(--f-mono); font-weight:700; font-size:12px; cursor:pointer;">${s === null ? '—' : s}</button>
                <button onclick="rb.adminAdjustStock('${esc(p.id)}', 1)" style="width:26px; height:26px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:14px; cursor:pointer; padding:0;">+</button>
                <button onclick="rb.adminToggleQuarantine('${esc(p.id)}')" title="${isQ ? 'Вернуть в каталог' : 'В карантин'}" style="width:28px; height:28px; border-radius:999px; background:${isQ ? 'var(--green)' : 'transparent'}; border:1px solid ${isQ ? 'var(--green)' : 'var(--line-strong)'}; color:${isQ ? '#fff' : 'var(--ink-soft)'}; font-size:13px; cursor:pointer; padding:0; margin-left:2px;">${isQ ? '✓' : '⛔'}</button>
              </div>
            </div>`;
        }).join('')}
      </div>
      ${list.length > 200 ? `<div class="meta" style="text-align:center; padding-bottom:16px;">Показаны первые 200 из ${list.length} — сузь фильтром</div>` : ''}`}
  `;
}

/* ════════════════════════════════════════════════════════════════════
   SCREEN: ADMIN (товары · карантин · pending · заказы)
   ════════════════════════════════════════════════════════════════════ */
function screenAdmin() {
  const tab = STATE.adminTab || 'products';
  const data = STATE.adminPayload;
  const tabs = [
    { id: 'products',   label: 'Товары' },
    { id: 'quarantine', label: 'Карантин' },
    { id: 'pending',    label: 'Pending' },
    { id: 'orders',     label: 'Заказы' },
  ];

  let body = '';
  if (tab === 'products') {
    body = screenAdminProducts();
  } else if (!data) {
    body = `<div style="padding:60px 0; text-align:center;"><div class="rb-spinner"></div></div>`;
  } else if (data.error) {
    body = `<div style="padding:40px 24px; color:var(--danger); text-align:center; font-size:14px;">${esc(data.error)}</div>`;
  } else if (tab === 'quarantine') {
    const items = data.items || data.products || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">В карантине: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(p => `
            <div style="background:var(--surface); display:flex; gap:12px; padding:12px; align-items:center;">
              ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
              <div style="flex:1; min-width:0;">
                <div style="font-family:var(--f-display); font-weight:700; font-size:13px;">${esc(p.name)}</div>
                <div class="meta" style="font-size:9px; margin-top:2px;">${esc(p.quarantine_reason || p.reason || '—')}</div>
              </div>
              <button onclick="rb.adminQuarantineRelease('${esc(p.id)}')" style="height:30px; padding:0 12px; border-radius:999px; background:var(--green); color:#fff; border:0; font-size:11px; font-weight:600;">Вернуть</button>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Карантин пустой 🟢</div>`;
  } else if (tab === 'pending') {
    const items = data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Требуют разбора: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(it => `
            <div style="background:var(--surface); padding:12px;">
              <div style="font-size:13px; font-weight:500;">${esc(it.name)}</div>
              <div class="meta" style="font-size:9px; margin-top:4px;">qty: ${it.qty || 0}${it.notes ? ' · ' + esc(it.notes) : ''}</div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Pending пустой 🟢</div>`;
  } else if (tab === 'orders') {
    const items = data.orders || data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Заказов: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${items.slice(0, 50).map(o => `
            <div class="card" style="padding:12px;">
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-family:var(--f-mono); font-size:12px; font-weight:700;">#${esc(o.id)}</span>
                <span class="meta">${esc(o.status || '')}</span>
              </div>
              <div style="margin-top:4px; font-size:13px;">${esc(o.client_name || o.name || '—')}</div>
              <div class="meta" style="font-size:9.5px; margin-top:2px;">${esc(o.created_at || '')} · ${fmt(o.total || 0)} ₽</div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Заказов нет</div>`;
  }

  return `
${appHeader({ back: true, title: 'Админ' })}
<div style="padding:16px 16px 12px;">
  <div style="display:flex; gap:6px; padding:3px; background:var(--surface-2); border-radius:999px;">
    ${tabs.map(t => `
      <button onclick="rb.setAdminTab('${t.id}')" style="flex:1; height:34px; border:0; border-radius:999px; background:${tab === t.id ? 'var(--ink)' : 'transparent'}; color:${tab === t.id ? 'var(--bg)' : 'var(--ink-soft)'}; font-family:var(--f-body); font-weight:600; font-size:12px; cursor:pointer;">${t.label}</button>
    `).join('')}
  </div>
</div>
${body}
<div style="height:60px"></div>
${tabBar('profile')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   ACTIONS / NAVIGATION
   ════════════════════════════════════════════════════════════════════ */

    screen: STATE.screen,
    cat: STATE.cat,
    subcat: STATE.subcat,
    showAll: STATE.showAll,
    fasovkaSplit: STATE.fasovkaSplit,
    productId: STATE.productId,
  };
}
function _isSameNav(a, b) {
  return a && b && a.screen === b.screen && a.cat === b.cat && a.subcat === b.subcat
      && a.showAll === b.showAll && a.fasovkaSplit === b.fasovkaSplit && a.productId === b.productId;
}

const rb = {
  go(screen, params) {
    const snap = _navSnapshot();
    if (STATE.screen === 'catalog' && !params && screen === 'catalog') return;
    STATE.screen = screen;
    if (screen === 'catalog' && !params) {
      STATE.cat = null; STATE.subcat = null; STATE.showAll = false;
      resetFilters();
    }
    if (params) {
      if ('cat' in params) STATE.cat = params.cat || null;
      if ('subcat' in params) STATE.subcat = params.subcat || null;
    }
    if (!_isSameNav(snap, _navSnapshot())) STATE.history.push(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
    if (screen === 'profile' && STATE.myOrders === undefined) rb.loadMyOrders();
  },
  back() {
    const prev = STATE.history.pop();
    if (prev) {
      STATE.screen = prev.screen;
      STATE.cat = prev.cat;
      STATE.subcat = prev.subcat;
      STATE.showAll = prev.showAll;
      STATE.productId = prev.productId;
      haptic();
      window.scrollTo(0, 0);
      render();
    } else {
      rb.go('home');
    }
  },
  openProduct(id) {
    const snap = _navSnapshot();
    STATE.screen = 'product';
    STATE.productId = id;
    STATE.productFasovka = STATE.fasovkaSplit || null;
    STATE.productKg = 1;
    STATE.history.push(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  async sendKP() {
    const btn = document.getElementById('rb-kp-btn');
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = 'Отправляю…'; btn.disabled = true; }
    try {
      const r = await fetch('/tma/api/send_kp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
      });
      const j = await r.json().catch(() => ({}));
      if (j.ok) {
        toast('КП отправлено в личку ✓', 'success');
        if (btn) btn.innerHTML = 'Отправлено ✓';
      } else {
        toast('Ошибка: ' + (j.error || 'попробуйте ещё раз'), 'error');
        if (btn) { btn.innerHTML = orig; btn.disabled = false; }
      }
    } catch (e) {
      toast('Ошибка отправки', 'error');
      if (btn) { btn.innerHTML = orig; btn.disabled = false; }
    }
  },
  setFasovka(size) {
    STATE.productFasovka = size;
    haptic('light');
    render();
  },
  setKg(n) {
    STATE.productKg = Math.max(1, Math.min(999, n));
    haptic('light');
    render();
  },
  cartAdd(id, fasovka, qty) {
    const p = findProduct(id);
    if (!p) return;
    if (!fasovka) {
      const f = (p.fasovka || [])[0];
      fasovka = f?.size || 'уп.';
    }
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (ex) ex.qty += (qty || 1);
    else STATE.cart.push({ id, fasovka, qty: qty || 1 });
    saveLocal();
    haptic('light');
    toast(`+ ${p.name}`);
    render();
  },
  cartChange(id, fasovka, delta) {
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (!ex) return;
    ex.qty += delta;
    if (ex.qty <= 0) STATE.cart = STATE.cart.filter(x => !(x.id === id && x.fasovka === fasovka));
    saveLocal();
    haptic('light');
    render();
  },
  cartClear() {
    if (!confirm('Очистить корзину?')) return;
    STATE.cart = [];
    saveLocal();
    haptic('warning');
    render();
  },
  openCat(catId) {
    const snap = _navSnapshot();
    STATE.screen = 'catalog';
    STATE.cat = catId || null;
    STATE.subcat = null;
    STATE.showAll = false;
    STATE.fasovkaSplit = null;
    resetFilters();
    if (!_isSameNav(snap, _navSnapshot())) STATE.history.push(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  openSubcat(subId) {
    const snap = _navSnapshot();
    STATE.screen = 'catalog';
    if (!STATE.cat) {
      let cur = STATE.data.subcategories.find(s => s.id === subId);
      let cat = null;
      while (cur) {
        if (STATE.data.categories.find(c => c.id === cur.parent)) { cat = cur.parent; break; }
        cur = STATE.data.subcategories.find(s => s.id === cur.parent);
      }
      STATE.cat = cat;
    }
    STATE.subcat = subId;
    STATE.showAll = false;
    STATE.fasovkaSplit = null;
    resetFilters();
    if (!_isSameNav(snap, _navSnapshot())) STATE.history.push(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  openFasovkaSplit(size) {
    const snap = _navSnapshot();
    STATE.fasovkaSplit = size;
    STATE.subcat = null;
    STATE.showAll = false;
    resetFilters();
    if (!_isSameNav(snap, _navSnapshot())) STATE.history.push(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  openSubcatAll() {
    // принудительно показываем плоский список под текущим cursor
    STATE.showAll = true;
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  toggleFasovka(s) {
    STATE.filters.fasovka = STATE.filters.fasovka === s ? null : s;
    haptic('light'); render();
  },
  toggleInStock() {
    STATE.filters.inStock = !STATE.filters.inStock;
    haptic('light'); render();
  },
  toggleCountry(c) {
    const a = STATE.filters.countries;
    const i = a.indexOf(c);
    if (i >= 0) a.splice(i, 1); else a.push(c);
    haptic('light'); render();
  },
  toggleFlavor(c) {
    const a = STATE.filters.flavors;
    const i = a.indexOf(c);
    if (i >= 0) a.splice(i, 1); else a.push(c);
    haptic('light'); render();
  },
  toggleFilterPanel(kind) {
    STATE.filterOpen = STATE.filterOpen === kind ? false : (kind || (STATE.filterOpen ? false : 'country'));
    haptic('light'); render();
  },
  resetFilters() {
    resetFilters();
    haptic('warning'); render();
  },
  searchInput(v) {
    STATE.searchQuery = v || '';
    if (STATE.screen !== 'search') STATE.screen = 'search';
    render();
    const inp = document.getElementById('rb-search-input');
    if (inp) {
      inp.focus();
      const pos = inp.value.length;
      try { inp.setSelectionRange(pos, pos); } catch (e) {}
    }
  },
  async checkout() {
    haptic('success');
    const items = STATE.cart.map(i => {
      const p = findProduct(i.id); if (!p) return null;
      const f = (p.fasovka || []).find(x => x.size === i.fasovka) || (p.fasovka || [])[0] || {};
      return { id: i.id, name: p.name, fasovka: i.fasovka, qty: i.qty,
               price: typeof f.price === 'number' ? f.price : null,
               on_request: !!f.on_request };
    }).filter(Boolean);
    if (!items.length) { toast('Корзина пустая'); return; }
    const totalKg = cartWeightKg();
    const subtotal = cartSubtotal();
    const tier = tierFor(totalKg);
    const total = subtotal * (1 - tier);
    const payload = { items, total_kg: totalKg, subtotal, discount_pct: tier, total };

    try {
      const r = await fetch('/tma/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(payload),
      });
      if (r.ok) {
        const j = await r.json();
        STATE.cart = []; saveLocal();
        haptic('success');
        toast('Заказ оформлен. №' + (j.order_id || ''));
        setTimeout(() => rb.go('profile'), 1200);
      } else {
        haptic('error');
        toast('Ошибка: ' + r.status);
      }
    } catch (e) {
      haptic('error');
      toast('Сеть недоступна');
    }
  },
  /* ────────── ADMIN ────────── */
  async loadMyOrders() {
    if (!IS_TG) { STATE.myOrders = []; return; }
    try {
      const r = await fetch('/tma/api/my_orders?limit=10', { headers: authHeaders() });
      if (!r.ok) { STATE.myOrders = []; return; }
      const j = await r.json();
      STATE.myOrders = Array.isArray(j) ? j : (j.orders || j.items || []);
    } catch (e) { STATE.myOrders = []; }
    render();
  },
  async openAdmin() {
    if (!STATE.isAdmin) { toast('Только для админов'); return; }
    const snap = _navSnapshot();
    STATE.screen = 'admin';
    STATE.adminTab = STATE.adminTab || 'products';
    STATE.adminPayload = null;
    STATE.history.push(snap);
    render();
    if (STATE.adminTab !== 'products') await rb.loadAdmin();
  },
  setAdminTab(tab) {
    STATE.adminTab = tab;
    STATE.adminPayload = null;
    render();
    if (tab !== 'products') rb.loadAdmin();
  },
  async loadAdmin() {
    const tab = STATE.adminTab;
    if (tab === 'products') { render(); return; }
    try {
      let url = '/tma/api/admin/' + (tab === 'pending' ? 'pending' : tab === 'orders' ? 'orders' : 'quarantine');
      const r = await fetch(url, { headers: authHeaders() });
      STATE.adminPayload = r.ok ? await r.json() : { error: 'HTTP ' + r.status };
    } catch (e) {
      STATE.adminPayload = { error: String(e) };
    }
    render();
  },
  async adminQuarantineRelease(id) {
    if (!confirm('Вернуть из карантина: ' + id + '?')) return;
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ quarantined: false }),
      });
      if (r.ok) { haptic('success'); toast('Возвращён'); rb.loadAdmin(); }
      else { haptic('error'); toast('Ошибка: ' + r.status); }
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },
  adminProductsFilter(id) { STATE.adminProductsFilter = id; render(); },
  adminProductsSearch(q)  { STATE.adminProductsQuery = q; render(); },
  async _adminPatchProduct(id, patch, optMsg) {
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(patch),
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return false; }
      const p = (STATE.data?.products || []).find(x => x.id === id);
      if (p) Object.assign(p, patch);
      haptic('success');
      if (optMsg) toast(optMsg, 'success');
      render();
      return true;
    } catch (e) { haptic('error'); toast('Сеть недоступна'); return false; }
  },
  async adminAdjustStock(id, delta) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const cur = typeof p.stock === 'number' ? p.stock : 0;
    const next = Math.max(0, cur + delta);
    if (next === cur) return;
    await rb._adminPatchProduct(id, { stock: next });
  },
  async adminSetStock(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const cur = typeof p.stock === 'number' ? p.stock : 0;
    const raw = prompt('Остаток для «' + p.name + '»:', String(cur));
    if (raw === null) return;
    const n = parseInt(raw, 10);
    if (!Number.isFinite(n) || n < 0) { toast('Нужно неотрицательное число'); return; }
    await rb._adminPatchProduct(id, { stock: n }, 'Сохранено');
  },
  async adminToggleQuarantine(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const next = !p.quarantined;
    if (next && !confirm('Скрыть «' + p.name + '» в карантин?')) return;
    await rb._adminPatchProduct(id, { quarantined: next }, next ? 'В карантине' : 'Возвращён');
  },
};
window.rb = rb;

/* ════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════ */
function rbHeroSync(el) {
  if (!el) return;
  const idx = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  const dots = document.querySelectorAll('#rb-hero-dots span');
  dots.forEach((d, i) => {
    if (i === idx) { d.style.width = '24px'; d.style.opacity = '1'; }
    else           { d.style.width = '8px';  d.style.opacity = '0.22'; }
  });
}

function render() {
  const root = document.getElementById('root');
  let body = '';
  switch (STATE.screen) {
    case 'home':    body = screenHome(); break;
    case 'catalog': body = screenCatalog(); break;
    case 'product': body = screenProduct(); break;
    case 'cart':    body = screenCart(); break;
    case 'profile': body = screenProfile(); break;
    case 'search':  body = screenSearch(); break;
    case 'admin':   body = screenAdmin(); break;
    default: body = screenHome();
  }
  root.innerHTML = `<div class="rb${IS_DARK ? ' rb--dark' : ''}">${body}</div>`;
  syncTgBackButton();
}

function syncTgBackButton() {
  if (!tg || !tg.BackButton) return;
  const canGoBack = STATE.history.length > 0 || STATE.screen !== 'home';
  try {
    if (canGoBack) tg.BackButton.show();
    else tg.BackButton.hide();
  } catch (e) {}
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN CHECK
   ════════════════════════════════════════════════════════════════════ */
async function checkAdmin() {
  if (!IS_TG) return;
  try {
    const r = await fetch('/tma/api/admin/check', { headers: authHeaders() });
    const j = await r.json();
    STATE.isAdmin = !!j.is_admin;
  } catch (e) { STATE.isAdmin = false; }
}

/* ════════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════════ */
async function init() {
  loadLocal();
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    if (tg.BackButton) {
      try { tg.BackButton.onClick(() => rb.back()); } catch(e){}
    }
    try { tg.onEvent('backButtonClicked', () => rb.back()); } catch(e){}
  }
  try {
    const r = await fetch('/tma/products.json?v=' + Date.now(), { cache: 'no-store' });
    STATE.data = await r.json();
  } catch (e) {
    document.getElementById('root').innerHTML = `<div style="padding:80px 24px; text-align:center;"><h2>Каталог недоступен</h2><p style="color:var(--ink-soft); margin-top:8px;">${esc(String(e))}</p></div>`;
    return;
  }
  await checkAdmin();
  render();
  if ('serviceWorker' in navigator && !(tg && tg.initData)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
</script>
