                <button onclick="rb.adminEditCard('${esc(p.id)}')" title="Редактор карточки" style="width:28px; height:28px; border-radius:999px; background:transparent; border:1px solid var(--line-strong); color:var(--ink); font-size:12px; cursor:pointer; padding:0; margin-left:4px;">✏️</button>
                <button onclick="rb.adminToggleQuarantine('${esc(p.id)}')" title="${isQ ? 'Вернуть в каталог' : 'В карантин'}" style="width:28px; height:28px; border-radius:999px; background:${isQ ? 'var(--green)' : 'transparent'}; border:1px solid ${isQ ? 'var(--green)' : 'var(--line-strong)'}; color:${isQ ? '#fff' : 'var(--ink-soft)'}; font-size:13px; cursor:pointer; padding:0; margin-left:2px;">${isQ ? '✓' : '⛔'}</button>
              </div>
            </div>`;
        }).join('')}
      </div>
      ${list.length > 200 ? `<div class="meta" style="text-align:center; padding-bottom:16px;">Показаны первые 200 из ${list.length} — сузь фильтром</div>` : ''}`}
  `;
}

/* ════════════════════════════════════════════════════════════════════
   SCREEN: ADMIN (товары · карантин · pending · заказы)
   ════════════════════════════════════════════════════════════════════ */
function screenAdmin() {
  const tab = STATE.adminTab || 'products';
  const data = STATE.adminPayload;
  const tabs = [
    { id: 'products',   label: 'Товары' },
    { id: 'orders',     label: 'Заказы' },
    { id: 'users',      label: 'Клиенты' },
    { id: 'quarantine', label: 'Карантин' },
    { id: 'pending',    label: 'Pending' },
  ];

  let body = '';
  if (tab === 'products') {
    body = screenAdminProducts();
  } else if (!data) {
    body = `<div style="padding:60px 0; text-align:center;"><div class="rb-spinner"></div></div>`;
  } else if (data.error) {
    body = `<div style="padding:40px 24px; color:var(--danger); text-align:center; font-size:14px;">${esc(data.error)}</div>`;
  } else if (tab === 'quarantine') {
    const items = data.items || data.products || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">В карантине: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(p => `
            <div style="background:var(--surface); display:flex; gap:12px; padding:12px; align-items:center;">
              ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
              <div style="flex:1; min-width:0;">
                <div style="font-family:var(--f-display); font-weight:700; font-size:13px;">${esc(p.name)}</div>
                <div class="meta" style="font-size:9px; margin-top:2px;">${esc(p.quarantine_reason || p.reason || '—')}</div>
              </div>
              <button onclick="rb.adminQuarantineRelease('${esc(p.id)}')" style="height:30px; padding:0 12px; border-radius:999px; background:var(--green); color:#fff; border:0; font-size:11px; font-weight:600;">Вернуть</button>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Карантин пустой 🟢</div>`;
  } else if (tab === 'pending') {
    const items = data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Требуют разбора: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(it => `
            <div style="background:var(--surface); padding:12px;">
              <div style="font-size:13px; font-weight:500;">${esc(it.name)}</div>
              <div class="meta" style="font-size:9px; margin-top:4px;">qty: ${it.qty || 0}${it.notes ? ' · ' + esc(it.notes) : ''}</div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Pending пустой 🟢</div>`;
  } else if (tab === 'users') {
    const items = data.users || data.items || [];
    const q = (STATE.adminUsersQuery || '').trim().toLowerCase();
    const filtered = q
      ? items.filter(u => {
          const hay = ((u.name || '') + ' ' + (u.phone || '') + ' ' + (u.tg_name || '') + ' ' + (u.user_id || '')).toLowerCase();
          return hay.includes(q);
        })
      : items;
    const tierBadge = (t) => {
      const map = { discount_10: '−10%', discount_20: '−20%', stm: 'СТМ' };
      const label = map[t];
      if (!label) return '';
      return `<span class="chip chip--copper" style="height:18px; font-size:9.5px; padding:0 6px; margin-left:4px;">${esc(label)}</span>`;
    };
    body = `
      <div style="padding:0 16px 8px;">
        <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:1.5px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 14px; height:40px; margin-bottom:10px;">
          <span style="color:var(--ink-soft);">${icon('search', 14)}</span>
          <input type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
            placeholder="Поиск по имени / телефону / id"
            value="${esc(q)}"
            oninput="rb.adminUsersSearch(this.value)"
            style="flex:1; border:0; outline:0; background:transparent; font-size:13px; font-family:var(--f-body); color:var(--ink); min-width:0;" />
          ${q ? `<button onclick="rb.adminUsersSearch('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:16px; padding:2px 4px; cursor:pointer;">×</button>` : ''}
        </div>
      </div>
      ${filtered.length === 0
        ? `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Клиентов не найдено</div>`
        : `<div style="padding:0 16px 24px;">
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${filtered.slice(0, 200).map(u => {
              const tg = u.tg_name ? '@' + esc(u.tg_name) : (u.user_id < 0 ? 'гость' : 'tg ' + u.user_id);
              const orderCount = u.order_count || 0;
              const totalSpent = u.total_spent || 0;
              return `
                <div onclick="rb.openAdminUser(${u.user_id})" class="card" style="padding:12px; cursor:pointer;">
                  <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px;">
                    <span style="font-family:var(--f-display); font-weight:700; font-size:14px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(u.name || '—')}${tierBadge(u.price_tier)}</span>
                    <span class="meta" style="font-size:10px;">${tg}</span>
                  </div>
                  ${u.phone ? `<div class="meta" style="margin-top:3px;">${esc(u.phone)}</div>` : ''}
                  <div style="display:flex; gap:12px; margin-top:6px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap;">
                    <span>📦 ${orderCount} ${orderCount === 1 ? 'заказ' : (orderCount < 5 ? 'заказа' : 'заказов')}</span>
                    ${totalSpent ? `<span>💰 <b>${fmt(totalSpent)} ₽</b></span>` : ''}
                    ${u.last_order_at ? `<span style="margin-left:auto; color:var(--ink-faint);">${esc((u.last_order_at || '').slice(0, 10))}</span>` : ''}
                  </div>
                </div>`;
            }).join('')}
          </div>
          ${filtered.length > 200 ? `<div class="meta" style="text-align:center; margin-top:12px;">Показаны первые 200 из ${filtered.length}</div>` : ''}
        </div>`}`;
  } else if (tab === 'orders') {
    const items = data.orders || data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Заказов: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${items.slice(0, 100).map(o => `
            <div onclick="rb.openAdminOrder('${esc(o.id)}')" class="card" style="padding:12px; cursor:pointer;">
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-family:var(--f-mono); font-size:12px; font-weight:700;">#${esc(o.id)}</span>
                <span class="chip${(o.status||'').toLowerCase().includes('cancel') ? '' : ' chip--coffee'}" style="height:18px; font-size:10px; padding:0 6px;">${esc(o.status || 'new')}</span>
              </div>
              <div style="margin-top:4px; font-size:13px; font-weight:500;">${esc(o.client_name || o.name || '—')}</div>
              <div class="meta" style="font-size:9.5px; margin-top:2px;">${esc(o.created_at || '')} · <b>${fmt(o.total || 0)} ₽</b></div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Заказов нет</div>`;
  }

  return `
${appHeader({ back: true, title: 'Админ' })}
<div style="padding:16px 16px 12px;">
  <div style="display:flex; gap:6px; padding:3px; background:var(--surface-2); border-radius:999px;">
    ${tabs.map(t => `
      <button onclick="rb.setAdminTab('${t.id}')" style="flex:1; height:34px; border:0; border-radius:999px; background:${tab === t.id ? 'var(--ink)' : 'transparent'}; color:${tab === t.id ? 'var(--bg)' : 'var(--ink-soft)'}; font-family:var(--f-body); font-weight:600; font-size:12px; cursor:pointer;">${t.label}</button>
    `).join('')}
  </div>
</div>
${body}
<div style="height:60px"></div>
${tabBar('profile')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   ACTIONS / NAVIGATION
   ════════════════════════════════════════════════════════════════════ */
function _navSnapshot() {
  return {
    screen: STATE.screen,
    cat: STATE.cat,
    subcat: STATE.subcat,
    showAll: STATE.showAll,
    fasovkaSplit: STATE.fasovkaSplit,
    productId: STATE.productId,
    productFasovka: STATE.productFasovka,
  };
}
function _isSameNav(a, b) {
  return a && b && a.screen === b.screen && a.cat === b.cat && a.subcat === b.subcat
      && a.showAll === b.showAll && a.fasovkaSplit === b.fasovkaSplit && a.productId === b.productId
      && a.productFasovka === b.productFasovka;
}
function _applyNavSnapshot(snap) {
  const s = snap || { screen: 'home' };
  STATE.screen = s.screen || 'home';
  STATE.cat = s.cat || null;
  STATE.subcat = s.subcat || null;
  STATE.showAll = !!s.showAll;
  STATE.fasovkaSplit = s.fasovkaSplit || null;
  STATE.productId = s.productId || null;
  STATE.productFasovka = s.productFasovka || null;
  if (STATE.screen !== 'product') STATE.productKg = 1;
}
function _cloneNavStack(stack = STATE.history) {
  return (stack || []).map(s => Object.assign({}, s));
}

const RB_BROWSER_HISTORY_KEY = 'rbShopV2';
let RB_BROWSER_HISTORY_READY = false;
let RB_APPLYING_BROWSER_HISTORY = false;
let RB_BACK_FALLBACK_TIMER = null;
let RB_LAST_POPSTATE_AT = 0;

function _browserNavState() {
  return {
    [RB_BROWSER_HISTORY_KEY]: true,
    nav: _navSnapshot(),
    stack: _cloneNavStack(),
  };
}
function _writeBrowserNav(mode = 'push') {
  if (RB_APPLYING_BROWSER_HISTORY || !window.history || !window.history.pushState) return;
  try {
    const method = (!RB_BROWSER_HISTORY_READY || mode === 'replace') ? 'replaceState' : 'pushState';
    window.history[method](_browserNavState(), '', window.location.href);
    RB_BROWSER_HISTORY_READY = true;
  } catch (e) {}
}
function _rememberNav(snap) {
  if (_isSameNav(snap, _navSnapshot())) return;
  STATE.history.push(snap);
  _writeBrowserNav('push');
}
function _afterNavRender() {
  haptic();
  window.scrollTo(0, 0);
  render();
  if (STATE.screen === 'profile' && STATE.myOrders === undefined) rb.loadMyOrders();
}
function _backInternal(syncBrowser = true) {
  const prev = STATE.history.pop();
  if (prev) {
    _applyNavSnapshot(prev);
  } else if (STATE.screen !== 'home') {
    _applyNavSnapshot({ screen: 'home' });
  } else {
    return;
  }
  if (syncBrowser) _writeBrowserNav('replace');
  _afterNavRender();
}

const rb = {
  go(screen, params) {
    const snap = _navSnapshot();
    if (STATE.screen === 'catalog' && !params && screen === 'catalog') return;
    STATE.screen = screen;
    if (screen === 'catalog' && !params) {
      STATE.cat = null; STATE.subcat = null; STATE.showAll = false;
      resetFilters();
    }
    if (params) {
      if ('cat' in params) STATE.cat = params.cat || null;
      if ('subcat' in params) STATE.subcat = params.subcat || null;
    }
    _rememberNav(snap);
    _afterNavRender();
  },
  back() {
    if (STATE.history.length && RB_BROWSER_HISTORY_READY && !RB_APPLYING_BROWSER_HISTORY) {
      const before = _navSnapshot();
      try {
        window.history.back();
        clearTimeout(RB_BACK_FALLBACK_TIMER);
        RB_BACK_FALLBACK_TIMER = setTimeout(() => {
          if (_isSameNav(before, _navSnapshot())) _backInternal(false);
        }, 320);
        return;
      } catch (e) {}
    }
    _backInternal();
  },
  openProduct(id) {
    const snap = _navSnapshot();
    STATE.screen = 'product';
    STATE.productId = id;
    STATE.productFasovka = STATE.fasovkaSplit || null;
    STATE.productKg = 1;
    _rememberNav(snap);
    _afterNavRender();
  },
  async sendKP() {
    const btn = document.getElementById('rb-kp-btn');
    const orig = btn ? btn.innerHTML : '';
    if (btn) { btn.innerHTML = 'Отправляю…'; btn.disabled = true; }
    try {
      const r = await fetch('/tma/api/send_kp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
      });
      const j = await r.json().catch(() => ({}));
      if (j.ok) {
        toast('КП отправлено в личку ✓', 'success');
        if (btn) btn.innerHTML = 'Отправлено ✓';
      } else {
        toast('Ошибка: ' + (j.error || 'попробуйте ещё раз'), 'error');
        if (btn) { btn.innerHTML = orig; btn.disabled = false; }
      }
    } catch (e) {
      toast('Ошибка отправки', 'error');
      if (btn) { btn.innerHTML = orig; btn.disabled = false; }
    }
  },
  setFasovka(size) {
    STATE.productFasovka = size;
    haptic('light');
    render();
  },
  setKg(n) {
    STATE.productKg = Math.max(1, Math.min(999, n));
    haptic('light');
    render();
  },
  askManager(id, fasovka) {
    const p = findProduct(id);
    const f = (p?.fasovka || []).find(x => x.size === fasovka) || { size: fasovka };
    askManagerFor(p, f);
  },
  cartAdd(id, fasovka, qty) {
    const p = findProduct(id);
    if (!p) return;
    if (!fasovka) {
      const f = (p.fasovka || [])[0];
      fasovka = f?.size || 'уп.';
    }
    const f = (p.fasovka || []).find(x => x.size === fasovka) || (p.fasovka || [])[0] || {};
    if (f.on_request || typeof f.price !== 'number') {
      askManagerFor(p, f.size || fasovka);
      return;
    }
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (ex) ex.qty += (qty || 1);
    else STATE.cart.push({ id, fasovka, qty: qty || 1 });
    saveLocal();
    haptic('light');
    toast(`+ ${p.name}`);
    render();
  },
  cartChange(id, fasovka, delta) {
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (!ex) return;
    ex.qty += delta;
    if (ex.qty <= 0) STATE.cart = STATE.cart.filter(x => !(x.id === id && x.fasovka === fasovka));
    saveLocal();
    haptic('light');
    render();
  },
  cartClear() {
    if (!confirm('Очистить корзину?')) return;
    STATE.cart = [];
    saveLocal();
    haptic('warning');
    render();
  },
  openCat(catId) {
    const snap = _navSnapshot();
    STATE.screen = 'catalog';
    STATE.cat = catId || null;
    STATE.subcat = null;
    STATE.showAll = false;
    STATE.fasovkaSplit = null;
    resetFilters();
    _rememberNav(snap);
    _afterNavRender();
  },
  openSubcat(subId) {
    const snap = _navSnapshot();
    STATE.screen = 'catalog';
    if (!STATE.cat) {
      let cur = STATE.data.subcategories.find(s => s.id === subId);
      let cat = null;
      while (cur) {
        if (STATE.data.categories.find(c => c.id === cur.parent)) { cat = cur.parent; break; }
        cur = STATE.data.subcategories.find(s => s.id === cur.parent);
      }
      STATE.cat = cat;
    }
    STATE.subcat = subId;
    STATE.showAll = false;
    STATE.fasovkaSplit = null;
    resetFilters();
    _rememberNav(snap);
    _afterNavRender();
  },
  openFasovkaSplit(size) {
    const snap = _navSnapshot();
    STATE.fasovkaSplit = size;
    // STATE.subcat НЕ сбрасываем — он нужен для определения какой retail-подкатегории показать товары.
    STATE.showAll = false;
    resetFilters();
    _rememberNav(snap);
    _afterNavRender();
  },
  openSubcatAll() {
    const snap = _navSnapshot();
    STATE.showAll = true;
    _rememberNav(snap);
    _afterNavRender();
  },
  toggleFasovka(s) {
    STATE.filters.fasovka = STATE.filters.fasovka === s ? null : s;
    haptic('light'); render();
  },
  toggleInStock() {
    STATE.filters.inStock = !STATE.filters.inStock;
    haptic('light'); render();
  },
  toggleCountry(c) {
    const a = STATE.filters.countries;
    const i = a.indexOf(c);
    if (i >= 0) a.splice(i, 1); else a.push(c);
    haptic('light'); render();
  },
  toggleFlavor(c) {
    const a = STATE.filters.flavors;
    const i = a.indexOf(c);
    if (i >= 0) a.splice(i, 1); else a.push(c);
    haptic('light'); render();
  },
  toggleFilterPanel(kind) {
    STATE.filterOpen = STATE.filterOpen === kind ? false : (kind || (STATE.filterOpen ? false : 'country'));
    haptic('light'); render();
  },
  resetFilters() {
    resetFilters();
    haptic('warning'); render();
  },
  searchInput(v) {
    STATE.searchQuery = v || '';
    if (STATE.screen !== 'search') STATE.screen = 'search';
    render();
    const inp = document.getElementById('rb-search-input');
    if (inp) {
      inp.focus();
      const pos = inp.value.length;
      try { inp.setSelectionRange(pos, pos); } catch (e) {}
    }
  },
  checkout() {
    if (!STATE.cart.length) { toast('Корзина пустая'); return; }
    haptic('light');
    // Pre-fill имени из Telegram если ещё пусто
    if (!STATE.contact.name && tg?.initDataUnsafe?.user) {
      const u = tg.initDataUnsafe.user;
      const nm = [u.first_name, u.last_name].filter(Boolean).join(' ');
      if (nm) STATE.contact.name = nm;
    }
    rb.go('checkout');
  },
  updateContact(key, value) {
    // key поддерживает dot-нотацию: 'delivery.method', 'delivery.city' и т.д.
    if (key.includes('.')) {
      const [a, b] = key.split('.');
      STATE.contact[a] = STATE.contact[a] || {};
      STATE.contact[a][b] = value;
    } else {
      STATE.contact[key] = value;
    }
  },
  setClientType(t) {
    STATE.contact.type = t;
    haptic('light'); render();
  },
  setDelivery(method) {
    STATE.contact.delivery.method = method;
    haptic('light'); render();
  },
  setPickupPoint(id) {
    STATE.contact.delivery.pickup_point = id;
    haptic('light'); render();
  },
  toggleConsent() {
    STATE.contact.consent = !STATE.contact.consent;
    haptic('light'); render();
  },
  async submitOrder() {
    if (STATE.submitting) return;
    const c = STATE.contact;
    const selectedPickup = c.delivery.method === 'pickup' ? pickupPointById(c.delivery.pickup_point) : null;
    const pickupAddress = selectedPickup ? 'Самовывоз: ' + selectedPickup.address : '';
    // Валидация
    const name = (c.name || '').trim();
    const phone = (c.phone || '').trim();
    const phoneDigits = phone.replace(/\D/g, '');
    if (name.length < 2) { toast('Укажите имя'); haptic('error'); return; }
    if (phoneDigits.length < 10) { toast('Укажите корректный телефон'); haptic('error'); return; }
    if (!c.delivery.method) { toast('Выберите способ доставки'); haptic('error'); return; }
    if (c.delivery.method === 'pickup' && !selectedPickup) {
      toast('Выберите пункт самовывоза'); haptic('error'); return;
    }
    if (c.delivery.method === 'courier' && !(c.delivery.address || '').trim()) {
      toast('Укажите адрес доставки'); haptic('error'); return;
    }
    if (c.delivery.method === 'cdek') {
      if (!(c.delivery.city || '').trim()) { toast('Укажите город'); haptic('error'); return; }
      if (!(c.delivery.address || '').trim()) { toast('Укажите пункт выдачи или адрес'); haptic('error'); return; }
    }
    if (c.type === 'company') {
      const inn = (c.inn || '').replace(/\D/g, '');
      if (!(c.company_name || '').trim()) { toast('Укажите название компании'); haptic('error'); return; }
      if (inn.length !== 10 && inn.length !== 12) { toast('ИНН: 10 или 12 цифр'); haptic('error'); return; }
    }
    if (!c.consent) { toast('Подтвердите согласие на обработку ПДн'); haptic('error'); return; }

    const items = STATE.cart.map(i => {
      const p = findProduct(i.id); if (!p) return null;
      const f = (p.fasovka || []).find(x => x.size === i.fasovka) || (p.fasovka || [])[0] || {};
      return { id: i.id, name: p.name, fasovka: i.fasovka, qty: i.qty,
               price: typeof f.price === 'number' ? f.price : null,
               on_request: !!f.on_request };
    }).filter(Boolean);
    if (!items.length) { toast('Корзина пустая'); return; }
    const totalKg = cartWeightKg();
    const subtotal = cartSubtotal();
    const tier = tierFor(totalKg);
    const total = subtotal * (1 - tier);

    const contactPayload = {
      type: c.type,
      name,
      phone,
      email: (c.email || '').trim() || undefined,
      comment: (c.comment || '').trim() || undefined,
      delivery: {
        method: c.delivery.method,
        pickup_point: selectedPickup ? selectedPickup.id : undefined,
        pickup_title: selectedPickup ? selectedPickup.title : undefined,
        address: selectedPickup ? pickupAddress : ((c.delivery.address || '').trim() || undefined),
        city: selectedPickup ? 'Пермь' : ((c.delivery.city || '').trim() || undefined),
        time: (c.delivery.time || '').trim() || undefined,
        recipient_name: (c.delivery.recipient_name || '').trim() || undefined,
        recipient_phone: (c.delivery.recipient_phone || '').trim() || undefined,
      },
    };
    if (c.type === 'company') {
      contactPayload.company_name = (c.company_name || '').trim();
      contactPayload.company = contactPayload.company_name;
      contactPayload.inn = (c.inn || '').replace(/\D/g, '');
      const legal = (c.legal_address || '').trim();
      if (legal) contactPayload.legal_address = legal;
    }
    // address на верхнем уровне — для совместимости с бэкендом (orders.address)
    contactPayload.address = contactPayload.delivery.address
      || contactPayload.delivery.city
      || '';

    const payload = {
      type: 'order',
      items,
      contact: contactPayload,
      totalKg,
      subtotal,
      discount_pct: tier,
      saved: subtotal - total,
      total,
    };

    STATE.submitting = true; render();
    try {
      const r = await fetch('/tma/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(payload),
      });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok !== false) {
        STATE.cart = []; saveLocal();
        saveProfile();
        haptic('success');
        toast('Заказ оформлен. №' + (j.order_id || ''));
        STATE.contact.consent = false;
        setTimeout(() => rb.go('profile'), 1200);
      } else {
        haptic('error');
        toast(j.error || ('Ошибка: ' + r.status));
      }
    } catch (e) {
      haptic('error');
      toast('Сеть недоступна');
    } finally {
      STATE.submitting = false; render();
    }
  },
  /* ────────── ADMIN ────────── */
  async loadMyOrders() {
    if (!IS_TG) { STATE.myOrders = []; return; }
    try {
      const r = await fetch('/tma/api/my_orders?limit=10', { headers: authHeaders() });
      if (!r.ok) { STATE.myOrders = []; return; }
      const j = await r.json();
      STATE.myOrders = Array.isArray(j) ? j : (j.orders || j.items || []);
    } catch (e) { STATE.myOrders = []; }
    render();
  },
  async openAdmin() {
    if (!STATE.isAdmin) { toast('Только для админов'); return; }
    const snap = _navSnapshot();
    STATE.screen = 'admin';
    STATE.adminTab = STATE.adminTab || 'products';
    STATE.adminPayload = null;
    _rememberNav(snap);
    render();
    if (STATE.adminTab !== 'products') await rb.loadAdmin();
    if (!STATE.adminCatalogMeta) {
      try {
        const r = await fetch('/tma/api/admin/catalog_meta', { headers: authHeaders() });
        if (r.ok) STATE.adminCatalogMeta = await r.json();
      } catch (e) {}
    }
  },
  setAdminTab(tab) {
    STATE.adminTab = tab;
    STATE.adminPayload = null;
    render();
    if (tab !== 'products') rb.loadAdmin();
  },
  async loadAdmin() {
    const tab = STATE.adminTab;
    if (tab === 'products') { render(); return; }
    try {
      const map = {
        pending: 'pending', orders: 'orders', users: 'users', quarantine: 'quarantine',
      };
      const url = '/tma/api/admin/' + (map[tab] || 'quarantine');
      const r = await fetch(url, { headers: authHeaders() });
      STATE.adminPayload = r.ok ? await r.json() : { error: 'HTTP ' + r.status };
    } catch (e) {
      STATE.adminPayload = { error: String(e) };
    }
    render();
  },
  adminUsersSearch(q) { STATE.adminUsersQuery = q; render(); },
  async adminQuarantineRelease(id) {
    if (!confirm('Вернуть из карантина: ' + id + '?')) return;
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ quarantined: false }),
      });
      if (r.ok) { haptic('success'); toast('Возвращён'); rb.loadAdmin(); }
      else { haptic('error'); toast('Ошибка: ' + r.status); }
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },
  adminProductsFilter(id) { STATE.adminProductsFilter = id; render(); },
  adminProductsSearch(q)  { STATE.adminProductsQuery = q; render(); },
  async _adminPatchProduct(id, patch, optMsg) {
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(patch),
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return false; }
      const p = (STATE.data?.products || []).find(x => x.id === id);
      if (p) Object.assign(p, patch);
      haptic('success');
      if (optMsg) toast(optMsg, 'success');
      render();
      return true;
    } catch (e) { haptic('error'); toast('Сеть недоступна'); return false; }
  },
  async adminAdjustStock(id, delta) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const cur = typeof p.stock === 'number' ? p.stock : 0;
    const next = Math.max(0, cur + delta);
    if (next === cur) return;
    await rb._adminPatchProduct(id, { stock: next });
  },
  async adminSetStock(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const cur = typeof p.stock === 'number' ? p.stock : 0;
    const raw = prompt('Остаток для «' + p.name + '»:', String(cur));
    if (raw === null) return;
    const n = parseInt(raw, 10);
    if (!Number.isFinite(n) || n < 0) { toast('Нужно неотрицательное число'); return; }
    await rb._adminPatchProduct(id, { stock: n }, 'Сохранено');
  },
  async adminSetPrices(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p || !Array.isArray(p.fasovka) || !p.fasovka.length) {
      toast('У товара нет фасовок — сначала добавь их через CMS');
      return;
    }
    const patch = {};
    for (const f of p.fasovka) {
      const cur = typeof f.price === 'number' ? f.price : '';
      const raw = prompt('Цена за «' + f.size + '» (₽) — «' + p.name + '»:', String(cur));
      if (raw === null) continue;  // отмена — пропускаем эту фасовку
      const t = raw.trim();
      if (t === '') { patch[f.size] = null; continue; }
      const n = parseInt(t.replace(/\s/g, ''), 10);
      if (!Number.isFinite(n) || n < 0) { toast('«' + f.size + '»: нужно число ≥ 0'); continue; }
      patch[f.size] = n;
    }
    if (!Object.keys(patch).length) return;
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ fasovka_prices: patch }),
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return; }
      for (const f of p.fasovka) {
        if (f.size in patch) {
          f.price = patch[f.size];
          if (f.price === null) f.on_request = true; else delete f.on_request;
        }
      }
      haptic('success'); toast('Цены сохранены', 'success');
      render();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },
  async adminToggleQuarantine(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    const next = !p.quarantined;
    if (next && !confirm('Скрыть «' + p.name + '» в карантин?')) return;
    await rb._adminPatchProduct(id, { quarantined: next }, next ? 'В карантине' : 'Возвращён');
  },
  async openAdminOrder(id) {
    if (!STATE.isAdmin) { toast('Только для админов'); return; }
    const snap = _navSnapshot();
    STATE.screen = 'admin-order';
    STATE.adminOrderId = id;
    STATE.adminOrderData = null;
    _rememberNav(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
    try {
      const r = await fetch('/tma/api/admin/order/' + encodeURIComponent(id), { headers: authHeaders() });
      STATE.adminOrderData = r.ok ? await r.json() : { error: 'HTTP ' + r.status };
    } catch (e) {
      STATE.adminOrderData = { error: String(e) };
    }
    render();
  },
  async adminSetOrderStatus(status) {
    const id = STATE.adminOrderId;
    if (!id) return;
    try {
      const r = await fetch('/tma/api/admin/order/' + encodeURIComponent(id) + '/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ status }),
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return; }
      haptic('success'); toast('Статус: ' + status, 'success');
      if (STATE.adminOrderData) STATE.adminOrderData.status = status;
      render();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },
  adminOpenChat(userId, clientName) {
    const uid = String(userId || '').replace(/[^0-9-]/g, '');
    if (!uid) { toast('Нет user_id у клиента'); return; }
    const name = clientName || ('id ' + uid);
    _openDmModal(uid, name);
  },

  /* ────────── ADMIN: КЛИЕНТ ────────── */
  async openAdminUser(uid) {
    if (!STATE.isAdmin) { toast('Только для админов'); return; }
    const snap = _navSnapshot();
    STATE.screen = 'admin-user';
    STATE.adminUserId = uid;
    STATE.adminUserData = null;
    STATE.adminUserPricing = null;
    _rememberNav(snap);
    haptic();
    window.scrollTo(0, 0);
    render();
    try {
      const [r1, r2, r3] = await Promise.all([
        fetch('/tma/api/admin/user/' + uid, { headers: authHeaders() }),
        fetch('/tma/api/admin/user/' + uid + '/pricing', { headers: authHeaders() }),
        fetch('/tma/api/admin/catalog_meta', { headers: authHeaders() }),
      ]);
      STATE.adminUserData = r1.ok ? await r1.json() : { error: 'HTTP ' + r1.status };
      STATE.adminUserPricing = r2.ok ? (await r2.json()).rules || [] : [];
      STATE.adminCatalogMeta = r3.ok ? await r3.json() : { categories: [], subcategories: {}, fasovkas: [], products_lite: [] };
    } catch (e) {
      STATE.adminUserData = { error: String(e) };
    }
    render();
  },

  async adminSaveUserField(field, value) {
    const uid = STATE.adminUserId;
    if (!uid) return;
    const body = {}; body[field] = value;
    try {
      const r = await fetch('/tma/api/admin/user/' + uid, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body),
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return; }
      const j = await r.json();
      if (j.user) STATE.adminUserData = { ...STATE.adminUserData, ...j.user };
      haptic('success'); toast('Сохранено', 'success');
      render();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },

  async adminSetUserTier() {
    const cur = (STATE.adminUserData?.price_tier || 'standard');
    const TIERS = [
      { id: 'standard',    label: 'Стандартная цена (1кг / 200г)' },
      { id: 'discount_10', label: 'Опт −10% (от 10кг)' },
      { id: 'discount_20', label: 'Опт −20% (от 25кг)' },
      { id: 'stm',         label: 'СТМ-прайс' },
    ];
    const lines = TIERS.map((t, i) => `${i + 1}. ${t.label}${t.id === cur ? '  ✓ текущий' : ''}`).join('\n');
    const pick = prompt('Тариф клиента — выбери номер:\n\n' + lines, String(TIERS.findIndex(t => t.id === cur) + 1));
    if (!pick) return;
    const idx = parseInt(pick, 10) - 1;
    if (!Number.isFinite(idx) || idx < 0 || idx >= TIERS.length) { toast('Неверный номер'); return; }
    await rb.adminSaveUserField('price_tier', TIERS[idx].id);
  },

  async adminEditUserField(field, label) {
    const cur = STATE.adminUserData?.[field] || '';
    const v = prompt(label + ':', String(cur));
    if (v === null) return;
    await rb.adminSaveUserField(field, v.trim());
  },

  adminAddPricing() {
    if (!STATE.adminUserId) return;
    _openPricingModal(STATE.adminUserId);
  },

  async adminDelPricing(ruleId) {
    if (!confirm('Удалить правило?')) return;
    try {
      const r = await fetch('/tma/api/admin/pricing/' + ruleId + '/delete', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      });
      if (!r.ok) { haptic('error'); toast('Ошибка: ' + r.status); return; }
      STATE.adminUserPricing = (STATE.adminUserPricing || []).filter(r => r.id !== ruleId);
      haptic('success'); toast('Удалено', 'success'); render();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },

  adminOpenDm() {
    const u = STATE.adminUserData;
    if (!u) return;
    if (u.user_id < 0) { toast('Гость — нельзя писать в Telegram'); return; }
    _openDmModal(u.user_id, u.name || ('id ' + u.user_id));
  },

  /* ────────── ADMIN: РЕДАКТОР КАРТОЧКИ ────────── */
  adminEditCard(id) {
    const p = (STATE.data?.products || []).find(x => x.id === id);
    if (!p) return;
    _openCardEditor(p);
  },

  async _sendDm(uid) {
    const ta = document.getElementById('rb-dm-text');
    const btn = document.getElementById('rb-dm-send');
    const text = (ta?.value || '').trim();
    if (!text) { toast('Введи текст'); return; }
    if (btn) { btn.disabled = true; btn.innerHTML = 'Отправляю…'; }
    try {
      const r = await fetch('/tma/api/admin/dm/' + uid, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ text }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) {
        haptic('error');
        toast('Не отправлено: ' + (j.error || r.status));
        if (btn) { btn.disabled = false; btn.innerHTML = 'Отправить'; }
        return;
      }
      haptic('success'); toast('Отправлено клиенту', 'success');
      _adminCloseModal();
    } catch (e) {
      haptic('error'); toast('Сеть недоступна');
      if (btn) { btn.disabled = false; btn.innerHTML = 'Отправить'; }
    }
  },

  async _savePricing(uid) {
    const st = STATE._pr || {};
    const scope = st.scope || '';
    let target_id = st.target || '';
    if (scope === 'all') target_id = '*';
    if (!scope) { toast('Выбери область'); return; }
    if (scope !== 'all' && !target_id) { toast('Выбери конкретный пункт'); return; }
    const hasPct = st.pct != null && !isNaN(st.pct);
    const hasFix = st.fixed != null && !isNaN(st.fixed);
    if (hasPct === hasFix) { toast('Укажи ОДНО: % ИЛИ фикс. цену'); return; }
    const body = { scope, target_id };
    if (st.fasovka) body.fasovka = st.fasovka;
    if (hasPct) body.discount_pct = st.pct;
    else body.fixed_price = st.fixed;
    try {
      const r = await fetch('/tma/api/admin/user/' + uid + '/pricing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); haptic('error'); toast('Ошибка: ' + (j.error || r.status)); return; }
      haptic('success'); toast('Скидка добавлена', 'success'); _adminCloseModal();
      const r2 = await fetch('/tma/api/admin/user/' + uid + '/pricing', { headers: authHeaders() });
      if (r2.ok) { STATE.adminUserPricing = (await r2.json()).rules || []; render(); }
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },

  async _saveCardFromState() {
    const p = STATE._ce;
    if (!p) return;
    const id = p.id;
    if (!p.name || !p.name.trim()) { toast('Введи название'); return; }
    // Нормализуем фасовки: пустой size — выкидываем
    const fas = (p.fasovka || [])
      .filter(f => (f.size || '').trim())
      .map(f => {
        const e = { size: f.size.trim() };
        if (f.on_request) e.on_request = true;
        else e.price = parseFloat(f.price) || 0;
        return e;
      });
    const body = {
      name: (p.name || '').trim(),
      category: (p.category || '').trim(),
      subcategory: (p.subcategory || '').trim(),
      country: (p.country || '').trim(),
      roast: (p.roast || '').trim(),
      description: p.description || '',
      hidden: !!p.hidden,
      on_request: !!p.on_request,
      fasovka: fas,
    };
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(body),
      });
      if (!r.ok) { const j = await r.json().catch(() => ({})); haptic('error'); toast('Ошибка: ' + (j.error || r.status)); return; }
      const j = await r.json();
      const target = (STATE.data?.products || []).find(x => x.id === id);
      if (target && j.product) Object.assign(target, j.product);
      haptic('success'); toast('Сохранено', 'success'); _adminCloseModal(); render();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },

  async _cePhotoChange(file) {
    if (!file || !STATE._ce) return;
    const id = STATE._ce.id;
    if (!id) { toast('Сначала сохрани карточку'); return; }
    if (file.size > 5 * 1024 * 1024) { toast('Фото > 5 МБ — ужми'); return; }
    const ct = file.type || 'image/jpeg';
    if (!/^image\/(jpe?g|png|webp)$/.test(ct)) { toast('Только jpg/png/webp'); return; }
    toast('Загружаю фото...');
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id) + '/photo', {
        method: 'POST',
        headers: { 'Content-Type': ct, ...authHeaders() },
        body: file,
      });
      if (!r.ok) { haptic('error'); toast('Ошибка фото: ' + r.status); return; }
      const j = await r.json();
      const newPhoto = (j.photo || '') + '?v=' + Date.now();
      STATE._ce.photo = newPhoto;
      const target = (STATE.data?.products || []).find(x => x.id === id);
      if (target) target.photo = newPhoto;
      haptic('success'); toast('Фото обновлено ✓', 'success'); _ceRender();
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },

  // Старый stub для обратной совместимости с другими вызовами
  async adminUploadPhoto(id, file) { return rb._cePhotoChange(file); },
};
window.rb = rb;

window.addEventListener('popstate', (event) => {
  const state = event.state;
  if (!state || state[RB_BROWSER_HISTORY_KEY] !== true) return;
  clearTimeout(RB_BACK_FALLBACK_TIMER);
  RB_LAST_POPSTATE_AT = Date.now();
  RB_APPLYING_BROWSER_HISTORY = true;
  try {
    STATE.history = Array.isArray(state.stack) ? _cloneNavStack(state.stack) : [];
    _applyNavSnapshot(state.nav);
    window.scrollTo(0, 0);
    render();
    if (STATE.screen === 'profile' && STATE.myOrders === undefined) rb.loadMyOrders();
  } finally {
    RB_APPLYING_BROWSER_HISTORY = false;
  }
});

function installEdgeBackSwipe() {
  let sx = 0;
  let sy = 0;
  let edge = false;
  document.addEventListener('touchstart', (event) => {
    const t = event.touches && event.touches[0];
    if (!t) return;
    sx = t.clientX;
    sy = t.clientY;
    edge = sx < 34 && STATE.history.length > 0;
  }, { passive: true });
  document.addEventListener('touchend', (event) => {
    if (!edge) return;
    edge = false;
    const t = event.changedTouches && event.changedTouches[0];
    if (!t) return;
    const dx = t.clientX - sx;
    const dy = Math.abs(t.clientY - sy);
    if (dx > 56 && dy < 70 && dx > dy * 1.35) {
      const popAt = RB_LAST_POPSTATE_AT;
      setTimeout(() => {
        if (RB_LAST_POPSTATE_AT === popAt && STATE.history.length > 0) rb.back();
      }, 120);
    }
  }, { passive: true });
}
installEdgeBackSwipe();

/* ════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════ */
function rbHeroSync(el) {
  if (!el) return;
  const idx = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
  const dots = document.querySelectorAll('#rb-hero-dots span');
  dots.forEach((d, i) => {
    if (i === idx) { d.style.width = '24px'; d.style.opacity = '1'; }
    else           { d.style.width = '8px';  d.style.opacity = '0.22'; }
  });
}

function render() {
  const root = document.getElementById('root');
  let body = '';
  switch (STATE.screen) {
    case 'home':    body = screenHome(); break;
    case 'catalog': body = screenCatalog(); break;
    case 'product': body = screenProduct(); break;
    case 'cart':    body = screenCart(); break;
    case 'checkout': body = screenCheckout(); break;
    case 'profile': body = screenProfile(); break;
    case 'search':  body = screenSearch(); break;
    case 'admin':       body = screenAdmin(); break;
    case 'admin-order': body = screenAdminOrder(); break;
    case 'admin-user':  body = screenAdminUser(); break;
    default: body = screenHome();
  }
  root.innerHTML = `<div class="rb${IS_DARK ? ' rb--dark' : ''}">${body}</div>`;
  syncTgBackButton();
}

function syncTgBackButton() {
  if (!tg || !tg.BackButton) return;
  const canGoBack = STATE.history.length > 0 || STATE.screen !== 'home';
  try {
    if (canGoBack) tg.BackButton.show();
    else tg.BackButton.hide();
  } catch (e) {}
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN CHECK
   ════════════════════════════════════════════════════════════════════ */
async function checkAdmin() {
  if (!IS_TG) return;
  try {
    const r = await fetch('/tma/api/admin/check', { headers: authHeaders() });
    const j = await r.json();
    STATE.isAdmin = !!j.is_admin;
  } catch (e) { STATE.isAdmin = false; }
}

/* ════════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════════ */
async function init() {
  loadLocal();
  if (tg) {
    try { tg.ready(); tg.expand(); } catch(e){}
    try { tg.setBackgroundColor('#FAF7F2'); } catch(e){}
    try { tg.setHeaderColor('#FAF7F2'); } catch(e){}
    try { tg.setBottomBarColor && tg.setBottomBarColor('#FAF7F2'); } catch(e){}
    // подстраховка: пере-устанавливаем цвет фона при ресайзе / переходе из background
    // (некоторые версии Telegram забывают цвет когда viewport меняется)
    try {
      tg.onEvent && tg.onEvent('viewportChanged', () => {
        try { tg.setBackgroundColor('#FAF7F2'); } catch(e){}
        try { tg.setBottomBarColor && tg.setBottomBarColor('#FAF7F2'); } catch(e){}
      });
    } catch(e){}
    try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch(e){}
    if (tg.BackButton) {
      try { tg.BackButton.onClick(() => rb.back()); } catch(e){}
    }
  }
  try {
    const r = await fetch('/tma/products.json?v=' + Date.now(), { cache: 'no-store' });
    STATE.data = await r.json();
  } catch (e) {
    document.getElementById('root').innerHTML = `<div style="padding:80px 24px; text-align:center;"><h2>Каталог недоступен</h2><p style="color:var(--ink-soft); margin-top:8px;">${esc(String(e))}</p></div>`;
    return;
  }
  await checkAdmin();
  _writeBrowserNav('replace');
  render();
  // Service Worker не регистрируем: внутри Telegram он только мешает (агрессивный кэш HTML/JS).
  // Если хочешь PWA-режим в браузере — раскомментируй ниже.
  // if ('serviceWorker' in navigator && !(tg && tg.initData)) {
  //   navigator.serviceWorker.register('sw.js?v=20260519-2055').catch(() => {});
  // }
}
init();
