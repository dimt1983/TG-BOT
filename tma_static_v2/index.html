<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Roastberry</title>
<meta name="theme-color" content="#FAF7F2" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="tokens.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg, #FAF7F2); }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; overscroll-behavior-y: contain; }
  #root { min-height: 100vh; padding-bottom: 110px; }
  .rb a { color: inherit; }
  .rb button { font: inherit; }
  @keyframes rb-blink { 50% { opacity: 0 } }
  .rb-cursor { display:inline-block; width:1.5px; height:17px; background:var(--copper); margin-left:1px; vertical-align:middle; animation: rb-blink 1s steps(2) infinite; }
  .rb-spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--ink-mute); border-top-color: var(--ink); border-radius:50%; animation: rb-spin 0.7s linear infinite; }
  @keyframes rb-spin { to { transform: rotate(360deg); } }
  .rb-toast { position:fixed; left:50%; bottom:120px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:100; box-shadow: var(--sh-2); opacity:0; transition:opacity .2s; pointer-events:none; }
  .rb-toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="root">
  <div style="padding:80px 24px; text-align:center; color:#8a7a6c">
    <div class="rb-spinner" style="margin-bottom:14px"></div>
    <div style="font-family:'Inter',sans-serif; font-size:13px">Загружаю каталог…</div>
  </div>
</div>

<div id="rb-toast" class="rb-toast"></div>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════
   TELEGRAM SDK + AUTH
   ════════════════════════════════════════════════════════════════════ */
const tg = window.Telegram?.WebApp;
try { tg?.ready?.(); tg?.expand?.(); } catch(e) {}
const IS_TG = !!(tg && tg.initData && tg.initData.length > 0);
const IS_DARK = (tg?.colorScheme === 'dark') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);

function authHeaders() { return IS_TG ? { 'X-Tma-InitData': tg.initData } : {}; }
function haptic(kind = 'light') {
  try {
    if (kind === 'success' || kind === 'error' || kind === 'warning') tg?.HapticFeedback?.notificationOccurred?.(kind);
    else tg?.HapticFeedback?.impactOccurred?.(kind);
  } catch (e) {}
}
function toast(msg, ms = 1600) {
  const el = document.getElementById('rb-toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), ms);
}

/* ════════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════════ */
const STATE = {
  data: null,                    // products.json
  cart: [],                      // [{id, fasovka, qty}]
  favorites: [],                 // [id]
  screen: 'home',                // home | catalog | product | cart | profile
  cat: null,                     // categoryId for catalog
  subcat: null,                  // subcategoryId for catalog
  productId: null,
  productFasovka: null,          // selected size in product screen
  productKg: 1,                  // selected weight for discount calculator
  isAdmin: false,
  history: [],                   // navigation stack
};

const STORAGE_KEY = 'rb-v2-state-1';
function saveLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ cart: STATE.cart, favorites: STATE.favorites })); } catch(e){}
}
function loadLocal() {
  try {
    const j = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    STATE.cart = j.cart || [];
    STATE.favorites = j.favorites || [];
  } catch(e){}
}

/* ════════════════════════════════════════════════════════════════════
   ICONS — 24 SVG paths
   ════════════════════════════════════════════════════════════════════ */
const ICONS = {
  search:'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14ZM16.5 16.5L21 21',
  bag:'M6 8h12l-.8 11a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9L6 8Zm3 0V6a3 3 0 0 1 6 0v2',
  menu:'M4 7h16M4 12h16M4 17h12',
  back:'M14 6l-6 6 6 6',
  more:'M5 12h.01M12 12h.01M19 12h.01',
  plus:'M12 5v14M5 12h14',
  minus:'M5 12h14',
  heart:'M12 20s-7-4.5-9.3-9A5.3 5.3 0 0 1 12 5.2 5.3 5.3 0 0 1 21.3 11C19 15.5 12 20 12 20Z',
  filter:'M4 6h16M7 12h10M10 18h4',
  home:'M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-7h-6v7H5a1 1 0 0 1-1-1v-9Z',
  user:'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 10c0-4 4-6 8-6s8 2 8 6',
  flame:'M12 3s4 4.5 4 8.5A4 4 0 0 1 12 16a4 4 0 0 1-4-4.5C8 9 12 3 12 3Z',
  cup:'M5 7h13v6a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5V7Z M18 9h2a2 2 0 0 1 0 4h-2',
  truck:'M3 7h11v9H3V7Zm11 3h4l3 3v3h-7v-6ZM7 18a2 2 0 1 1 0-4 2 2 0 0 1 0 4Zm10 0a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z',
  doc:'M7 3h7l5 5v13H7V3Z M14 3v5h5 M9 13h7M9 17h7',
  scale:'M12 5v14 M5 8h14 M5 8l-2 7a4 4 0 0 0 8 0L9 8 M15 8l-2 7a4 4 0 0 0 8 0l-2-7',
  clock:'M12 7v6l4 2 M12 3a9 9 0 1 1 0 18 9 9 0 0 1 0-18Z',
  drop:'M12 3c0 0 6 6 6 11a6 6 0 0 1-12 0c0-5 6-11 6-11Z',
  therm:'M12 14a3 3 0 1 0 1 5.8V8a3 3 0 0 0-6 0v0Z M12 4v10 M12 4a2 2 0 0 1 2 2v8',
  grind:'M5 5h14v4H5V5Zm0 5h14v3l-2 8H7l-2-8v-3Z M9 5v-2h6v2',
  arrowR:'M5 12h14M13 6l6 6-6 6',
};
function icon(name, size = 18, sw = 1.6) {
  const d = ICONS[name] || '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><path d="${d}"/></svg>`;
}

/* ════════════════════════════════════════════════════════════════════
   TASTE HUE AUTO-MAP — словарь нот → цвет + интенсивность
   ════════════════════════════════════════════════════════════════════ */
const TASTE_HUES = {
  // шоколад / какао
  'шоколад':'#6F4E37','тёмный шоколад':'#3A2A1F','молочный шоколад':'#8B5224','какао':'#6F4E37','патока':'#4A3422',
  // ягоды
  'ягоды':'#9C3B52','клубника':'#9C3B52','малина':'#9C3B52','клюква':'#9C3B52','чёрная смородина':'#5A2848','смородина':'#7A2E4E',
  'вишня':'#7A2E2E','копчёная вишня':'#5E2020','черника':'#3A2848',
  // косточковые
  'персик':'#E2B190','абрикос':'#D89060','слива':'#7A4A6E',
  // цитрус
  'цитрус':'#C97E3C','лимон':'#E0B83C','апельсин':'#D87830','бергамот':'#C97E3C','грейпфрут':'#D45E5E','лайм':'#C0D03C',
  // карамель / мёд
  'карамель':'#C9A66B','мёд':'#D4A953','тростниковый сахар':'#C9A66B','ваниль':'#E8D8A8',
  // орех
  'орех':'#A87C50','миндаль':'#B89172','фундук':'#A87C50','грецкий орех':'#8B6840',
  // фрукты
  'красное яблоко':'#9C3B52','яблоко':'#7A9B5E','груша':'#A8C079','банан':'#E8D560',
  // тропики
  'тропики':'#E8B73C','манго':'#E0A032','ананас':'#E0B83C','личи':'#E8B7C8','маракуйя':'#E2B53C','папайя':'#E08050',
  // цветочные
  'жасмин':'#C087B7','роза':'#C46A8E','цветочные':'#C087B7','лепестки роз':'#C46A8E','лаванда':'#9078B0',
  // чай / травы
  'чёрный чай':'#5E4232','зелёный чай':'#7A9B5E','травы':'#5E7A4F','мята':'#5E7A4F','чабрец':'#5E7A4F','шиповник':'#C46A4E',
  'цукат':'#D89060',
  // пряности / тяжёлые
  'специи':'#A8412E','табак':'#5E4232','дым':'#5E4232','перец':'#7A2E2E','имбирь':'#D89060','кардамон':'#A8412E',
  // винные
  'вино':'#7A2E4E','красное вино':'#7A2E4E','порт':'#5A2848',
  // прочее
  'томат':'#C04030','хлеб':'#C9A66B','инжир':'#7A4A6E',
  '_default':'#6F4E37',
};
function tasteHue(note) {
  const k = String(note || '').toLowerCase().trim();
  if (TASTE_HUES[k]) return TASTE_HUES[k];
  for (const key in TASTE_HUES) {
    if (key !== '_default' && (k.includes(key) || key.includes(k))) return TASTE_HUES[key];
  }
  return TASTE_HUES._default;
}
function tastingForProduct(p) {
  const notes = p?.tasting_notes || [];
  if (!Array.isArray(notes) || !notes.length) return [];
  return notes.slice(0, 5).map((n, i, arr) => ({
    label: String(n),
    intensity: Math.max(2, 5 - i * (5 / Math.max(arr.length, 5))),
    hue: tasteHue(n),
  }));
}

/* ════════════════════════════════════════════════════════════════════
   COUNTRY FLAGS — 2-letter code by country name
   ════════════════════════════════════════════════════════════════════ */
const FLAG_CODES = {
  'Бразилия':'br','Эфиопия':'et','Колумбия':'co','Кения':'ke','Гватемала':'gt',
  'Россия':'ru','Германия':'de','Перу':'pe','Гондурас':'hn','Никарагуа':'ni',
  'Танзания':'tz','Уганда':'ug','Руанда':'rw','Китай':'cn','Коста-Рика':'cr',
  'Коста-Рико':'cr','Индия':'in','Индонезия':'id','Йемен':'ye','Мьянма':'mm',
  'Эквадор':'ec','Боливия':'bo','Сальвадор':'sv','Мексика':'mx',
};
function flagDot(country) {
  const code = FLAG_CODES[country] || '';
  return code ? `<span class="flag flag--${code}"></span>` : `<span class="flag"></span>`;
}

/* ════════════════════════════════════════════════════════════════════
   DISCOUNT TIERS — лестница скидок по весу
   ════════════════════════════════════════════════════════════════════ */
const TIERS = [
  { min: 25, d: 0.20 },
  { min: 10, d: 0.10 },
  { min: 0,  d: 0.00 },
];
function tierFor(kg) {
  for (const t of TIERS) if (kg >= t.min) return t.d;
  return 0;
}

/* ════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════ */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Math.round(Number(n) || 0).toLocaleString('ru-RU');

function sizeToKg(size) {
  const m = String(size || '').match(/(\d+(?:[.,]\d+)?)\s*(кг|г|гр)/i);
  if (!m) return 0;
  const n = parseFloat(m[1].replace(',', '.'));
  return /к/i.test(m[2]) ? n : n / 1000;
}

function cartCount() {
  return STATE.cart.reduce((s, i) => s + (i.qty || 1), 0);
}
function cartWeightKg() {
  let kg = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    if (p.category !== 'coffee') continue;
    kg += sizeToKg(it.fasovka) * (it.qty || 1);
  }
  return kg;
}
function cartSubtotal() {
  let s = 0;
  for (const it of STATE.cart) {
    const p = STATE.data?.products.find(x => x.id === it.id);
    if (!p) continue;
    const f = (p.fasovka || []).find(x => x.size === it.fasovka);
    if (!f || f.on_request || typeof f.price !== 'number') continue;
    s += f.price * (it.qty || 1);
  }
  return s;
}

function findProduct(id) { return STATE.data?.products.find(x => x.id === id); }
function productInSub(p, subId) {
  if (!subId || subId === 'all') return true;
  return p.subcategory === subId || (Array.isArray(p.subcategories) && p.subcategories.includes(subId));
}

/* ────────────── visibility (parity with prod) ────────────── */
function isVisibleInCatalog(p) {
  if (!p) return false;
  if (p.hidden) return false;
  if (p.quarantined && !STATE.isAdmin) return false;
  if (STATE.isAdmin) return true;
  const s = (typeof p.stock === 'number') ? p.stock : null;
  if (s !== null && s <= 0) {
    if (p.pair_id) {
      const sib = STATE.data.products.find(x => x.pair_id === p.pair_id && x.id !== p.id);
      if (sib && typeof sib.stock === 'number' && sib.stock > 0) return true;
    }
    return false;
  }
  return true;
}
function visibleProducts() {
  return (STATE.data?.products || []).filter(isVisibleInCatalog);
}

/* ════════════════════════════════════════════════════════════════════
   ATOMS
   ════════════════════════════════════════════════════════════════════ */
function btnGhost(inner, attrs = '') {
  return `<button class="btn-ghost" ${attrs}>${inner}</button>`;
}
function appHeader({ title = '', back = false, action = '', logo = false } = {}) {
  return `
    <div style="position:sticky; top:0; z-index:10; padding:54px 16px 12px; background:var(--bg); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px;">
      ${back
        ? `<button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.back()">${icon('back')}</button>`
        : (logo
          ? `<div style="font-family:var(--f-display); font-weight:900; font-size:16px; letter-spacing:0.04em; flex:1;">ROASTBERRY<span style="color:var(--copper)">.</span></div>`
          : '')}
      ${title ? `<div style="flex:1; text-align:center; font-family:var(--f-display); font-weight:700; font-size:15px;">${esc(title)}</div>` : ''}
      <div style="display:flex; gap:6px; margin-left:auto;">
        ${action || `
          <button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.go('search')">${icon('search')}</button>
          <button class="btn-ghost" style="width:36px; padding:0; justify-content:center; position:relative" onclick="rb.go('cart')">${icon('bag')}${cartCount() ? `<span style="position:absolute; top:-2px; right:-2px; min-width:16px; height:16px; border-radius:999px; background:var(--copper); color:#fff; font-size:10px; font-weight:700; font-family:var(--f-mono); display:flex; align-items:center; justify-content:center; padding:0 4px;">${cartCount()}</span>` : ''}</button>
        `}
      </div>
    </div>`;
}

function tabBar(active) {
  const tabs = [
    { id: 'home',    label: 'Главная', i: 'home' },
    { id: 'catalog', label: 'Каталог', i: 'menu' },
    { id: 'search',  label: 'Поиск',   i: 'search' },
    { id: 'cart',    label: 'Корзина', i: 'bag',  badge: cartCount() },
    { id: 'profile', label: 'Я',       i: 'user' },
  ];
  return `
    <div style="position:fixed; bottom:0; left:0; right:0; padding:8px 8px calc(env(safe-area-inset-bottom,18px) + 12px); background:color-mix(in oklab, var(--bg) 88%, transparent); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%); border-top:1px solid var(--line); display:flex; justify-content:space-around; z-index:9;">
      ${tabs.map(t => `
        <button onclick="rb.go('${t.id}')" style="flex:1; background:transparent; border:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0; color:${t.id === active ? 'var(--ink)' : 'var(--ink-faint)'}; cursor:pointer; position:relative;">
          <span style="position:relative">${icon(t.i, 22)}${t.badge ? `<span style="position:absolute; top:-3px; right:-8px; min-width:14px; height:14px; padding:0 3px; background:var(--copper); color:#fff; border-radius:999px; font-size:9px; font-weight:700; font-family:var(--f-mono); display:flex; align-items:center; justify-content:center;">${t.badge}</span>` : ''}</span>
          <span style="font-size:10px; font-weight:500;">${t.label}</span>
        </button>
      `).join('')}
    </div>`;
}

function placeholder(label, ratio = '4 / 3', extra = '') {
  return `<div class="ph" style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra}">${esc(label || '')}</div>`;
}

/* Реальная фотка товара. Если p.photo есть — рисуем <img> поверх .ph,
   при ошибке загрузки картинка прячется и остаётся диагональный плейсхолдер. */
function productImg(p, ratio = '1', extra = '', label = '') {
  const ph = `<div class="ph" style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra}">${esc(label || '')}</div>`;
  const src = p?.photo;
  if (!src) return ph;
  // photo лежит как "photos/products/xxx.jpg" — подкладываем под /tma/
  const url = /^https?:\/\//.test(src) ? src
            : src.startsWith('/') ? src
            : '/tma/' + src.replace(/^tma_static\//, '');
  return `<div class="ph" style="aspect-ratio:${ratio}; border-radius:var(--r-md); ${extra} background-image:url('${url}'); background-size:cover; background-position:center; background-repeat:no-repeat;"></div>`;
}

function stepper(value, decAction, incAction, ink = false) {
  return `
    <div class="stepper${ink ? ' stepper--ink' : ''}">
      <button onclick="${decAction}">−</button>
      <span>${value}</span>
      <button onclick="${incAction}">+</button>
    </div>`;
}

function freshDot(daysAgo) {
  const word = daysAgo === 1 ? 'день' : daysAgo < 5 ? 'дня' : 'дней';
  return `<span style="display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--green); font-weight:600;"><span style="width:6px; height:6px; border-radius:999px; background:var(--green)"></span>обжарено ${daysAgo} ${word} назад</span>`;
}

function roastBadge(roast) {
  if (!roast) return '';
  const cls = roast === 'F' ? ' roast--f' : '';
  return `<span class="roast${cls}">${esc(roast)}</span>`;
}

function chip(text, cls = '', extra = '') {
  return `<span class="chip${cls ? ' chip--' + cls : ''}" style="${extra}">${text}</span>`;
}

/* ────────────── Tasting footprint (SVG 5 spokes) ────────────── */
function tasting(notes, size = 148) {
  if (!notes || !notes.length) return '';
  const cx = size / 2, cy = size / 2;
  const rMin = 12, rMax = size / 2 - 22;
  const spokes = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const r = rMin + (rMax - rMin) * (n.intensity / 5);
    const x = (cx + Math.cos(a) * r).toFixed(2);
    const y = (cy + Math.sin(a) * r).toFixed(2);
    const x0 = (cx + Math.cos(a) * rMin).toFixed(2);
    const y0 = (cy + Math.sin(a) * rMin).toFixed(2);
    return `<line x1="${x0}" y1="${y0}" x2="${x}" y2="${y}" stroke="${n.hue}" stroke-width="3" stroke-linecap="round"/><circle cx="${x}" cy="${y}" r="3.5" fill="${n.hue}"/>`;
  }).join('');
  const labels = notes.map((n, i) => {
    const a = (i / notes.length) * Math.PI * 2 - Math.PI / 2;
    const lx = cx + Math.cos(a) * (rMax + 6);
    const ly = cy + Math.sin(a) * (rMax + 6);
    const tx = Math.cos(a), ty = Math.sin(a);
    const trX = tx > 0.3 ? '0' : tx < -0.3 ? '-100%' : '-50%';
    const trY = ty > 0.3 ? '0' : ty < -0.3 ? '-100%' : '-50%';
    return `<div style="position:absolute; left:${lx}px; top:${ly}px; transform:translate(${trX}, ${trY}); font-family:var(--f-mono); font-size:9.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:600; white-space:nowrap;">${esc(n.label)}</div>`;
  }).join('');
  return `
    <div style="position:relative; width:${size}px; height:${size}px; flex:0 0 auto;">
      <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${rMin - 2}" fill="none" stroke="var(--ink-mute)" stroke-width="0.8"/>
        <circle cx="${cx}" cy="${cy}" r="${rMax}" fill="none" stroke="var(--ink-mute)" stroke-width="0.5" stroke-dasharray="1 3"/>
        ${spokes}
      </svg>
      ${labels}
    </div>`;
}

function brewRow(iconName, label, value) {
  return `
    <div style="display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);">
      <span style="width:32px; height:32px; border-radius:8px; background:var(--surface-2); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex:0 0 auto;">${icon(iconName, 16)}</span>
      <span style="flex:1; font-size:13px; color:var(--ink-soft);">${esc(label)}</span>
      <span style="font-family:var(--f-mono); font-size:13px; font-weight:600; color:var(--ink); letter-spacing:-0.01em;">${esc(value)}</span>
    </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   PARSE RECIPE MARKDOWN (упрощённо)
   ════════════════════════════════════════════════════════════════════ */
function parseRecipeRows(md) {
  if (!md) return [];
  // recipe format: "**Type** · key1 value1 · key2 value2 ..."
  const cleaned = md.replace(/\*\*.*?\*\*/g, '').trim();
  const parts = cleaned.split(/\s*·\s*/).filter(Boolean);
  const rows = [];
  const map = [
    [/помол/i, 'grind'],
    [/навеска|доза/i, 'scale'],
    [/выход/i, 'drop'],
    [/время|с\b/i, 'clock'],
    [/температ|°C/i, 'therm'],
  ];
  for (const p of parts) {
    let foundIcon = 'bean';
    let label = '';
    let value = p.trim();
    for (const [re, ic] of map) {
      if (re.test(p)) {
        foundIcon = ic;
        if (/помол/i.test(p))    label = 'Помол';
        else if (/навеска|доза/i.test(p))  label = 'Навеска';
        else if (/выход/i.test(p))         label = 'Выход';
        else if (/температ|°C/i.test(p))   label = 'Темп.';
        else if (/время|\d+\s*с\b/i.test(p)) label = 'Время';
        break;
      }
    }
    if (!label) {
      const m = p.match(/^(.+?)\s+(.+)$/);
      if (m) { label = m[1]; value = m[2]; }
    } else {
      value = p.replace(/^(помол|навеска|доза|выход|время|темп\.?|температура)\s*/i, '').trim();
    }
    rows.push({ icon: foundIcon, label, value });
  }
  return rows;
}

        const statusColor = /доставлен|complete|paid|оплачен/i.test(status) ? 'green' : /отмен|cancel/i.test(status) ? 'amber' : 'ink';
        const itemsCount = Array.isArray(o.items) ? o.items.length : (o.items_count || 0);
        const dt = (o.created_at || '').replace(/T/, ' ').slice(0, 16);
        return `
          <div class="card" style="padding:14px; display:flex; align-items:center; gap:12px;">
            <div style="flex:1; min-width:0;">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="font-family:var(--f-mono); font-size:12px; font-weight:600;">#${esc(o.id || o.order_id || '')}</span>
                <span class="chip chip--${statusColor}" style="height:18px; font-size:10px; padding:0 6px;">${esc(status)}</span>
              </div>
              <div style="margin-top:4px; font-size:13px; color:var(--ink-soft);">${esc(dt)}${itemsCount ? ' · ' + itemsCount + ' поз.' : ''}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-family:var(--f-display); font-weight:800; font-size:16px;">${fmt(o.total || 0)} ₽</div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
})()}

${STATE.isAdmin ? `
<div style="padding:20px 16px 0;">
  <div class="eyebrow" style="margin-bottom:10px; color:var(--copper);">● Админ</div>
  <div class="card" style="overflow:hidden;">
    <div onclick="rb.openAdmin()" style="display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer;">
      <span style="width:36px; height:36px; border-radius:10px; background:var(--copper-soft); color:var(--copper); display:flex; align-items:center; justify-content:center;">${icon('doc')}</span>
      <div style="flex:1;">
        <div style="font-size:14px; font-weight:500;">Управление каталогом</div>
        <div class="meta" style="font-size:9.5px; margin-top:2px;">карантин · pending · заказы</div>
      </div>
      <span style="color:var(--ink-faint);">→</span>
    </div>
  </div>
</div>` : ''}

<div style="padding:24px 16px 0; text-align:center;">
  <div class="meta">Roastberry · v2 · сборка ${STATE.data?.version || 'dev'}</div>
</div>

<div style="height:60px"></div>

${tabBar('profile')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   SCREEN: SEARCH — автокомплит по name + country + variety + tasting
   ════════════════════════════════════════════════════════════════════ */
function hl(text, q) {
  if (!q) return esc(text);
  const t = String(text || '');
  const lc = t.toLowerCase(), qc = q.toLowerCase();
  const idx = lc.indexOf(qc);
  if (idx === -1) return esc(t);
  return esc(t.slice(0, idx))
    + `<span style="background:var(--copper-soft); color:var(--ink); font-weight:700; border-radius:3px; padding:0 2px;">${esc(t.slice(idx, idx + q.length))}</span>`
    + esc(t.slice(idx + q.length));
}
function screenSearch() {
  const q = (STATE.searchQuery || '').trim();
  const all = visibleProducts();
  const results = q ? all.filter(p => {
    const hay = [p.name, p.country, p.variety, p.process, p.farm,
                 ...(p.tasting_notes || [])].join(' ').toLowerCase();
    return hay.includes(q.toLowerCase());
  }) : [];
  // популярные запросы — pre-defined
  const suggestions = ['эфиопия', 'эспрессо', 'фильтр', 'бразилия', 'микролот', 'дрипы', 'каскара', 'niktea'];

  return `
<div style="position:sticky; top:0; z-index:10; background:var(--bg); padding:54px 16px 12px; border-bottom:1px solid var(--line);">
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
    <button class="btn-ghost" style="width:36px; padding:0; justify-content:center" onclick="rb.back()">${icon('back')}</button>
    <h1 style="font-size:22px; flex:1;">Поиск</h1>
  </div>
  <div style="display:flex; align-items:center; gap:10px; background:var(--surface); border:2px solid ${q ? 'var(--ink)' : 'var(--line-strong)'}; border-radius:999px; padding:0 16px; height:48px;">
    <span style="color:${q ? 'var(--ink)' : 'var(--ink-faint)'};">${icon('search')}</span>
    <input id="rb-search-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off"
      placeholder="Поиск по ${all.length} SKU"
      value="${esc(q)}"
      oninput="rb.searchInput(this.value)"
      style="flex:1; border:0; outline:0; background:transparent; font-size:15px; font-family:var(--f-body); color:var(--ink); font-weight:500; min-width:0;" />
    ${q ? `<button onclick="rb.searchInput('')" style="background:transparent; border:0; color:var(--ink-soft); font-size:18px; padding:4px 6px; cursor:pointer;">×</button>` : ''}
  </div>
</div>

${!q ? `
  <div style="padding:20px 16px 0;">
    <div class="eyebrow" style="margin-bottom:12px;">Часто ищут</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      ${suggestions.map(s => `<button class="chip" onclick="rb.searchInput('${esc(s)}')" style="height:34px; padding:0 14px; font-size:13px; cursor:pointer;">${esc(s)}</button>`).join('')}
    </div>
  </div>
` : results.length === 0 ? `
  <div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">
    <div style="font-size:32px; margin-bottom:10px;">🔍</div>
    <div style="font-family:var(--f-display); font-weight:700; font-size:16px;">Ничего не нашли</div>
    <div style="font-size:13px; margin-top:6px;">Попробуй короче или другое слово.</div>
  </div>
` : `
  <div style="padding:14px 16px 8px;">
    <span class="meta">Найдено: ${results.length}</span>
  </div>
  <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; margin:0 16px; border:1px solid var(--line);">
    ${results.slice(0, 50).map(p => {
      const f = (p.fasovka || [])[0] || {};
      const meta = [p.country, p.process, p.variety].filter(Boolean).join(' · ');
      return `
        <div onclick="rb.openProduct('${esc(p.id)}')" style="display:flex; gap:12px; padding:12px 14px; background:var(--surface); align-items:center; cursor:pointer;">
          ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
          <div style="flex:1; min-width:0;">
            <div style="font-family:var(--f-display); font-weight:700; font-size:14px; line-height:1.2; margin-bottom:2px;">${hl(p.name, q)}</div>
            <div class="meta" style="font-size:9.5px; color:var(--ink-faint);">${hl(meta, q)}</div>
          </div>
          <div style="text-align:right;">
            <div style="font-family:var(--f-display); font-weight:800; font-size:14px;">${typeof f.price === 'number' && !f.on_request ? fmt(f.price) : '—'}<span style="font-size:10px; color:var(--ink-faint); margin-left:2px;">${typeof f.price === 'number' && !f.on_request ? '₽' : ''}</span></div>
            <div style="margin-top:2px;" class="meta">${esc(f.size || '')}</div>
          </div>
        </div>
      `;
    }).join('')}
  </div>
`}

<div style="height:120px"></div>
${tabBar('search')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   SCREEN: ADMIN (карантин · pending · заказы)
   ════════════════════════════════════════════════════════════════════ */
function screenAdmin() {
  const tab = STATE.adminTab || 'quarantine';
  const data = STATE.adminPayload;
  const tabs = [
    { id: 'quarantine', label: 'Карантин' },
    { id: 'pending',    label: 'Pending' },
    { id: 'orders',     label: 'Заказы' },
  ];

  let body = '';
  if (!data) {
    body = `<div style="padding:60px 0; text-align:center;"><div class="rb-spinner"></div></div>`;
  } else if (data.error) {
    body = `<div style="padding:40px 24px; color:var(--danger); text-align:center; font-size:14px;">${esc(data.error)}</div>`;
  } else if (tab === 'quarantine') {
    const items = data.items || data.products || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">В карантине: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(p => `
            <div style="background:var(--surface); display:flex; gap:12px; padding:12px; align-items:center;">
              ${productImg(p, '1', 'width:48px; height:48px; flex:0 0 auto; border-radius:8px;')}
              <div style="flex:1; min-width:0;">
                <div style="font-family:var(--f-display); font-weight:700; font-size:13px;">${esc(p.name)}</div>
                <div class="meta" style="font-size:9px; margin-top:2px;">${esc(p.quarantine_reason || p.reason || '—')}</div>
              </div>
              <button onclick="rb.adminQuarantineRelease('${esc(p.id)}')" style="height:30px; padding:0 12px; border-radius:999px; background:var(--green); color:#fff; border:0; font-size:11px; font-weight:600;">Вернуть</button>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Карантин пустой 🟢</div>`;
  } else if (tab === 'pending') {
    const items = data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Требуют разбора: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:1px; background:var(--line); border-radius:var(--r-md); overflow:hidden; border:1px solid var(--line);">
          ${items.slice(0, 100).map(it => `
            <div style="background:var(--surface); padding:12px;">
              <div style="font-size:13px; font-weight:500;">${esc(it.name)}</div>
              <div class="meta" style="font-size:9px; margin-top:4px;">qty: ${it.qty || 0}${it.notes ? ' · ' + esc(it.notes) : ''}</div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Pending пустой 🟢</div>`;
  } else if (tab === 'orders') {
    const items = data.orders || data.items || [];
    body = items.length ? `
      <div style="padding:0 16px 24px;">
        <div class="meta" style="margin-bottom:12px;">Заказов: ${items.length}</div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${items.slice(0, 50).map(o => `
            <div class="card" style="padding:12px;">
              <div style="display:flex; justify-content:space-between; align-items:baseline;">
                <span style="font-family:var(--f-mono); font-size:12px; font-weight:700;">#${esc(o.id)}</span>
                <span class="meta">${esc(o.status || '')}</span>
              </div>
              <div style="margin-top:4px; font-size:13px;">${esc(o.client_name || o.name || '—')}</div>
              <div class="meta" style="font-size:9.5px; margin-top:2px;">${esc(o.created_at || '')} · ${fmt(o.total || 0)} ₽</div>
            </div>`).join('')}
        </div>
      </div>` : `<div style="padding:60px 24px; text-align:center; color:var(--ink-soft);">Заказов нет</div>`;
  }

  return `
${appHeader({ back: true, title: 'Админ' })}
<div style="padding:16px 16px 12px;">
  <div style="display:flex; gap:6px; padding:3px; background:var(--surface-2); border-radius:999px;">
    ${tabs.map(t => `
      <button onclick="rb.setAdminTab('${t.id}')" style="flex:1; height:34px; border:0; border-radius:999px; background:${tab === t.id ? 'var(--ink)' : 'transparent'}; color:${tab === t.id ? 'var(--bg)' : 'var(--ink-soft)'}; font-family:var(--f-body); font-weight:600; font-size:12px; cursor:pointer;">${t.label}</button>
    `).join('')}
  </div>
</div>
${body}
<div style="height:60px"></div>
${tabBar('profile')}
`;
}

/* ════════════════════════════════════════════════════════════════════
   ACTIONS / NAVIGATION
   ════════════════════════════════════════════════════════════════════ */
const rb = {
  go(screen, params) {
    if (STATE.screen !== screen) STATE.history.push(STATE.screen);
    STATE.screen = screen;
    if (params) {
      if ('cat' in params) STATE.cat = params.cat || null;
      if ('subcat' in params) STATE.subcat = params.subcat || null;
    }
    haptic();
    window.scrollTo(0, 0);
    render();
    if (screen === 'profile' && STATE.myOrders === undefined) rb.loadMyOrders();
  },
  back() {
    const prev = STATE.history.pop();
    if (prev) { STATE.screen = prev; haptic(); window.scrollTo(0, 0); render(); }
    else { rb.go('home'); }
  },
  openProduct(id) {
    STATE.history.push(STATE.screen);
    STATE.screen = 'product';
    STATE.productId = id;
    STATE.productFasovka = null;
    STATE.productKg = 1;
    haptic();
    window.scrollTo(0, 0);
    render();
  },
  setFasovka(size) {
    STATE.productFasovka = size;
    haptic('light');
    render();
  },
  setKg(n) {
    STATE.productKg = Math.max(1, Math.min(999, n));
    haptic('light');
    render();
  },
  cartAdd(id, fasovka, qty) {
    const p = findProduct(id);
    if (!p) return;
    if (!fasovka) {
      const f = (p.fasovka || [])[0];
      fasovka = f?.size || 'уп.';
    }
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (ex) ex.qty += (qty || 1);
    else STATE.cart.push({ id, fasovka, qty: qty || 1 });
    saveLocal();
    haptic('light');
    toast(`+ ${p.name}`);
    render();
  },
  cartChange(id, fasovka, delta) {
    const ex = STATE.cart.find(x => x.id === id && x.fasovka === fasovka);
    if (!ex) return;
    ex.qty += delta;
    if (ex.qty <= 0) STATE.cart = STATE.cart.filter(x => !(x.id === id && x.fasovka === fasovka));
    saveLocal();
    haptic('light');
    render();
  },
  cartClear() {
    if (!confirm('Очистить корзину?')) return;
    STATE.cart = [];
    saveLocal();
    haptic('warning');
    render();
  },
  searchInput(v) {
    STATE.searchQuery = v || '';
    if (STATE.screen !== 'search') STATE.screen = 'search';
    render();
    const inp = document.getElementById('rb-search-input');
    if (inp) {
      inp.focus();
      const pos = inp.value.length;
      try { inp.setSelectionRange(pos, pos); } catch (e) {}
    }
  },
  async checkout() {
    haptic('success');
    const items = STATE.cart.map(i => {
      const p = findProduct(i.id); if (!p) return null;
      const f = (p.fasovka || []).find(x => x.size === i.fasovka) || (p.fasovka || [])[0] || {};
      return { id: i.id, name: p.name, fasovka: i.fasovka, qty: i.qty,
               price: typeof f.price === 'number' ? f.price : null,
               on_request: !!f.on_request };
    }).filter(Boolean);
    if (!items.length) { toast('Корзина пустая'); return; }
    const totalKg = cartWeightKg();
    const subtotal = cartSubtotal();
    const tier = tierFor(totalKg);
    const total = subtotal * (1 - tier);
    const payload = { items, total_kg: totalKg, subtotal, discount_pct: tier, total };

    try {
      const r = await fetch('/tma/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(payload),
      });
      if (r.ok) {
        const j = await r.json();
        STATE.cart = []; saveLocal();
        haptic('success');
        toast('Заказ оформлен. №' + (j.order_id || ''));
        setTimeout(() => rb.go('profile'), 1200);
      } else {
        haptic('error');
        toast('Ошибка: ' + r.status);
      }
    } catch (e) {
      haptic('error');
      toast('Сеть недоступна');
    }
  },
  /* ────────── ADMIN ────────── */
  async loadMyOrders() {
    if (!IS_TG) { STATE.myOrders = []; return; }
    try {
      const r = await fetch('/tma/api/my_orders?limit=10', { headers: authHeaders() });
      if (!r.ok) { STATE.myOrders = []; return; }
      const j = await r.json();
      STATE.myOrders = Array.isArray(j) ? j : (j.orders || j.items || []);
    } catch (e) { STATE.myOrders = []; }
    render();
  },
  async openAdmin() {
    if (!STATE.isAdmin) { toast('Только для админов'); return; }
    STATE.history.push(STATE.screen);
    STATE.screen = 'admin';
    STATE.adminTab = STATE.adminTab || 'quarantine';
    STATE.adminPayload = null;
    render();
    await rb.loadAdmin();
  },
  setAdminTab(tab) {
    STATE.adminTab = tab;
    STATE.adminPayload = null;
    render();
    rb.loadAdmin();
  },
  async loadAdmin() {
    const tab = STATE.adminTab;
    try {
      let url = '/tma/api/admin/' + (tab === 'pending' ? 'pending' : tab === 'orders' ? 'orders' : 'quarantine');
      const r = await fetch(url, { headers: authHeaders() });
      STATE.adminPayload = r.ok ? await r.json() : { error: 'HTTP ' + r.status };
    } catch (e) {
      STATE.adminPayload = { error: String(e) };
    }
    render();
  },
  async adminQuarantineRelease(id) {
    if (!confirm('Вернуть из карантина: ' + id + '?')) return;
    try {
      const r = await fetch('/tma/api/admin/product/' + encodeURIComponent(id), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ quarantined: false }),
      });
      if (r.ok) { haptic('success'); toast('Возвращён'); rb.loadAdmin(); }
      else { haptic('error'); toast('Ошибка: ' + r.status); }
    } catch (e) { haptic('error'); toast('Сеть недоступна'); }
  },
};
window.rb = rb;

/* ════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════ */
function render() {
  const root = document.getElementById('root');
  let body = '';
  switch (STATE.screen) {
    case 'home':    body = screenHome(); break;
    case 'catalog': body = screenCatalog(); break;
    case 'product': body = screenProduct(); break;
    case 'cart':    body = screenCart(); break;
    case 'profile': body = screenProfile(); break;
    case 'search':  body = screenSearch(); break;
    case 'admin':   body = screenAdmin(); break;
    default: body = screenHome();
  }
  root.innerHTML = `<div class="rb${IS_DARK ? ' rb--dark' : ''}">${body}</div>`;
}

/* ════════════════════════════════════════════════════════════════════
   ADMIN CHECK
   ════════════════════════════════════════════════════════════════════ */
async function checkAdmin() {
  if (!IS_TG) return;
  try {
    const r = await fetch('/tma/api/admin/check', { headers: authHeaders() });
    const j = await r.json();
    STATE.isAdmin = !!j.is_admin;
  } catch (e) { STATE.isAdmin = false; }
}

/* ════════════════════════════════════════════════════════════════════
   INIT
   ════════════════════════════════════════════════════════════════════ */
async function init() {
  loadLocal();
  try {
    const r = await fetch('/tma/products.json?v=' + Date.now(), { cache: 'no-store' });
    STATE.data = await r.json();
  } catch (e) {
    document.getElementById('root').innerHTML = `<div style="padding:80px 24px; text-align:center;"><h2>Каталог недоступен</h2><p style="color:var(--ink-soft); margin-top:8px;">${esc(String(e))}</p></div>`;
    return;
  }
  await checkAdmin();
  render();
  if ('serviceWorker' in navigator && !(tg && tg.initData)) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();
</script>

</body>
</html>
