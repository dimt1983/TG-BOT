<!doctype html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bakunin Drinks · Линейка 2026</title>
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: #f2edd7; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f2edd7;
      color: #151515;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .deck {
      width: 100%;
      min-height: 100vh;
      background: #f2edd7;
      scroll-snap-type: y proximity;
    }
    .slide {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      scroll-snap-align: start;
    }
    .slide img {
      display: block;
      width: min(100%, calc((100svh - 24px) * 16 / 9));
      max-height: calc(100svh - 24px);
      height: auto;
      object-fit: contain;
      background: #f2edd7;
      border-radius: 6px;
      box-shadow: 0 16px 44px rgba(39, 31, 18, 0.12);
    }
    .nav {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(242, 237, 215, 0.86);
      box-shadow: 0 8px 28px rgba(39, 31, 18, 0.12);
      backdrop-filter: blur(10px);
    }
    .nav a {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      color: #151515;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(21, 21, 21, 0.12);
      background: rgba(255, 255, 255, 0.36);
    }
    .nav a:focus-visible {
      outline: 2px solid #a0192e;
      outline-offset: 2px;
    }
    @media (max-width: 700px) {
      .deck { scroll-snap-type: none; }
      .slide {
        min-height: auto;
        padding: 8px;
        scroll-snap-align: none;
      }
      .slide img {
        width: 100%;
        max-height: none;
        border-radius: 4px;
        box-shadow: none;
      }
      .nav {
        display: none;
      }
    }
    @media print {
      .nav { display: none; }
      .slide { min-height: auto; padding: 0; page-break-after: always; }
      .slide img { width: 100%; max-height: none; box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
