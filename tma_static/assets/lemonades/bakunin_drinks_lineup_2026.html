r: var(--ink);\n}\n\n/* every slide ----------------------------------------------- */\n.slide {\n  width: 1920px; height: 1080px;\n  background: var(--cream);\n  color: var(--ink);\n  position: relative;\n  overflow: hidden;\n  font-family: var(--body);\n}\n\n.slide.paper   { background: var(--paper); }\n.slide.cream2  { background: var(--cream-2); }\n.slide.dark    { background: #1A1A1A; color: var(--cream); }\n\n/* helpers */\n.eyebrow {\n  font-family: var(--display);\n  font-weight: 700;\n  font-size: 24px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--ink-2);\n  display: inline-flex; align-items: center; gap: 14px;\n}\n.eyebrow::before {\n  content: \"\"; display: inline-block; width: 36px; height: 2px; background: currentColor;\n}\n.eyebrow.no-line::before { display: none; }\n\n.h1 { font-family: var(--display); font-weight: 800; font-size: 168px; line-height: 0.92; letter-spacing: -0.04em; }\n.h2 { font-family: var(--display); font-weight: 800; font-size: 116px; line-height: 0.94; letter-spacing: -0.035em; }\n.h3 { font-family: var(--display); font-weight: 800; font-size: 76px;  line-height: 1.0;  letter-spacing: -0.03em; }\n.h4 { font-family: var(--display); font-weight: 700; font-size: 46px;  line-height: 1.05; letter-spacing: -0.02em; }\n.body-lg { font-size: 32px; line-height: 1.35; color: var(--ink-2); font-weight: 400; }\n.body { font-size: 24px; line-height: 1.45; color: var(--ink-2); }\n.mono { font-family: 'Onest', monospace; font-variant-numeric: tabular-nums; }\n\n/* mockups now use transparent PNGs — no blend mode needed */\n\n/* flavor dot */\n.dot { width: 22px; height: 22px; border-radius: 999px; display: inline-block; flex-shrink: 0; }\n.dot.lg { width: 40px; height: 40px; }\n.dot.xl { width: 64px; height: 64px; }\n\n/* pill chip */\n.chip {\n  display: inline-flex; align-items: center; gap: 12px;\n  padding: 14px 28px;\n  border-radius: var(--r-pill);\n  background: rgba(26,26,26,0.06);\n  font-size: 26px; font-weight: 500;\n  color: var(--ink-2);\n}\n.chip.solid { background: var(--ink); color: var(--cream); }\n.chip.outline { background: transparent; box-shadow: inset 0 0 0 1.5px var(--hair); }\n\n/* shared slide chrome */\n.slide-chrome {\n  position: absolute; inset: 0;\n  padding: 80px 96px;\n  display: flex; flex-direction: column;\n}\n.slide-num {\n  position: absolute; bottom: 56px; right: 96px;\n  font-family: var(--display); font-weight: 600;\n  font-size: 20px; letter-spacing: 0.15em;\n  color: var(--muted);\n}\n.slide-brand {\n  position: absolute; bottom: 56px; left: 96px;\n  font-family: var(--display); font-weight: 800;\n  font-size: 20px; letter-spacing: -0.01em;\n  color: var(--muted);\n}\n\n/* ============ SLIDE 1 — COVER ============ */\n.cover-grid {\n  position: absolute; inset: 0;\n  display: grid; grid-template-columns: 1.1fr 1fr;\n}\n.cover-left {\n  padding: 100px 0 100px 110px;\n  display: flex; flex-direction: column; justify-content: space-between;\n  position: relative; z-index: 2;\n}\n.cover-right {\n  position: relative; overflow: hidden;\n  background: var(--cream);\n}\n.cover-bg-type {\n  position: absolute;\n  top: 50%; left: 50%;\n  transform: translate(-50%, -50%) rotate(-90deg);\n  pointer-events: none; user-select: none;\n  font-family: var(--display);\n  font-weight: 800;\n  font-size: 240px; line-height: 0.85; letter-spacing: -0.05em;\n  color: var(--cream-2);\n  white-space: nowrap;\n}\n.cover-cans-row {\n  position: absolute; inset: 0;\n  display: flex; align-items: center; justify-content: center;\n  gap: 0;\n  padding: 60px 20px;\n}\n.cover-cans-row .can-wrap {\n  display: flex; align-items: center; justify-content: center;\n}\n.cover-cans-row .can-wrap:nth-child(1) { transform: translateY(50px)  rotate(-3deg); margin-right: -42px; z-index: 1; }\n.cover-cans-row .can-wrap:nth-child(2) { transform: translateY(-25px) rotate( 2deg); margin-right: -42px; z-index: 3; }\n.cover-cans-row .can-wrap:nth-child(3) { transform: translateY(15px)  rotate(-1deg); margin-right: -42px; z-index: 5; }\n.cover-cans-row .can-wrap:nth-child(4) { transform: translateY(-40px) rotate( 3deg); margin-right: -42px; z-index: 4; }\n.cover-cans-row .can-wrap:nth-child(5) { transform: translateY(30px)  rotate(-2deg); z-index: 2; }\n\n.cover-title {\n  font-family: var(--display); font-weight: 800;\n  font-size: 184px; line-height: 0.88;\n  letter-spacing: -0.045em;\n}\n.cover-title em {\n  font-style: normal; font-weight: 400;\n  font-family: 'Onest', serif;\n}\n.cover-meta {\n  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;\n}\n\n/* ============ SLIDE — О БРЕНДЕ ============ */\n.about-grid {\n  padding: 80px 110px;\n  display: grid; grid-template-columns: 1fr 1.2fr; gap: 80px;\n  height: 100%;\n}\n.about-left {\n  display: flex; flex-direction: column;\n}\n.about-left h2 { margin: 0; }\n.about-left p { margin: 28px 0 0; max-width: 540px; font-size: 24px; line-height: 1.4; }\n.about-stats {\n  display: grid; grid-template-columns: repeat(4, 1fr);\n  gap: 24px;\n  margin-top: auto;\n  padding-top: 56px;\n}\n.about-stat .n { font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.04em; }\n.about-stat .l { font-size: 24px; color: var(--ink-2); margin-top: 10px; line-height: 1.3; letter-spacing: 0; }\n\n.about-cats {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;\n  align-content: start;\n}\n.cat-card {\n  border-radius: 24px; padding: 32px;\n  background: var(--paper);\n  box-shadow: inset 0 0 0 1px var(--hair);\n  display: flex; flex-direction: column; gap: 18px;\n  min-height: 220px;\n}\n.cat-card.tropical  { background: #F6E5C9; }\n.cat-card.herbs     { background: #DCEEDE; }\n.cat-card.tonics    { background: #D8E6F0; }\n.cat-card.cola      { background: #E8C9C5; }\n.cat-card .num { font-family: var(--display); font-weight: 800; font-size: 56px; letter-spacing: -0.03em; line-height: 1; }\n.cat-card .name { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: -0.01em; }\n.cat-card .items { font-size: 24px; color: var(--ink-2); line-height: 1.35; margin-top: auto; }\n\n/* ============ SLIDE — ЛИНЕЙКА (14 cans grid) ============ */\n.lineup-head {\n  padding: 56px 96px 18px;\n  display: flex; align-items: flex-end; justify-content: space-between; gap: 40px;\n}\n.lineup-head .h2 { font-size: 92px; }\n.lineup-grid {\n  padding: 12px 80px 60px;\n  display: grid; grid-template-columns: repeat(7, 1fr);\n  gap: 14px;\n}\n.lineup-card {\n  border-radius: 18px;\n  background: var(--paper);\n  box-shadow: inset 0 0 0 1px var(--hair);\n  padding: 16px 12px 18px;\n  display: flex; flex-direction: column; align-items: center; text-align: center;\n  position: relative;\n  height: 380px;\n  gap: 0;\n}\n.lineup-card [data-can] { margin: 18px 0 14px; }\n.lineup-card .nm {\n  font-family: var(--display); font-weight: 700;\n  font-size: 15px; letter-spacing: -0.01em; line-height: 1.15;\n  text-transform: uppercase;\n  margin-top: auto;\n}\n.lineup-card .dot { position: absolute; top: 14px; left: 14px; width: 14px; height: 14px; }\n.lineup-card .tag {\n  position: absolute; top: 12px; right: 14px;\n  font-size: 10px; letter-spacing: 0.08em;\n  color: var(--muted); text-transform: uppercase; font-weight: 600;\n}\n\n/* ============ FEATURED slides (full-bleed flavor) ============ */\n.feat {\n  position: absolute; inset: 0;\n  display: grid; grid-template-columns: 1.15fr 1fr;\n}\n.feat-text {\n  padding: 100px 90px;\n  display: flex; flex-direction: column; justify-content: space-between;\n  background: var(--cream);\n}\n.feat-art {\n  position: relative; overflow: hidden;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--cream);\n}\n.feat-bg-type {\n  position: absolute;\n  top: 50%; left: 50%;\n  font-family: var(--display);\n  font-weight: 800; line-height: 0.85; letter-spacing: -0.05em;\n  text-align: center;\n  pointer-events: none; user-select: none;\n  z-index: 0;\n  white-space: nowrap;\n}\n.feat-art > * { position: relative; z-index: 1; }\n.feat .ingredients {\n  display: flex; flex-wrap: wrap; gap: 10px;\n  margin-top: 28px;\n}\n.feat .ingredients .chip { font-size: 20px; padding: 10px 20px; }\n\n/* ============ PRICE TABLE ============ */\n.price-head {\n  padding: 64px 110px 16px;\n}\n.price-head .h2 { font-size: 84px; }\n.price-table {\n  padding: 0 110px;\n  display: grid; gap: 10px;\n}\n.price-row {\n  display: grid;\n  grid-template-columns: 60px 1fr 220px 220px 1fr;\n  align-items: center;\n  gap: 24px;\n  padding: 16px 30px;\n  border-radius: 999px;\n  background: var(--paper);\n  box-shadow: inset 0 0 0 1px var(--hair);\n}\n.price-row.head {\n  background: transparent; box-shadow: none;\n  padding: 0 30px;\n  font-size: 14px; letter-spacing: 0.15em;\n  text-transform: uppercase; color: var(--muted); font-weight: 600;\n}\n.price-row .nm { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -0.01em; text-transform: uppercase; }\n.price-row .qty { font-size: 22px; color: var(--ink-2); }\n.price-row .pr { font-family: var(--display); font-weight: 700; font-size: 24px; }\n.price-row .nt { font-size: 18px; color: var(--muted); }\n.price-row .nt.rotation { color: var(--c-grapefruit); font-weight: 600; }\n.price-row .nt.season   { color: var(--c-portgleg); font-weight: 600; }\n\n/* ============ ORDER SUMMARY ============ */\n.order {\n  padding: 90px 110px;\n  display: grid; grid-template-columns: 1.1fr 1fr; gap: 80px; height: 100%;\n}\n.order-left { display: flex; flex-direction: column; justify-content: space-between; }\n.bignum {\n  font-family: var(--display); font-weight: 800;\n  font-size: 280px; line-height: 0.85; letter-spacing: -0.05em;\n}\n.bignum-row { display: flex; align-items: baseline; gap: 30px; }\n.order-right {\n  display: grid; grid-template-rows: auto auto 1fr; gap: 20px;\n}\n.order-card {\n  border-radius: 28px;\n  padding: 36px 40px;\n  background: var(--paper);\n  box-shadow: inset 0 0 0 1px var(--hair);\n}\n.order-card .lbl { font-size: 18px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }\n.order-card .val { font-family: var(--display); font-weight: 700; font-size: 56px; line-height: 1; letter-spacing: -0.02em; margin-top: 14px; }\n.order-card .sub { font-size: 22px; color: var(--ink-2); margin-top: 8px; }\n.order-card.dark { background: var(--ink); color: var(--cream); box-shadow: none; }\n.order-card.dark .lbl { color: rgba(242,237,215,0.6); }\n\n.legend {\n  display: flex; gap: 26px; flex-wrap: wrap;\n  margin-top: 28px;\n}\n.legend-item { display: flex; align-items: center; gap: 10px; font-size: 20px; color: var(--ink-2); }\n.legend-item .swatch { width: 16px; height: 16px; border-radius: 999px; }\n\n/* ============ CLOSING ============ */\n.closing {\n  display: grid; grid-template-rows: 1fr auto; height: 100%;\n  padding: 90px 110px;\n}\n.closing-top { display: flex; flex-direction: column; justify-content: center; }\n.closing .h1 { font-size: 200px; }\n.closing-bot { display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }\n.contacts { display: flex; gap: 60px; flex-wrap: wrap; }\n.contact { display: flex; flex-direction: column; gap: 6px; }\n.contact .lbl { font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 600; }\n.contact .val { font-family: var(--display); font-weight: 700; font-size: 32px; letter-spacing: -0.015em; }\n\n/* misc */\n.row { display: flex; align-items: center; gap: 16px; }\n.col { display: flex; flex-direction: column; }\n.spacer { flex: 1; }\n<\u002Fstyle>\n<script src=\"ccd19931-dec7-405a-bc9c-a82b5be533df\"><\u002Fscript>\n<script src=\"64cdf973-d492-4f55-beb5-34cbc47f0be4\" defer=\"\"><\u002Fscript>\n\n\n<\u002Fhead>\n<body>\n\n<deck-stage>\n\n  <!-- =================== SLIDE 1 · COVER =================== -->\n  <section data-screen-label=\"01 Обложка\">\n    <div class=\"slide\">\n      <div class=\"cover-grid\">\n        <!-- LEFT -->\n        <div class=\"cover-left\">\n          <div class=\"row\" style=\"gap:14px;\">\n            <span class=\"eyebrow no-line\">bakunin · st.&nbsp;petersburg · 2023<\u002Fspan>\n          <\u002Fdiv>\n\n          <div>\n            <div class=\"eyebrow\" style=\"color: var(--c-portgleg);\">Линейка · весна 2026<\u002Fdiv>\n            <h1 class=\"cover-title\" style=\"margin: 22px 0 0;\">\n              Лимонады,<br>\n              тоники<br>\n              и кола —<br>\n              <em style=\"color: var(--c-portgleg);\">на травах.<\u002Fem>\n            <\u002Fh1>\n          <\u002Fdiv>\n\n          <div class=\"cover-meta\">\n            <span class=\"chip solid\">14 вкусов<\u002Fspan>\n            <span class=\"chip outline\">4 категории<\u002Fspan>\n            <span class=\"chip outline\">0,33 л<\u002Fspan>\n            <span class=\"chip outline\">125 ₽<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- RIGHT — cans on cream -->\n        <div class=\"cover-right\">\n          <div class=\"cover-bg-type\">bakunin<\u002Fdiv>\n          <div class=\"cover-cans-row\">\n            <div class=\"can-wrap\"><div data-can=\"\" data-size=\"200\" data-mockup=\"cola\" data-name=\"ORGANIC COLA\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"can-wrap\"><div data-can=\"\" data-size=\"200\" data-mockup=\"tonic\" data-name=\"ТОНИК\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"can-wrap\"><div data-can=\"\" data-size=\"200\" data-mockup=\"gleg\" data-name=\"ПОРТОВЫЙ ГЛЁГ\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"can-wrap\"><div data-can=\"\" data-size=\"200\" data-mockup=\"yuzu\" data-name=\"ТОНИК ЮДЗУ\"><\u002Fdiv><\u002Fdiv>\n            <div class=\"can-wrap\"><div data-can=\"\" data-size=\"200\" data-mockup=\"berries\" data-name=\"ЯГОДЫ И ЁЛКИ\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- == erbs\">\n            <div class=\"num\" style=\"color: var(--c-berries);\">06<\u002Fdiv>\n            <div class=\"name\">Травы<br>и ягоды<\u002Fdiv>\n            <div class=\"items\">Гринкель Вовель · Груша и жасмин · Груша, розмарин и&nbsp;перец · Ежевика и каркаде · Иванчай и мята · Ягоды и ёлки<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cat-card tonics\">\n            <div class=\"num\" style=\"color: var(--c-tonic); -webkit-text-stroke: 1.5px var(--ink); color: transparent;\">02<\u002Fdiv>\n            <div class=\"name\">Тоники<br>и классика<\u002Fdiv>\n            <div class=\"items\">Тоник · Тоник иланг-иланг<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"cat-card cola\">\n            <div class=\"num\" style=\"color: var(--c-cola);\">02<\u002Fdiv>\n            <div class=\"name\">Сезон<br>и кола<\u002Fdiv>\n            <div class=\"items\">Organic Cola · Портовый глёг (сезонный)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"slide-num\">02 / 09<\u002Fdiv>\n      <div class=\"slide-brand\">bakunin drinks · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- =================== SLIDE 3 · ЛИНЕЙКА =================== -->\n  <section data-screen-label=\"03 Линейка\">\n    <div class=\"slide\">\n      <div class=\"lineup-head\">\n        <div>\n          <div class=\"eyebrow\">Линейка · 14 вкусов<\u002Fdiv>\n          <h2 class=\"h2\" style=\"margin: 22px 0 0;\">Вся линейка.<\u002Fh2>\n        <\u002Fdiv>\n        <div class=\"legend\" style=\"margin: 0;\">\n          <div class=\"legend-item\"><span class=\"swatch\" style=\"background: var(--c-cola);\"><\u002Fspan>постоянный ассортимент<\u002Fdiv>\n          <div class=\"legend-item\"><span class=\"swatch\" style=\"background: var(--c-grapefruit);\"><\u002Fspan>ротация<\u002Fdiv>\n          <div class=\"legend-item\"><span class=\"swatch\" style=\"background: var(--c-portgleg);\"><\u002Fspan>сезонный<\u002Fdiv>\n        <\u002Fdiv
