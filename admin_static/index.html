<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roastberry - Админка</title>
<meta name="theme-color" content="#FAF7F2" />
<link rel="stylesheet" href="/tma/v2/tokens.css?v=admin-2" />
<style>
  /* ── reset / base ── */
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background:#FAF7F2; }
  .rb { min-height:100vh; height:100vh; display:flex; flex-direction:column; font-size:14px; line-height:1.45; letter-spacing:0; }
  button { font-family:inherit; cursor:pointer; color:inherit; }
  input { font-family:inherit; }
  .num { font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; white-space:nowrap; }
  .ico { width:18px; height:18px; flex:0 0 auto; display:inline-block; vertical-align:middle; }
  .ico svg { width:100%; height:100%; display:block; }
  :focus-visible { outline:2px solid var(--coffee); outline-offset:2px; border-radius:4px; }

  /* ── topbar ── */
  .topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:18px;
            padding:0 18px; height:60px; flex:0 0 60px;
            background:color-mix(in oklab, var(--bg) 90%, transparent);
            border-bottom:1px solid var(--line); backdrop-filter:blur(16px) saturate(150%); }
  .brand { display:flex; align-items:center; gap:11px; min-width:0; }
  .brand-mark { width:30px; height:30px; color:var(--coffee); flex:0 0 auto; }
  .brand-txt { font-family:var(--f-display); font-weight:900; font-size:18px; letter-spacing:-0.02em; line-height:1; white-space:nowrap; }
  .brand-txt small { display:block; font:700 8.5px/1 var(--f-mono); letter-spacing:0.16em; color:var(--ink-soft); text-transform:uppercase; margin-top:4px; }

  .tabs { display:flex; gap:3px; margin-left:6px; }
  .tab { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border:0; border-radius:var(--r-pill);
         background:transparent; color:var(--ink-soft); font-weight:600; font-size:13px; transition:background .15s, color .15s; }
  .tab:hover { background:var(--surface-2); color:var(--ink); }
  .tab.active { background:var(--ink); color:var(--bg); }
  .tab .ico { width:16px; height:16px; }
  .tab .badge { font:700 11px/1 var(--f-mono); opacity:.7; }

  .spacer { flex:1; }
  .who { display:flex; align-items:center; gap:9px; font-size:13px; color:var(--ink-soft); min-width:0; }
  .who img { width:28px; height:28px; border-radius:50%; object-fit:cover; border:1px solid var(--line-strong); }
  .who .name { max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .iconbtn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:var(--r-pill);
             background:transparent; border:1px solid transparent; color:var(--ink-soft); }
  .iconbtn:hover { background:var(--surface-2); color:var(--ink); }
  .iconbtn .ico { width:18px; height:18px; }

  /* ── main / views ── */
  .main { flex:1; min-height:0; }
  .view { height:100%; display:none; }
  .view.active { display:block; }

  /* ── master-detail ── */
  .md { display:grid; grid-template-columns:1fr; height:100%; min-height:0; }
  .md.has-detail { grid-template-columns:minmax(0,1fr) 400px; }
  .md-list { min-width:0; min-height:0; overflow:auto; }
  .md-detail { display:none; border-left:1px solid var(--line); background:var(--bg-2); overflow:auto; min-height:0; }
  .md.has-detail .md-detail { display:block; animation:slideIn .2s cubic-bezier(.16,1,.3,1); }
  @keyframes slideIn { from { opacity:0; transform:translateX(10px); } to { opacity:1; transform:none; } }

  /* ── toolbar ── */
  .toolbar { position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:8px; flex-wrap:wrap;
             padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  .fchip { display:inline-flex; align-items:center; gap:7px; height:30px; padding:0 13px; border:1px solid var(--line-strong);
           border-radius:var(--r-pill); background:var(--surface); color:var(--ink); font-weight:600; font-size:12.5px; transition:.12s; }
  .fchip:hover { border-color:var(--ink-faint); }
  .fchip.active { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .fchip .n { font-family:var(--f-mono); font-variant-numeric:tabular-nums; opacity:.6; }
  .fchip.active .n { opacity:.8; }
  .search { display:flex; align-items:center; gap:8px; height:32px; min-width:200px; flex:1; max-width:320px;
            padding:0 11px; border:1px solid var(--line-strong); border-radius:var(--r); background:var(--surface); }
  .search:focus-within { border-color:var(--coffee); }
  .search .ico { width:15px; height:15px; color:var(--ink-faint); }
  .search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font-size:13px; }
  .count { font-family:var(--f-mono); font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-faint); }

  /* ── table ── */
  table.grid { width:100%; border-collapse:collapse; }
  table.grid th { position:sticky; top:55px; z-index:4; text-align:left; background:var(--bg);
                  font:700 10px/1 var(--f-mono); letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-faint);
                  padding:10px 16px; border-bottom:1px solid var(--line); white-space:nowrap; user-select:none; }
  table.grid th.sortable { cursor:pointer; }
  table.grid th.sortable:hover { color:var(--ink); }
  table.grid th .th { display:inline-flex; align-items:center; gap:5px; }
  table.grid th .caret { width:11px; height:11px; opacity:0; color:var(--coffee); }
  table.grid th[aria-sort] .caret { opacity:1; }
  table.grid th[aria-sort="ascending"] .caret { transform:rotate(180deg); }
  table.grid td { padding:11px 16px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tr.row { cursor:pointer; transition:background .1s; }
  tr.row:hover td { background:var(--surface-2); }
  tr.row.sel td { background:var(--coffee-soft); box-shadow:inset 3px 0 0 var(--coffee); }
  tr.row:focus-visible { outline:none; }
  tr.row:focus-visible td { background:var(--surface-2); box-shadow:inset 3px 0 0 var(--coffee); }
  .muted { color:var(--ink-soft); }
  .faint { color:var(--ink-faint); }
  .right { text-align:right; }
  .strong { font-weight:700; }
  .ellip { max-width:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sub { font-size:11px; color:var(--ink-faint); margin-top:2px; }

  /* ── status pill ── */
  .st { display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:var(--r-pill);
        font:600 11.5px/1 var(--f-body); white-space:nowrap; }
  .st::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .st-new       { color:#2B6CB0; background:rgba(43,108,176,.13); }
  .st-paid, .st-confirmed { color:#3D5232; background:var(--green-soft); }
  .st-shipped   { color:#8B5224; background:var(--amber-soft); }
  .st-done      { color:var(--ink-soft); background:var(--surface-2); }
  .st-cancelled { color:var(--danger); background:rgba(181,75,61,.13); }
  .rb--dark .st-new { color:#7FB0E6; }
  .rb--dark .st-paid, .rb--dark .st-confirmed { color:#B4C8A0; }
  .rb--dark .st-shipped { color:#E4B07D; }
  .rb--dark .st-cancelled { color:#E08A7D; }

  /* ── detail panel ── */
  .dp { padding:0 16px 18px; }
  .dp-top { position:sticky; top:0; z-index:5; background:var(--bg-2); margin:0 -16px 14px; padding:15px 16px 13px; border-bottom:1px solid var(--line); }
  .dp-actions { display:flex; gap:7px; flex-wrap:wrap; margin-top:12px; }
  .dp-actions .act { height:34px; padding:0 13px; font-size:12.5px; }
  .dp-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .dp h2 { font-family:var(--f-display); font-size:21px; font-weight:900; letter-spacing:-0.02em; margin:0; }
  .dp .dp-sub { color:var(--ink-soft); font-size:12px; margin-top:5px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md); padding:15px; margin-bottom:13px; box-shadow:var(--sh-1); }
  .sec-title { font:800 10.5px/1 var(--f-display); letter-spacing:0.07em; text-transform:uppercase; color:var(--ink-soft); margin:0 0 11px; }
  .kv { display:grid; grid-template-columns:90px 1fr; gap:9px 12px; font-size:13px; }
  .kv dt { color:var(--ink-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; align-self:center; }
  .kv dd { margin:0; word-break:break-word; }
  .items { width:100%; border-collapse:collapse; font-size:13px; }
  .items td { padding:8px 0; border-bottom:1px solid var(--line); }
  .items tr:last-child td { border-bottom:0; }
  .items .q { color:var(--ink-soft); }
  .total-row { display:flex; justify-content:space-between; align-items:baseline; margin-top:13px; padding-top:13px; border-top:2px solid var(--ink); }
  .total-row b { font-family:var(--f-display); font-size:22px; font-variant-numeric:tabular-nums; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; }
  .act { display:inline-flex; align-items:center; gap:7px; height:38px; padding:0 15px; border:1px solid var(--line-strong);
         border-radius:var(--r-pill); background:var(--surface); color:var(--ink); font-weight:600; font-size:13px; transition:.12s; }
  .act:hover { background:var(--surface-2); }
  .act:active { transform:translateY(1px); }
  .act.primary { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .act.primary:hover { background:var(--coffee-deep); }
  .act.danger { color:var(--danger); border-color:rgba(181,75,61,.3); }
  .act.danger:hover { background:rgba(181,75,61,.1); }
  .act[disabled] { opacity:.4; pointer-events:none; }

  .orow { cursor:pointer; }
  .orow:hover td { color:var(--coffee-deep); }

  /* ── states ── */
  .state { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:13px; min-height:340px;
           text-align:center; color:var(--ink-soft); padding:40px 24px; }
  .state .ico { width:34px; height:34px; color:var(--ink-mute); }
  .state h3 { font-family:var(--f-display); font-size:17px; color:var(--ink); margin:0; }
  .state p { margin:0; font-size:13px; max-width:300px; }

  /* skeleton */
  .sk { background:linear-gradient(90deg, var(--surface-2) 25%, var(--bg-2) 50%, var(--surface-2) 75%);
        background-size:200% 100%; border-radius:6px; animation:shimmer 1.3s infinite; height:13px; }
  @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }

  /* full-screen states (login/denied/loading) */
  .center { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .login-card { width:min(400px,100%); background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
                padding:38px 34px; text-align:center; box-shadow:var(--sh-2); }
  .login-card .mark { width:54px; height:54px; color:var(--coffee); margin:0 auto 18px; }
  .login-card h1 { font-family:var(--f-display); font-weight:900; font-size:26px; letter-spacing:-0.02em; margin:0; }
  .login-card .tag { font:700 9px/1 var(--f-mono); letter-spacing:0.2em; color:var(--ink-soft); text-transform:uppercase; margin-top:7px; }
  .login-card p { color:var(--ink-soft); font-size:13.5px; line-height:1.5; margin:18px 0 22px; }
  #tg-login-btn { display:flex; justify-content:center; min-height:46px; }

  .spin { width:30px; height:30px; border:3px solid var(--line-strong); border-top-color:var(--coffee); border-radius:50%; animation:rot .8s linear infinite; }
  @keyframes rot { to { transform:rotate(360deg); } }

  .frame { width:100%; height:100%; border:0; display:block; background:var(--bg); }

  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);
           display:flex; align-items:center; gap:9px; background:var(--ink); color:var(--bg);
           padding:11px 17px; border-radius:var(--r); font-size:13px; font-weight:600;
           opacity:0; pointer-events:none; transition:.22s cubic-bezier(.16,1,.3,1); z-index:90; max-width:90vw; box-shadow:var(--sh-2); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast .ico { width:16px; height:16px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  /* ── forms / editor ── */
  .form { display:grid; gap:11px; }
  .field { display:grid; gap:5px; min-width:0; }
  .field > label { font:600 10px/1 var(--f-mono); letter-spacing:0.06em; text-transform:uppercase; color:var(--ink-faint); }
  .field input, .field select { height:36px; padding:0 11px; border:1px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); color:var(--ink); font-size:13.5px; outline:0; width:100%; }
  .field input:focus, .field select:focus { border-color:var(--coffee); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  .form-actions { display:flex; gap:8px; margin-top:4px; }
  .seg { display:flex; gap:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-sm); padding:3px; flex-wrap:wrap; }
  .seg button { flex:1 1 auto; min-width:60px; height:30px; border:0; border-radius:5px; background:transparent; color:var(--ink-soft); font-weight:600; font-size:12px; }
  .seg button.on { background:var(--surface); color:var(--ink); box-shadow:var(--sh-1); }
  .rule { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .rule:last-of-type { border-bottom:0; }
  .rule .r-main { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rule .r-val { font-weight:700; white-space:nowrap; }
  .link { background:transparent; border:0; color:var(--coffee); font-weight:600; font-size:13px; padding:0; display:inline-flex; align-items:center; gap:6px; }
  .link:hover { text-decoration:underline; }
  .link .ico { width:15px; height:15px; }
  #toast .toast-act { margin-left:6px; background:transparent; border:0; color:var(--copper); font-weight:700; font-size:13px; padding:4px 8px; border-radius:6px; }
  #toast .toast-act:hover { background:rgba(255,255,255,.14); }

  @media (max-width: 980px) {
    .md.has-detail { grid-template-columns:1fr; }
    .md.has-detail .md-detail { position:fixed; inset:60px 0 0; z-index:30; border-left:0; }
    .md.has-detail .md-list { display:none; }
    .brand-txt small { display:none; }
  }
</style>
</head>
<body>
<div class="rb" id="root"><div class="center"><div class="spin"></div></div></div>
<div id="toast"></div>

<script>
// ── config: username бота БЕЗ @; домен прописать в @BotFather /setdomain ──
const BOT_USERNAME = "RCR_BtB_bot";
const JWT_KEY = "rb_jwt", USER_KEY = "rb_user", THEME_KEY = "rb_admin_theme";

// ── icons (Lucide-style, stroke 1.5, currentColor) ──
const SVG = {
  orders:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
  clients:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  catalog:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  caret:'<path d="m6 9 6 6 6-6"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9 9 0 0 1 6.7 3L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9 9 0 0 1-6.7-3L3 16"/><path d="M3 21v-5h5"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  alert:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  tag:'<path d="M12.6 2.6a2 2 0 0 0-1.4-.6H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.2 8.2a2 2 0 0 0 2.8 0l6.8-6.8a2 2 0 0 0 0-2.8z"/><circle cx="7" cy="7" r="1.2"/>',
  mark:'<g stroke="currentColor" stroke-width="8.5" stroke-linecap="round" fill="none"><circle cx="50" cy="50" r="43.8"/><path d="M 22.9 21.1 C 64.9 36.9, 35.1 63.1, 77.1 78.9"/></g>',
};
function ico(name, cls){
  const vb = name==="mark" ? "0 0 100 100" : "0 0 24 24";
  const attrs = name==="mark" ? 'fill="none"' : 'fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"';
  return `<span class="ico ${cls||""}"><svg viewBox="${vb}" ${attrs}>${SVG[name]}</svg></span>`;
}

const ST_LABELS = { new:"Новый", paid:"Оплачен", confirmed:"Подтверждён", shipped:"Отправлен", done:"Выполнен", cancelled:"Отменён" };
const ST_ORDER = ["new","paid","confirmed","shipped","done","cancelled"];
const ST_ACTIONS = ["confirmed","shipped","done","cancelled"];

const state = {
  tab:"orders",
  jwt: localStorage.getItem(JWT_KEY) || "",
  user: JSON.parse(localStorage.getItem(USER_KEY) || "null"),
  orders:  { rows:[], counts:{}, filter:"", q:"", sel:null, detail:null, loading:false, err:"", sort:{key:"id",dir:"desc"} },
  clients: { rows:[], q:"", sel:null, detail:null, loading:false, err:"", sort:{key:"last_order_at",dir:"desc"} },
  catalogLoaded:false,
};

// ── helpers ──
const el = (id) => document.getElementById(id);
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function authHeaders(extra){ return Object.assign({ "Authorization":"Bearer "+state.jwt }, extra||{}); }
function fmt(n){ const v=Number(n); return Number.isFinite(v) ? v.toLocaleString("ru-RU") : "-"; }
function money(n){ return fmt(Math.round(Number(n)||0))+" ₽"; }
function dt(s){ const d=parseD(s); return d ? d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "-"; }
function dtShort(s){ const d=parseD(s); return d ? d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "-"; }
function parseD(s){ if(!s) return null; const d=new Date(String(s).replace(" ","T")+(String(s).includes("Z")?"":"Z")); return isNaN(d)?null:d; }
function stPill(s){ const k=ST_LABELS[s]?s:"new"; return `<span class="st st-${esc(k)}">${esc(ST_LABELS[s]||s||"-")}</span>`; }
let toastT;
function toast(msg, kind, action){
  const t=el("toast");
  t.innerHTML=(kind==="err"?ico("alert"):kind==="ok"?ico("check"):"")+`<span>${esc(msg)}</span>`+(action?`<button class="toast-act" id="toast-act">${esc(action.label)}</button>`:"");
  t.classList.add("show");
  if(action){ const a=el("toast-act"); if(a) a.onclick=()=>{ t.classList.remove("show"); action.cb(); }; }
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"), action?6000:3000);
}
function sortRows(rows, sort){
  const {key,dir}=sort, m=dir==="asc"?1:-1;
  return [...rows].sort((a,b)=>{
    let x=a[key], y=b[key];
    if(key==="created_at"||key==="last_order_at"){ x=parseD(x)?.getTime()||0; y=parseD(y)?.getTime()||0; }
    else if(typeof x==="string"||typeof y==="string"){ x=String(x||"").toLowerCase(); y=String(y||"").toLowerCase(); }
    else { x=Number(x)||0; y=Number(y)||0; }
    return x<y?-m : x>y?m : 0;
  });
}
function thSort(label, key, sort, fn, extra){
  const on = sort.key===key;
  return `<th class="sortable ${extra||""}" ${on?`aria-sort="${sort.dir==="asc"?"ascending":"descending"}"`:""} onclick="${fn}('${key}')">
    <span class="th">${esc(label)}${ico("caret","caret")}</span></th>`;
}

async function api(path, opts){
  const r = await fetch(path, Object.assign({ cache:"no-store" }, opts, { headers: authHeaders((opts&&opts.headers)||{}) }));
  if(r.status===401||r.status===403){ logout(true); throw new Error("Нет доступа"); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok || j.error) throw new Error(j.error || ("HTTP "+r.status));
  return j;
}

window.onTelegramAuth = async function(user){
  try {
    const r = await fetch("/tma/api/auth/telegram", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(user) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.token) throw new Error(j.error || "Не удалось войти");
    state.jwt=j.token; state.user=j.user||user;
    localStorage.setItem(JWT_KEY, state.jwt); localStorage.setItem(USER_KEY, JSON.stringify(state.user));
    boot();
  } catch(e){ toast(e.message||"Ошибка входа","err"); }
};
function logout(silent){
  state.jwt=""; state.user=null;
  localStorage.removeItem(JWT_KEY); localStorage.removeItem(USER_KEY);
  renderLogin(); if(silent) toast("Сессия истекла, войдите снова","err");
}
async function boot(){
  if(!state.jwt){ renderLogin(); return; }
  el("root").innerHTML = `<div class="center"><div class="spin"></div></div>`;
  try {
    const r = await fetch("/tma/api/admin/check", { headers: authHeaders() });

    if(!j.is_admin){ renderDenied(); return; }
    renderApp(); loadOrders();

}

function skeletonTable(cols, rows){
  let h=`<table class="grid"><tbody>`;
  for(let i=0;i<(rows||8);i++){ h+=`<tr>`; for(let c=0;c<cols;c++){ h+=`<td><div class="sk" style="width:${40+Math.round(((i*7+c*13)%5)*12)}%"></div></td>`; } h+=`</tr>`; }
  return h+`</tbody></table>`;
}

// Текущий процент восстанавливаем из суммы: в orders.discount лежат рубли.
function orderDiscountPct(d){
  const disc=Number(d.discount)||0, total=Number(d.total)||0, base=disc+total;
  return base>0 ? Math.round(disc/base*100) : 0;
}

async function applyOrderDiscount(id){
  const el=document.getElementById("ord-disc");
  const pct=Number(el && el.value);
  if(!(pct>=0 && pct<=100)){ toast("Скидка от 0 до 100%","err"); return; }
  try{
    const j=await api("/tma/api/admin/order/"+id+"/discount",{ method:"POST",
      headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ discount_pct: pct }) });
    const o=state.orders;
    if(o.detail&&o.detail.id===id){ o.detail.total=j.total; o.detail.discount=j.discount; }
    const row=o.rows.find(r=>r.id===id); if(row){ row.total=j.total; row.discount=j.discount; }
    renderOrdersBody(); renderOrderDetail();
    toast(`Скидка ${pct}% — итог ${j.total} ₽`,"ok");
  }catch(e){ toast(e.message||"Не удалось применить скидку","err"); }
}
function patchOrderRow(id, status){
  const o=state.orders;
  const tr=document.querySelector(`#ord-body tr.row[data-oid="${id}"]`);
  if(!tr){ if(!o.filter||o.filter===status) renderOrdersBody(); return; }
  if(o.filter && o.filter!==status){ tr.remove(); return; }
  const cell=tr.querySelector(".stcell"); if(cell) cell.innerHTML=stPill(status);
}
async function setOrderStatus(id, status, opts){
  opts=opts||{};
  const o=state.orders;
  const row=o.rows.find(r=>r.id===id);
  const prev=(o.detail&&o.detail.id===id?o.detail.status:undefined) ?? (row&&row.status);
  if(prev===status) return;
  if(row) row.status=status;
  if(o.detail&&o.detail.id===id) o.detail.status=status;
  if(o.counts){ if(prev&&o.counts[prev]!=null) o.counts[prev]=Math.max(0,o.counts[prev]-1); o.counts[status]=(o.counts[status]||0)+1; }
  renderOrdersChips(); patchOrderRow(id,status); renderOrderDetail();
  try {
    await api("/tma/api/admin/order/"+id+"/status",{ method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ status }) });
    if(!opts.isUndo) toast(`Статус: ${ST_LABELS[status]}`,"ok",{ label:"Отменить", cb:()=>setOrderStatus(id,prev,{isUndo:true}) });
  } catch(e){
    if(row) row.status=prev; if(o.detail&&o.detail.id===id) o.detail.status=prev;
    if(o.counts){ if(o.counts[status]!=null) o.counts[status]=Math.max(0,o.counts[status]-1); if(prev) o.counts[prev]=(o.counts[prev]||0)+1; }
    renderOrdersChips(); renderOrdersBody(); renderOrderDetail();
    toast(e.message||"Не удалось обновить статус","err");
  }
}

  renderClientDetail();
}
function closeClient(){ const c=state.clients; c.detail=null; c.sel=null; c.edit=false; c.addRule=false; renderClientDetail(); markClientSel(); }

function clientDetailHTML(d){
  const c=state.clients;
  const orders=d.orders||[];
  const tier=d.price_tier||"standard";
  const profileBlock = c.edit ? clientEditFormHTML(d) : `
    <dl class="kv">${[["Имя",d.name||d.tg_name],["Телефон",d.phone],["Тип",d.user_type],["Компания",d.company_name],["ИНН",d.inn],["Email",d.email],["Город",d.city],["Адрес",d.address||d.actual_address],["User ID",d.user_id]]
      .filter(([,v])=>v!==undefined&&v!==null&&v!=="")
      .map(([k,v])=>`<dt>${esc(k)}</dt><dd${(k==="User ID"||k==="ИНН"||k==="Телефон")?' class="num"':""}>${esc(v)}</dd>`).join("")}</dl>
    <div style="margin-top:12px"><button class="link" onclick="editClient()">${ico("edit")}<span>Редактировать данные</span></button></div>`;
  const rules=d._rules||[];
  return `<div class="dp">
    <div class="dp-top"><div class="dp-head"><div><h2>${esc(d.name||d.tg_name||("Клиент "+d.user_id))}</h2>
      <div class="dp-sub">${d.tg_name?`<span class="num">@${esc(String(d.tg_name).replace(/^@/,""))}</span>`:""}<span>рег. ${dtShort(d.created_at)}</span></div></div>
      <button class="iconbtn" aria-label="Закрыть" onclick="closeClient()">${ico("x")}</button></div></div>

    <div class="card"><div class="sec-title">Данные клиента</div>${profileBlock}</div>

    <div class="card"><div class="sec-title">Прайс-уровень</div>
      <div class="seg">${TIERS.map(([v,l])=>`<button class="${tier===v?"on":""}" onclick="setTier(${d.user_id},'${v}')">${esc(l)}</button>`).join("")}</div>
      <div class="sub" style="margin-top:8px">Базовая колонка прайса для клиента. Опт = оптовые цены Bishop.</div></div>

    <div class="card"><div class="sec-title">Персональные скидки · ${rules.length}</div>
      ${rules.length?rules.map(r=>ruleRowHTML(r)).join(""):`<div class="muted" style="font-size:13px">Точечных правил нет.</div>`}
      ${c.addRule?addRuleFormHTML(d):`<div style="margin-top:12px"><button class="link" onclick="toggleAddRule()">${ico("plus")}<span>Добавить правило</span></button></div>`}</div>

    <div class="card"><div class="sec-title">Заказы · ${orders.length}</div>
      <table class="items"><tbody>${orders.map(o=>`<tr class="orow" onclick="gotoOrder(${o.id})">
        <td class="num strong">№${o.id}</td><td class="muted num">${dtShort(o.created_at)}</td>
        <td>${stPill(o.status)}</td><td class="num right strong">${money(o.total)}</td></tr>`).join("")||`<tr><td class="muted">Заказов нет</td></tr>`}</tbody></table></div></div>`;
}
function clientEditFormHTML(d){
  const f=(id,label,val,type)=>`<div class="field"><label for="ce-${id}">${esc(label)}</label><input id="ce-${id}" type="${type||"text"}" value="${esc(val||"")}"></div>`;
  return `<div class="form">
    ${f("name","Имя / Название",d.name)}
    <div class="grid2">${f("phone","Телефон",d.phone,"tel")}${f("email","Email",d.email,"email")}</div>
    <div class="field"><label for="ce-user_type">Тип</label><select id="ce-user_type">
      ${[["individual","Физлицо"],["b2b","B2B / Опт"],["company","Компания"]].map(([v,l])=>`<option value="${v}" ${(d.user_type||"")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    ${f("company_name","Компания",d.company_name)}
    <div class="grid2">${f("inn","ИНН",d.inn)}${f("actual_address","Адрес",d.actual_address||d.address)}</div>
    ${f("legal_address","Юр. адрес",d.legal_address)}
    <div class="form-actions"><button class="act primary" onclick="saveClient(${d.user_id})">${ico("check")}<span>Сохранить</span></button>
      <button class="act" onclick="cancelEditClient()">Отмена</button></div></div>`;
}
function ruleRowHTML(r){
  const scopeLbl={all:"Весь заказ",category:"Категория",subcategory:"Подкатегория",product:"Товар"}[r.scope]||r.scope;
  const tgt = r.scope==="all" ? "" : (r.scope==="product" ? (metaProductName(r.target_id)) : r.target_id);
  const val = r.discount_pct!=null ? `−${fmt(r.discount_pct)}%` : (r.fixed_price!=null ? money(r.fixed_price) : "");
  return `<div class="rule"><div class="r-main"><span class="muted">${esc(scopeLbl)}</span> ${esc(tgt||"")}${r.fasovka?` <span class="faint">· ${esc(r.fasovka)}</span>`:""}</div>
    <span class="r-val">${val}</span>
    <button class="iconbtn" aria-label="Удалить правило" onclick="delRule(${r.id})">${ico("trash")}</button></div>`;
}
function metaProductName(id){ const p=(META&&META.products_lite||[]).find(x=>x.id===id); return p?p.name:id; }
function addRuleFormHTML(d){
  const subs=[...new Set(Object.values((META&&META.subcategories)||{}).flat())].sort();
  return `<div class="form" style="margin-top:12px; padding-top:12px; border-top:1px solid var(--line)">
    <div class="grid2">
      <div class="field"><label for="pr-scope">Область</label><select id="pr-scope" onchange="onScopeChange()">
        ${[["all","Весь заказ"],["category","Категория"],["subcategory","Подкатегория"],["product","Товар"]].map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select></div>
      <div class="field" id="pr-target-wrap"><label for="pr-target">Цель</label><select id="pr-target"></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label for="pr-type">Тип</label><select id="pr-type">
        <option value="discount">Скидка %</option><option value="fixed">Фикс. цена ₽</option></select></div>
      <div class="field"><label for="pr-value">Значение</label><input id="pr-value" type="number" min="0" step="1" placeholder="напр. 15"></div>
    </div>
    <div class="form-actions"><button class="act primary" onclick="saveRule(${d.user_id})">${ico("plus")}<span>Добавить</span></button>
      <button class="act" onclick="toggleAddRule()">Отмена</button></div></div>`;
}
const META_SUBS=()=>[...new Set(Object.values((META&&META.subcategories)||{}).flat())].sort();
function onScopeChange(){
  const scope=el("pr-scope").value, wrap=el("pr-target-wrap"), sel=el("pr-target");
  if(scope==="all"){ wrap.style.display="none"; return; }
  wrap.style.display="";
  let opts=[];
  if(scope==="category") opts=(META.categories||[]).map(v=>[v,v]);
  else if(scope==="subcategory") opts=META_SUBS().map(v=>[v,v]);
  else if(scope==="product") opts=(META.products_lite||[]).map(p=>[p.id,p.name]);
  sel.innerHTML=opts.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join("")||`<option value="">нет данных</option>`;
}
function editClient(){ state.clients.edit=true; renderClientDetail(); }
function cancelEditClient(){ state.clients.edit=false; renderClientDetail(); }
function toggleAddRule(){ state.clients.addRule=!state.clients.addRule; renderClientDetail(); if(state.clients.addRule) setTimeout(onScopeChange,0); }
async function saveClient(id){
  const f=(k)=>{ const e=el("ce-"+k); return e?e.value.trim():undefined; };
  const body={ name:f("name"), phone:f("phone"), email:f("email"), user_type:f("user_type"),
    company_name:f("company_name"), inn:f("inn"), actual_address:f("actual_address"), legal_address:f("legal_address") };
  try{
    const j=await api("/tma/api/admin/user/"+id,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    const d=state.clients.detail; Object.assign(d, j.user||body); state.clients.edit=false; renderClientDetail();
    const row=state.clients.rows.find(r=>r.user_id===id); if(row){ row.name=d.name; row.phone=d.phone; } renderClientsBody(); markClientSel();
    toast("Данные сохранены","ok");
  }catch(e){ toast(e.message,"err"); }
}
async function setTier(id, tier){
  const d=state.clients.detail; const prev=d.price_tier||"standard"; if(prev===tier) return;
  d.price_tier=tier; renderClientDetail();
  try{ await api("/tma/api/admin/user/"+id,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({price_tier:tier}) });
    toast(`Прайс: ${TIER_LABEL[tier]}`,"ok");
  }catch(e){ d.price_tier=prev; renderClientDetail(); toast(e.message,"err"); }
}
async function saveRule(id){
  const scope=el("pr-scope").value;
  const target=(scope==="all")?"":(el("pr-target")?el("pr-target").value:"");
  const type=el("pr-type").value, raw=el("pr-value").value;
  const num=parseFloat(raw);
  if(!Number.isFinite(num)){ toast("Введите значение","err"); return; }
  if(scope!=="all" && !target){ toast("Выберите цель","err"); return; }
  const body={ scope, target_id:target };
  if(type==="discount") body.discount_pct=num; else body.fixed_price=num;
  try{
    await api("/tma/api/admin/user/"+id+"/pricing",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
    const pr=await api("/tma/api/admin/user/"+id+"/pricing").catch(()=>({rules:[]}));
    state.clients.detail._rules=pr.rules||[]; state.clients.addRule=false; renderClientDetail();
    toast("Правило добавлено","ok");
  }catch(e){ toast(e.message,"err"); }
}
async function delRule(ruleId){
  const id=state.clients.sel;
  try{
    await api("/tma/api/admin/pricing/"+ruleId+"/delete",{ method:"POST" });
    const pr=await api("/tma/api/admin/user/"+id+"/pricing").catch(()=>({rules:[]}));
    state.clients.detail._rules=pr.rules||[]; renderClientDetail();
    toast("Правило удалено","ok");
  }catch(e){ toast(e.message,"err"); }
}
async function gotoOrder(id){ switchTab("orders"); state.orders.filter=""; await loadOrders(); await openOrder(id); }

// ── shared ──
function wireSearch(id, cb){
  const s=el(id); if(!s) return;
  s.oninput=(e)=>{ const pos=e.target.selectionStart; cb(e.target.value); const n=el(id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos);}catch(_){} } };
}
function rowKey(e, fn){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); fn(); } }
document.addEventListener("keydown",(e)=>{ if(e.key==="Escape"){ if(state.tab==="orders"&&state.orders.detail) closeOrder(); else if(state.tab==="clients"&&state.clients.detail) closeClient(); } });

initTheme();
boot();
</script>
</body>
</html>
